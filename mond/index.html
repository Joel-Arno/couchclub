      const pr = projs[i], t = T - pr.t0, total = pr.hit + 160 + pr.back;
      if (t > total){ projs.splice(i, 1); P.hideW = false; continue; }
      const hand = P.sk ? toWorld(P, P.sk.handA) : [P.x, P.gy - P.H * .6], tgt = chestPt(E);
      const k = t < pr.hit ? EASE.out(t / pr.hit) : t < pr.hit + 160 ? 1 : 1 - EASE.in((t - pr.hit - 160) / pr.back);
      const x = lerp(hand[0], tgt[0], k), y = lerp(hand[1], tgt[1], k);
      ctx.save(); ctx.strokeStyle = 'rgba(180,196,212,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hand[0], hand[1]);
      ctx.quadraticCurveTo((hand[0] + x) / 2, Math.max(hand[1], y) + 20 * (1 - k), x, y); ctx.stroke();
      ctx.translate(x, y); ctx.rotate(Math.atan2(tgt[1] - hand[1], tgt[0] - hand[0]));
      ctx.fillStyle = INK; ctx.strokeStyle = RIM; ctx.lineWidth = P.H * .016;
      ctx.beginPath(); ctx.moveTo(-P.H * .5, 0); ctx.lineTo(0, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -P.H * .03); ctx.lineTo(P.H * .12, 0); ctx.lineTo(0, P.H * .03); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  return {
    start, stop, update, drawFx, drawActors, press, release, hook,
    on: () => on, def: () => def, pl: () => pl, en: () => en, key: () => key,
    count: () => [idx, queue.length], glut: () => glut, hintenDef: () => hinten && hinten.def,
    setPaused(v){ paused = v; if (v && pl){ pl.blockHeld = false; pl.heavyHeld = false; } },
    paused: () => paused,
    critReady: () => on && en && en.st === 'broken',
    debug: () => ({ T, pl, en, tells, W, hinten })
  };
})();

/* =====================================================================
   ERKUNDUNG: Laufen, Springen, Klettern und alles, was in der Welt steht
   Die Spielfigur ist Stage.P. Gegner, Figuren und Gegenstände sind
   Einträge in ents. Was der Spielstand wissen muss (besiegt, genommen,
   geöffnet), meldet die Erkundung über hook an den Ablauf.
   ===================================================================== */
const HELD_H = 92;
const PHYS = { lauf: 170, beschl: 1500, luft: 950, g: 1750, sprung: 505, fallMax: 900, kletter: 115, rolle: 300, rolleDauer: 320, hw: 9, hoehe: 74, coyote: 90, puffer: 130 };

const Erk = (() => {
  let G = null, ents = [], zeit = 0, aus = false, lastInter = null, DD = null;
  const S = { x: 0, y: 0, vx: 0, vy: 0, boden: false, leiter: false, face: 1, coyote: 0, puffer: 0, rolle: 0, rolleCd: 0, unverw: 0,
    landT: 0, stegAus: 0, sicher: [0, 0], sicherT: 0, wasser: false, tief: 0, schritt: 0, stoss: 0, aktionT: 0, aktionArt: null, fallStart: 0 };
  const hook = { schaden(){}, kampf(){}, boss(){}, dialog(){}, feuer(){}, lesen(){}, beute(){}, tuer(){}, ereignis(){}, merke(){}, hinweis(){}, ausgang(){}, laut(){} };
  const key = id => G.id + ':' + id;

  /* ---------- Gebiet betreten ---------- */
  // wo: Anker-Buchstabe, Eingangs-Id oder { x, y }
  function betrete(id, wo, D){
    G = ladeGebiet(id); DD = D;
    // Was sich schon geändert hat: zerbrochene Wände, offene Gitter
    const kaputt = G.F.brueche.filter(b => D.bruch[key(b.tx + ',' + b.ty0)]);
    if (kaputt.length){ kaputt.forEach(b => { for (let y = b.ty0; y < b.ty1; y++) setzeKachel(G, b.tx, y, K.luft); }); baueFormen(G); }
    G.gitter.forEach(g => { if (D.offen[key('g' + g.tx + ',' + g.ty0)]) oeffneGitter(G, g, true); });
    ents = [];
    const O = G.def.o || {};
    for (const a in O){
      const def = O[a], pos = G.anker[a];
      if (!pos){ console.warn('Anker fehlt', id, a); continue; }
      const e = { a, id: def.id || a, def, typ: def.t, tx: pos[0], ty: pos[1], x: (pos[0] + .5) * T, y: (pos[1] + 1) * T, t: rnd() * 1000 };
      // Auf den Boden stellen, falls der Anker in der Luft steht
      if (!def.schwebt) e.y = bodenUnter(G, e.x, e.y - T * .5);
      if (!erzeuge(e, D)) continue;
      ents.push(e);
    }
    // Startpunkt
    let sx, sy;
    if (typeof wo === 'object' && wo){ sx = wo.x; sy = wo.y; }
    else {
      const e = ents.find(x => (x.typ === 'eingang' && x.id === wo) || x.a === wo) || ents.find(x => x.typ === 'start') || ents[0];
      sx = e ? e.x : T * 2; sy = e ? e.y : bodenUnter(G, T * 2, 0);
      if (e && e.def.richtung) S.face = e.def.richtung;
    }
    Object.assign(S, { x: sx, y: sy, vx: 0, vy: 0, boden: true, leiter: false, rolle: 0, unverw: 800, landT: 0, sicher: [sx, sy], wasser: false, tief: 0, stoss: 0, aktionT: 0 });
    World.setArea(G);
    World.setLights(ents.filter(e => e.licht).map(e => e.licht));
    const P = Stage.P; P.x = S.x; P.gy = S.y; P.face = S.face; P.H = HELD_H; P.poseFn = bewegungsPose; P.bew = { m: 'stand' }; P.alpha = 1; P.hideW = false; P.stance = null; P.anim = null;
    World.release(); World.follow(S.x, S.y, S.face, true);
    aus = false;
    return G;
  }
  // Ein Eintrag aus der Karte wird zum Ding in der Welt. false: gibt es nicht (mehr)
  function erzeuge(e, D){
    const d = e.def;
    if (d.wenn && !d.wenn(D)) return false;
    switch (e.typ){
      case 'feind': {
        if (D.tot[key(e.id)]) return false;
        const k = d.g, F = FEINDE[k];
        e.actor = makeActor({ set: F.set, look: LOOK[F.look || F.set], face: d.blick || -1, H: HELD_H * (LOOK[F.look || F.set].scale || 1) });
        e.actor.poseFn = bewegungsPose; e.actor.bew = { m: 'stand' };
        e.key = k; e.face = d.blick || -1; e.home = e.x; e.zustand = d.liegt ? 'liegt' : d.lauert ? 'lauert' : 'ruhe';
        e.pat = d.patrouille ? [e.x - d.patrouille[0] * T, e.x + d.patrouille[1] * T] : null; e.ziel = null; e.wait = rr(500, 2500);
        e.gruppe = d.gruppe || e.id;
        if (d.liegt){ e.actor.stance = 'lie'; e.actor.pose = mkPose({}, SETS[F.set].lie || SETS[F.set].idle); e.actor.poseFn = null; }
        return true;
      }
      case 'boss': {
        if (D.bosse[d.boss]) return false;
        const F = FEINDE[d.boss];
        e.actor = makeActor({ set: F.set, look: LOOK[F.look || F.set], face: d.blick || -1, H: HELD_H * (LOOK[F.look || F.set].scale || 1) });
        e.key = d.boss; e.zustand = 'wartet';
        return true;
      }
      case 'npc': {
        const n = NPC[d.id];
        e.actor = makeActor({ set: 'npc', look: LOOK[n.look], face: d.blick || -1, H: HELD_H * (LOOK[n.look].scale || 1) });
        if (d.sitzt){ e.actor.stance = 'kneel'; e.actor.pose = mkPose({}, SETS.npc.kneel || SETS.npc.idle); }
        if (n.look === 'enna') e.licht = { x: e.x, y: e.y - 40, r: 110, col: 'rgba(255,200,140,.6)', a: .25, flacker: true };
        return true;
      }
      case 'feuer':
        e.licht = { x: e.x, y: e.y - 30, r: d.brunnen ? 260 : 300, col: 'rgba(255,170,90,.8)', a: D.lit[d.id] ? .38 : .12, flacker: true, hell: 1.8 };
        return true;
      case 'gegenstand': case 'leiche': case 'truhe':
        if (D.genommen[key(e.id)]){ if (e.typ === 'gegenstand') return false; e.leer = true; }
        return true;
      case 'schrift': return true;
      case 'tuer': e.offen = !d.zu || !!D.offen[key(e.id)]; return true;
      case 'hebel': e.an = !!D.offen[key(e.id)]; return true;
      case 'ereignis': if (d.einmal !== false && D.ereignisse[key(e.id)]) return false; return true;
      case 'licht': e.licht = { x: e.x, y: e.y - (d.hoehe || 2) * T, r: d.r || 140, col: d.farbe || 'rgba(255,190,120,.8)', a: d.a || .3, flacker: d.flacker !== false }; return true;
      case 'nebeltor': if (D.bosse[d.boss]) return false; return true;
      default: return true;
    }
  }

  /* ---------- Kollision ---------- */
  function spalten(x0, x1){ return [tileAt(x0), tileAt(x1)]; }
  function blockiertX(nx, y){
    const [c0, c1] = spalten(nx - PHYS.hw, nx + PHYS.hw), r0 = tileAt(y - PHYS.hoehe + 1), r1 = tileAt(y - 1);
    for (let tx = c0; tx <= c1; tx++) for (let ty = r0; ty <= r1; ty++) if (istFest(G, tx, ty)) return [tx, ty];
    return null;
  }
  function bewegeX(dx){
    if (!dx) return;
    const nx = S.x + dx, b = blockiertX(nx, S.y);
    if (!b){ S.x = nx; return; }
    // Kleine Stufen läuft man hinauf
    if (S.boden && !S.leiter){
      const stufe = tileAt(S.y - 1) * T;
      if (S.y - stufe <= T + .5 && !blockiertX(nx, stufe) && !kopfStoss(S.x, stufe)){ S.y = stufe; S.x = nx; S.landT = Math.max(S.landT, 60); return; }
    }
    S.x = dx > 0 ? b[0] * T - PHYS.hw - .01 : (b[0] + 1) * T + PHYS.hw + .01;
    S.vx = 0;
  }
  function kopfStoss(x, y){ const [c0, c1] = spalten(x - PHYS.hw, x + PHYS.hw), r = tileAt(y - PHYS.hoehe); for (let tx = c0; tx <= c1; tx++) if (istFest(G, tx, r)) return true; return false; }
  function bewegeY(dy){
    const [c0, c1] = spalten(S.x - PHYS.hw + 1, S.x + PHYS.hw - 1);
    if (dy > 0){
      const ny = S.y + dy, r = tileAt(ny), top = r * T;
      for (let tx = c0; tx <= c1; tx++){
        const fest = istFest(G, tx, r), traeg = traegt(G, tx, r) && S.y <= top + .5 && S.stegAus <= 0 && !S.leiter;
        if ((fest || traeg) && ny >= top){ S.y = top; S.vy = 0; return true; }
      }
      S.y = ny; return false;
    }
    const ny = S.y + dy, r = tileAt(ny - PHYS.hoehe);
    for (let tx = c0; tx <= c1; tx++) if (istFest(G, tx, r)){ S.y = (r + 1) * T + PHYS.hoehe; S.vy = 0; return false; }
    S.y = ny; return false;
  }
  function stehtAuf(){
    const [c0, c1] = spalten(S.x - PHYS.hw + 1, S.x + PHYS.hw - 1), r = tileAt(S.y + .5);
    if (Math.abs(S.y - r * T) > .6) return false;
    for (let tx = c0; tx <= c1; tx++) if (istFest(G, tx, r) || (traegt(G, tx, r) && S.stegAus <= 0)) return true;
    return false;
  }
  const leiterAn = (x, y) => kachel(G, tileAt(x), tileAt(y)) === K.leiter;

  /* ---------- Spielfigur ---------- */
  function spieler(dt){
    const s = dt / 1000, ix = Eingabe.x(), iy = Eingabe.y();
    S.coyote -= dt; S.puffer -= dt; S.rolleCd -= dt; S.unverw -= dt; S.landT -= dt; S.stegAus -= dt; S.aktionT -= dt;
    if (Eingabe.neu('sprung')) S.puffer = PHYS.puffer;
    const wasser = wasserAn(G, S.x, S.y - 4), tief = wasser ? S.y - wasser.y0 : 0;
    S.wasser = !!wasser; S.tief = tief;
    const langsam = wasser ? (tief > 40 ? .5 : .72) : 1;
    // Aktion am Ort hält die Figur kurz fest
    if (S.aktionT > 0){ S.vx = 0; ix && (S.face = Math.sign(ix)); }
    // Rolle
    if (S.rolle > 0){
      S.rolle -= dt;
      S.vx = S.face * PHYS.rolle * (S.rolle > 60 ? 1 : .4);
    } else if (Eingabe.neu('rolle') && S.rolleCd <= 0 && S.boden && !S.leiter && S.aktionT <= 0){
      S.rolle = PHYS.rolleDauer; S.rolleCd = PHYS.rolleDauer + 250; if (ix) S.face = Math.sign(ix);
      hook.laut('dodge'); World.ghost(Stage.P);
    }
    // Leiter
    if (!S.leiter && Math.abs(iy) > .5 && S.rolle <= 0){
      const obenDrauf = iy > 0 && S.boden && leiterAn(S.x, S.y + 2);
      if (leiterAn(S.x, S.y - 30) || obenDrauf){
        S.leiter = true; S.vx = 0; S.x = (tileAt(S.x) + .5) * T; if (obenDrauf) S.y += 3;
      }
    }
    if (S.leiter){
      S.vy = iy * PHYS.kletter;
      S.y += S.vy * s;
      S.schritt += Math.abs(S.vy) * s * .09;
      if (!leiterAn(S.x, S.y - 4) && !leiterAn(S.x, S.y - 40)){ S.leiter = false; }
      if (iy < 0 && !leiterAn(S.x, S.y - 8)){
        // oben angekommen: auf die Oberkante steigen
        S.y = tileAt(S.y - 1 + T) * T; S.leiter = false; S.boden = true;
      }
      if (iy > 0 && (istFest(G, tileAt(S.x), tileAt(S.y + 1)))){ S.y = tileAt(S.y + 1) * T; S.leiter = false; }
      if (S.puffer > 0){ S.leiter = false; S.puffer = 0; S.vy = -PHYS.sprung * .6; S.vx = (ix || S.face) * PHYS.lauf * .6; }
      else if (Math.abs(ix) > .7 && Math.abs(iy) < .3 && stehtAuf()){ S.leiter = false; }
      if (S.leiter) return;
    }
    // Laufen
    if (S.rolle <= 0 && S.aktionT <= 0){
      const ziel = ix * PHYS.lauf * langsam, a = (S.boden ? PHYS.beschl : PHYS.luft) * s;
      S.vx = S.vx < ziel ? Math.min(ziel, S.vx + a) : Math.max(ziel, S.vx - a);
      if (Math.abs(ix) > .15) S.face = Math.sign(ix);
    }
    if (S.stoss){ S.vx += S.stoss; S.stoss *= .82; if (Math.abs(S.stoss) < 4) S.stoss = 0; }
    // Springen, auch kurz nach dem Rand, auch kurz vor der Landung gedrückt
    if (S.puffer > 0 && (S.boden || S.coyote > 0) && S.rolle <= 0 && S.aktionT <= 0){
      if (iy > .6 && stegUnter()){ S.stegAus = 220; S.y += 2; S.boden = false; }
      else { S.vy = -PHYS.sprung * (wasser && tief > 40 ? .75 : 1); S.boden = false; S.coyote = 0; hook.laut('sprung'); }
      S.puffer = 0;
    }
    if (!Eingabe.halt('sprung') && S.vy < -150) S.vy *= Math.pow(.86, dt / 16);
    S.vy = Math.min(PHYS.fallMax * (wasser ? .45 : 1), S.vy + PHYS.g * s * (wasser ? .5 : 1));
    const warBoden = S.boden, vorY = S.y, fallV = S.vy;
    bewegeX(S.vx * s);
    const gelandet = bewegeY(S.vy * s);
    S.boden = gelandet || (S.vy >= 0 && stehtAuf());
    if (S.boden){
      S.coyote = PHYS.coyote;
      if (!warBoden){ if (fallV > 420){ S.landT = 180; hook.laut('landen'); World.burst(S.x, S.y, 'staub', 5); } }
    }
    if (S.boden && S.rolle <= 0) S.schritt += Math.abs(S.vx) * s * .055;
    else if (!S.boden && warBoden && S.vy >= 0) S.fallStart = S.y;
    // Sicherer Ort zum Zurücksetzen
    S.sicherT -= dt;
    if (S.boden && !wasser && S.sicherT <= 0 && !gefahrNahe()){ S.sicher = [S.x, S.y]; S.sicherT = 400; }
    // Tiefes Wasser zieht hinab, Abgründe auch
    if (wasser && tief > 76) return zurueck('wasser');
    if (S.y > G.Hh + T * 4) return zurueck('sturz');
    // Stacheln
    const k = kachel(G, tileAt(S.x), tileAt(S.y - 4));
    if (k === K.stachel && S.unverw <= 0){
      S.unverw = 1000; S.vy = -PHYS.sprung * .7; S.stoss = -S.face * 60; S.boden = false;
      hook.schaden(.18, 'stachel'); World.burst(S.x, S.y - 10, 'salz', 12);
    }
    // Rand des Gebiets
    if (S.x < -PHYS.hw) randAus('l'); else if (S.x > G.W + PHYS.hw) randAus('r');
    // Schritte hörbar machen
    if (S.boden && Math.abs(S.vx) > 40 && Math.floor(S.schritt / Math.PI) !== Math.floor((S.schritt - Math.abs(S.vx) * s * .055) / Math.PI)) hook.laut(wasser ? 'platsch' : 'schritt');
  }
  function stegUnter(){ const r = tileAt(S.y + .5); const [c0, c1] = spalten(S.x - PHYS.hw + 1, S.x + PHYS.hw - 1); for (let tx = c0; tx <= c1; tx++) if (traegt(G, tx, r) && kachel(G, tx, r) === K.steg) return true; return false; }
  function gefahrNahe(){ for (let dx = -2; dx <= 2; dx++){ const k = kachel(G, tileAt(S.x) + dx, tileAt(S.y - 4)), k2 = kachel(G, tileAt(S.x) + dx, tileAt(S.y + 4)); if (k === K.stachel || k2 === K.luft && dx === 0) return true; } return false; }
  function zurueck(grund){
    aus = true;
    hook.schaden(.2, grund, () => {
      S.x = S.sicher[0]; S.y = S.sicher[1]; S.vx = S.vy = 0; S.unverw = 1200; S.leiter = false; S.rolle = 0; S.boden = true;
      World.follow(S.x, S.y, S.face, true); aus = false;
    });
  }
  function randAus(seite){
    const ziel = (G.def.links || {})[seite];
    if (!ziel){ S.x = clamp(S.x, PHYS.hw, G.W - PHYS.hw); S.vx = 0; return; }
    aus = true; hook.ausgang(ziel);
  }

  /* ---------- Figur zeichnen: Bewegung in Posen übersetzen ---------- */
  function heldPose(dt){
    const P = Stage.P;
    P.x = S.x; P.gy = S.y; P.face = S.face;
    if (S.unverw > 0 && S.unverw < 900) P.alpha = .55 + .45 * Math.abs(Math.sin(zeit * .025)); else P.alpha = 1;
    let b;
    if (S.aktionT > 0) b = { m: S.aktionArt || 'hocke' };
    else if (S.rolle > 0) b = { m: 'rolle', k: 1 - S.rolle / PHYS.rolleDauer };
    else if (S.leiter) b = { m: 'klettern', ph: S.schritt * 2 };
    else if (S.wasser && S.tief > 40) b = { m: 'schwimm', ph: zeit * .006 };
    else if (!S.boden) b = { m: S.vy < 0 ? 'sprung' : 'fall' };
    else if (S.landT > 0) b = { m: 'landen' };
    else if (Math.abs(S.vx) > 12) b = { m: 'lauf', ph: S.schritt, st: Math.min(1, Math.abs(S.vx) / PHYS.lauf) };
    else b = { m: 'stand' };
    P.bew = b; P.poseFn = bewegungsPose;
    P.hideW = b.m === 'klettern' || b.m === 'schwimm';
    P.mix = b.m === 'lauf' || b.m === 'klettern' ? .05 : b.m === 'rolle' ? .09 : .025;
    updateActor(P, dt);
  }

  /* ---------- Gegner in der Welt ---------- */
  function gegner(dt){
    const s = dt / 1000;
    for (const e of ents){
      if (e.typ === 'boss'){ if (!e.imKampf){ updateActor(e.actor, dt); e.actor.x = e.x; e.actor.gy = e.y; } continue; }
      if (e.typ !== 'feind' || e.zustand === 'tot' || e.imKampf) continue;
      const A = e.actor, dx = S.x - e.x, dy = S.y - e.y, dist = Math.abs(dx);
      e.t += dt;
      switch (e.zustand){
        case 'liegt':
          if (dist < T * 3.5 && Math.abs(dy) < T * 3) aufstehen(e);
          break;
        case 'lauert':
          if (dist < T * (e.def.lauert || 3) && Math.abs(dy) < T * 4){
            e.zustand = 'wach'; e.alarmT = 350; hook.laut('danger');
            if (e.def.von === 'oben'){ e.y = bodenUnter(G, e.x, e.y); World.burst(e.x, e.y, 'staub', 10); }
            else if (e.def.von === 'wasser') World.burst(e.x, e.y, 'splash', 18);
            gruppeWach(e);
          }
          break;
        case 'steigt':
          e.aufT -= dt; if (e.aufT <= 0){ e.zustand = 'wach'; e.alarmT = 0; A.poseFn = bewegungsPose; A.stance = null; }
          break;
        case 'ruhe': {
          // Patrouille
          if (e.pat){
            if (e.wait > 0){ e.wait -= dt; A.bew = { m: 'stand' }; }
            else {
              if (e.ziel == null) e.ziel = e.x < (e.pat[0] + e.pat[1]) / 2 ? e.pat[1] : e.pat[0];
              const dir = Math.sign(e.ziel - e.x); e.face = dir || e.face;
              e.x += dir * 48 * s; e.schritt = (e.schritt || 0) + 48 * s * .055;
              A.bew = { m: 'lauf', ph: e.schritt, st: .55 };
              if (Math.abs(e.ziel - e.x) < 3){ e.ziel = null; e.wait = rr(1200, 3200); }
            }
          } else A.bew = { m: 'stand' };
          if (bemerkt(e)){ e.zustand = 'wach'; e.alarmT = 500; hook.laut('bemerkt'); gruppeWach(e); }
          break;
        }
        case 'wach': {
          e.alarmT -= dt; e.face = Math.sign(dx) || e.face;
          if (e.alarmT > 0){ A.bew = { m: 'stand' }; break; }
          // Auf den Spieler zu, bis zur Kampfdistanz
          if (dist < T * 5 && Math.abs(dy) < T * 2 && !S.leiter && S.boden){ kampfBeginn(e, null); return; }

const Prolog = (() => {

      // Ketten, die ihn herabziehen
      ctx.strokeStyle = 'rgba(10,12,16,.9)'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(mx + s * mr * .7, my + mr * .6); ctx.quadraticCurveTo(mx + s * mr * 1.4, (my + hz) / 2, W * .5 + s * 12, hz - H * .28); ctx.stroke(); });
      ctx.setLineDash([]);
      meer(ctx, hz, wt);
      turm(ctx, W * .5, hz + 2, H * .26, Math.max(18, W * .05), '#050608');
      glow(ctx, W * .5, hz - H * .3, mr * 2, 'rgba(210,225,245,.4)', k);
    } else if (i === 1){
      // Die Krone im Licht
      himmel(ctx, '#030406', '#0d1016');
      const cx = W * .5, cy = H * .38, s = Math.min(W, H) * .16 * (1 + k * .06);
      for (let r = 0; r < 12; r++){ const a = r / 12 * TAU + k * .3; ctx.strokeStyle = `rgba(230,220,190,${.06 + .04 * Math.sin(wt * .002 + r)})`; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * W, cy + Math.sin(a) * W); ctx.stroke(); }
      glow(ctx, cx, cy, s * 3.5, 'rgba(240,230,200,.55)', 1);
      ctx.fillStyle = '#060708'; krone(ctx, cx, cy, s);
      glow(ctx, cx, cy - s * .05, s * .5, 'rgba(255,250,235,.95)', .9 + .1 * Math.sin(wt * .004));
      meer(ctx, H * .72, wt, '#0a1016');
      // Ebbe und Flut: das Wasser hebt und senkt sich
      ctx.fillStyle = 'rgba(40,70,90,.25)'; ctx.fillRect(0, H * .72 + Math.sin(wt * .0015) * 8, W, H);
    } else if (i === 2){
      // Die Krone zerspringt, fünf Splitter fliegen davon
      himmel(ctx, '#030406', '#0d1016');
      const cx = W * .5, cy = H * .38, s = Math.min(W, H) * .16, kk = EASE.out(clamp((k - .15) / .6, 0, 1));
      glow(ctx, cx, cy, s * 3 * (1 - kk * .6), 'rgba(240,230,200,.5)', 1 - kk * .5);
      for (let n = 0; n < 5; n++){
        const a = -Math.PI / 2 + (n - 2) * .7, d = kk * Math.min(W, H) * .45;
        const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .6 + kk * kk * H * .15;
        ctx.save(); ctx.translate(x, y); ctx.rotate(kk * (n - 2) * 1.3);
        ctx.fillStyle = '#060708'; ctx.beginPath(); ctx.moveTo(-s * .25, s * .2); ctx.lineTo(0, -s * .45); ctx.lineTo(s * .25, s * .2); ctx.closePath(); ctx.fill();
        ctx.restore();
        glow(ctx, x, y, s * .6, 'rgba(220,235,255,.8)', .5 + .3 * Math.sin(wt * .006 + n));
      }
      meer(ctx, H * .72, wt, '#0a1016');
    } else if (i === 3){
      // Fünf Türme mit Glocken, Ringe von Klang, steigendes Wasser
      himmel(ctx, '#05070b', '#222c38'); sternenfeld(ctx, .6);
      const lv = hz - k * H * .05;
      [.12, .31, .5, .69, .88].forEach((f, n) => {
        const x = W * f, th = H * (.2 + (n === 2 ? .08 : (n % 2) * .03));
        turm(ctx, x, hz + 4, th, Math.max(12, W * .035), '#07090c');
        const bx = x, by = hz - th + Math.max(12, W * .035) * .2, ph = (wt * .0006 + n * .21) % 1, leise = 1 - k * .7;
        ctx.strokeStyle = `rgba(220,230,245,${(1 - ph) * .35 * leise})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(bx, by, ph * W * .18, 0, TAU); ctx.stroke();
        glow(ctx, bx, by, 12, 'rgba(220,235,255,.9)', .5 * leise);
      });
      meer(ctx, lv, wt, '#101a24');
    } else {
      // Unter Wasser: eine Gestalt sinkt, in ihrer Brust ein schwaches Licht
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e1d26'); g.addColorStop(1, '#010203'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (let n = 0; n < 7; n++){ const x = W * (.1 + n * .14) + Math.sin(wt * .0005 + n) * 20; ctx.fillStyle = 'rgba(160,200,215,.05)'; ctx.beginPath(); ctx.moveTo(x - 30, 0); ctx.lineTo(x + 30, 0); ctx.lineTo(x + 90, H); ctx.lineTo(x - 10, H); ctx.fill(); }
      const fx = W * .5 + Math.sin(wt * .0007) * 10, fy = lerp(H * .2, H * .62, EASE.out(k));
      const A = Prolog.figur || (Prolog.figur = makeActor({ set: 'kron', look: Object.assign({}, LOOK.kron, { weapon: null, off: null, heart: true }), face: 1, H: Math.min(W, H) * .25 }));
      A.H = Math.min(W, H) * .25; A.x = fx; A.gy = fy; A.t += dt; A.glow = .6;
      A.pose = mkPose({ rot: -.9 + Math.sin(wt * .0006) * .1, lean: .3, head: .4, a1: 2.2, a2: .4, b1: 2.5, b2: .5, f1: .5, f2: -.6, k1: .2, k2: -.4, cape: .2 }, SETS.kron.idle);
      drawActor(ctx, A);
      const c = chestPt(A), beat = Math.exp(-((wt % 2400) / 2400) * 12);
      glow(ctx, c[0], c[1], 30 + beat * 30, 'rgba(210,225,255,.9)', .5 + beat * .5);
      for (let n = 0; n < 8; n++){ const bx = fx + Math.sin(n * 7 + wt * .001) * 30, by = fy - ((wt * .05 + n * 60) % (H * .7)); ctx.strokeStyle = 'rgba(200,230,240,.3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by, 2 + n % 3, 0, TAU); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    // Vignette und Körnung
    const vg = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .25, W / 2, H * .45, Math.max(W, H) * .75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  return { start, update, draw, figur: null };
})();

/* =====================================================================
   MENÜS: Blätter von unten – Aufsteigen, Amboss, Handel, Ausrüstung,
   Gegenstände, Chronik, Steuerung, Pause
   ===================================================================== */
let sheetClose = null, sheetOn = null;
function sheet(html, o = {}){
  const s = $('#sheet');
  s.innerHTML = html; $('#sheetBack').hidden = false;
  sheetClose = o.onClose || null; sheetOn = o.on || null;
  if (!o.keepScroll) s.scrollTop = 0;
  const f = s.querySelector('button:not([disabled])'); if (f && !o.keepScroll) setTimeout(() => f.focus({ preventScroll: true }), 30);
  Eingabe.loslassen();
}
function closeSheet(run = true){
  $('#sheetBack').hidden = true;
  const f = sheetClose; sheetClose = null; sheetOn = null;
  if (run && f) f();
}
const sheetOffen = () => !$('#sheetBack').hidden;
$('#sheetBack').addEventListener('click', e => {
  if (e.target === $('#sheetBack')) { Snd.play('ui'); closeSheet(); return; }
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled && sheetOn){ Snd.play('ui'); sheetOn(b.dataset.a, b); }
});
const row = (a, name, sub = '', val = '', o = {}) =>
  `<button type="button" class="row${o.on ? ' on' : ''}" data-a="${a}"${o.off ? ' disabled' : ''}><span><b>${esc(name)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span><span class="val">${val}</span></button>`;
const dl = (list, cls = 'stats') => `<dl class="${cls}">${list.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Aufsteigen ---------- */
function aufsteigen(danach){
  const k = lvlKosten(), p = profil(), kann = D.glut >= k;
  const vor = (attr, fn) => { const a = Object.assign({}, D.attr, { [attr]: D.attr[attr] + 1 }); return fn(profil(D.waffe, a)); };
  const pct = attr => Math.round((vor(attr, q => q.dmgMul) / p.dmgMul - 1) * 1000) / 10;
  const rows = [
    ['vit', `Leben ${p.hpMax} → ${vor('vit', q => q.hpMax)}`],
    ['aus', `Ausdauer ${p.stMax} → ${vor('aus', q => q.stMax)}`],
    ['str', `Schaden mit ${WAFFEN[D.waffe].name} +${String(pct('str')).replace('.', ',')} %`],
    ['ges', `Schaden mit ${WAFFEN[D.waffe].name} +${String(pct('ges')).replace('.', ',')} %`]
  ];
  sheet(`<h3>Aufsteigen</h3><p>Stufe ${D.lvl} auf ${D.lvl + 1} kostet ${fmt(k)} Glut. Du trägst ${fmt(D.glut)} bei dir.</p>
    ${rows.map(([a, t]) => row(a, ATTR[a].name, t, D.attr[a], { off: !kann })).join('')}
    <button type="button" class="btn ghost" data-a="x">Fertig</button>`, {
    keepScroll: true, onClose: danach,
    on(a){
      if (a === 'x') return closeSheet();
      if (D.glut < k || !ATTR[a]) return;
      D.glut -= k; D.lvl++; D.attr[a]++;
      speichern(); Snd.play('fire');
      const P = Stage.P; World.burst(P.x, P.gy - P.H * .6, 'ember', 30);
      toast(`Stufe ${D.lvl}`); aufsteigen(danach);
    }
  });
}

/* ---------- Amboss ---------- */
function amboss(danach){
  const rows = [], forge = [];
  Object.keys(D.waffen).forEach(k => {
    const w = WAFFEN[k], lv = D.waffen[k], c = upgradeKosten(lv), max = lv >= MAX_STUFE;
    const ok = !max && anzahl('glockenerz') >= c.erz && D.glut >= c.glut;
    rows.push(row('up:' + k, `${w.name} +${lv}`, max ? 'Voll geschärft' : `Auf +${lv + 1}: ${c.erz} Glockenerz, ${fmt(c.glut)} Glut`, max ? '' : 'Schärfen', { off: !ok, on: k === D.waffe }));
  });
  Object.keys(WAFFEN).forEach(k => {
    const w = WAFFEN[k], nh = 'nachhall_' + w.nachhall;
    if (!w.nachhall || k in D.waffen || !anzahl(nh)) return;
    forge.push(row('forge:' + k, `${w.name} gießen`, `${GEGENSTAENDE[nh].name} und 600 Glut. ${w.text}`, 'Gießen', { off: D.glut < 600 }));
  });
  sheet(`<h3>Amboss</h3><p>Glockenerz ${anzahl('glockenerz')} · Glut ${fmt(D.glut)}. Jede Stufe macht eine Waffe um 10 % stärker, höchstens +${MAX_STUFE}.</p>
    ${rows.join('')}${forge.length ? '<p class="sec">Nachhall</p>' + forge.join('') : ''}
    <button type="button" class="btn ghost" data-a="x">Fertig</button>`, {
    keepScroll: true, onClose: danach,
    on(a){
      if (a === 'x') return closeSheet();
      const [what, k] = a.split(':');
      if (what === 'up'){
        const lv = D.waffen[k], c = upgradeKosten(lv);
        if (lv >= MAX_STUFE || anzahl('glockenerz') < c.erz || D.glut < c.glut) return;
        D.items.glockenerz -= c.erz; D.glut -= c.glut; D.waffen[k]++;
        Snd.play('block'); setTimeout(() => Snd.play('parry'), 120);
        toast(`${WAFFEN[k].name} +${D.waffen[k]}`);
      }
      if (what === 'forge'){
        const nh = 'nachhall_' + WAFFEN[k].nachhall;
        if (D.glut < 600 || !anzahl(nh)) return;
        D.items[nh]--; D.glut -= 600; D.waffen[k] = 0;
        Snd.play('geleut'); toast(`${WAFFEN[k].name} gegossen. Anlegen im Menü.`, 2600);
      }
      speichern(); amboss(danach);
    }
  });
}

/* ---------- Handel ---------- */
function handel(wer, zurueck){
  const L = LADEN[wer], gek = D.laden[wer] = D.laden[wer] || {};
  const rows = L.filter(e => !e.wenn || e.wenn(D)).map(e => {
    const def = e.art === 'tal' ? TALISMANE[e.id] : GEGENSTAENDE[e.id], rest = e.vorrat - (gek[e.id] || 0);
    return row('buy:' + e.id, def.name, def.text + (rest > 0 ? ` Noch ${rest}.` : ''), rest > 0 ? fmt(e.preis) + ' Glut' : 'ausverkauft', { off: rest <= 0 || D.glut < e.preis });
  });
  sheet(`<h3>${esc(NPC[wer].name)}s Ware</h3><p>Du trägst ${fmt(D.glut)} Glut bei dir.</p>${rows.join('')}
    <button type="button" class="btn ghost" data-a="x">Fertig</button>`, {
    keepScroll: true, onClose: zurueck,
    on(a){
      if (a === 'x') return closeSheet();
      const e = L.find(x => 'buy:' + x.id === a); if (!e) return;
      if (D.glut < e.preis || (gek[e.id] || 0) >= e.vorrat) return;
      D.glut -= e.preis; gek[e.id] = (gek[e.id] || 0) + 1;
      const g = geben({ [e.art]: e.id });
      speichern(); Snd.play('glut'); toast('Gekauft: ' + g[0]);
      handel(wer, zurueck);
    }
  });
}

/* ---------- Ausrüstung und Einstellungen ---------- */

  if (!D.herk) return;
  pausiere(true);
  const p = profil(), w = WAFFEN[D.waffe], a = D.attr;
  const talName = i => D.tal[i] ? TALISMANE[D.tal[i]].name : 'leer';

    ${dl([[ATTR.vit.name, a.vit], [ATTR.aus.name, a.aus], [ATTR.str.name, a.str], [ATTR.ges.name, a.ges]], 'stats four')}
    <p class="sec">Ausrüstung</p>

    ${row('tal1', 'Talisman', talName(1), '›')}

    ${row('chronik', 'Chronik', `${Object.keys(D.gelesen).length} Schriften, Figuren und Erinnerungen`, '›')}
    <p class="sec">Einstellungen</p>
    ${row('sound', 'Ton', '', S.sound ? 'an' : 'aus')}
    ${hasVoices() ? row('voice', 'Stimmen', 'Erzähler und Figuren sprechen', S.voice ? 'an' : 'aus') : ''}
    ${row('ring', 'Hilfe: Zeitring', 'Zeigt im Kampf, wann ein Treffer kommt. Macht es deutlich leichter.', S.ring ? 'an' : 'aus')}
    ${EMB ? '' : row('vib', 'Vibration', '', S.vib ? 'an' : 'aus')}
    ${row('help', 'Steuerung', 'Erkunden und Kämpfen')}

    <button type="button" class="btn ghost" data-a="x">Schließen</button>`, {
    keepScroll: true, onClose: () => pausiere(false),

      const flip = key => { S[key] = !S[key]; saveSettings(); b.querySelector('.val').textContent = S[key] ? 'an' : 'aus'; };
      switch (k){
        case 'x': return closeSheet();
        case 'waffe': return waffenWahl();
        case 'schild': return schildWahl();
        case 'tal0': case 'tal1': return talWahl(+k.slice(3));
        case 'items': return gegenstaende();
        case 'chronik': return chronik();
        case 'sound': flip('sound'); Snd.setOn(S.sound); if (!S.sound) Voice.stop(); else if (!Music.mode()) Music.play('amb'); return;
        case 'voice': flip('voice'); if (!S.voice) Voice.stop(); return;
        case 'ring': return flip('ring');
        case 'vib': return flip('vib');
        case 'help': closeSheet(false); return steuerung(menue);
        case 'title': closeSheet(false); speichern(); pausiere(false); return EMB ? ccLeave() : titel();
      }
    }
  });
}
function nachWechsel(){
  const P = heldAufBuehne();
  const p = profil(); if (D.hp != null) D.hp = Math.min(D.hp, p.hpMax);
  speichern();
}
function waffenWahl(){
  const rows = Object.keys(D.waffen).map(k => {
    const w = WAFFEN[k], d = Math.round(w.light[0].d * profil(k).dmgMul);
    return row(k, `${w.name} +${D.waffen[k]}`, `${w.text} Kunst: ${w.art.name}, ${w.art.text}`, `${d}<small> Schaden</small>`, { on: k === D.waffe });
  });
  sheet(`<h3>Waffe</h3><p>Der Schaden gilt für den ersten leichten Schlag, mit deinen Attributen.</p>${rows.join('')}<button type="button" class="btn ghost" data-a="x">Zurück</button>`, {
    onClose: menue,
    on(k){ if (k !== 'x' && WAFFEN[k]){ D.waffe = k; nachWechsel(); Snd.play('block'); } closeSheet(); }

}
function schildWahl(){
  const rows = Object.keys(D.schilde).map(k => row(k, SCHILDE[k].name, `${SCHILDE[k].text} Fängt ${Math.round(SCHILDE[k].block * 100)} % ab.`, '', { on: k === D.schild }));

function talWahl(slot){

  sheet(`<h3>Talisman</h3>${rows.length ? rows.join('') : '<p>Du hast noch keine Talismane gefunden. Sieh dich genau um: in Truhen, bei Toten, hinter brüchigen Wänden.</p>'}${D.tal[slot] ? row('none', 'Ablegen', '') : ''}<button type="button" class="btn ghost" data-a="x">Zurück</button>`, {
    onClose: menue,

function gegenstaende(){
  const ids = Object.keys(D.items).filter(k => D.items[k] > 0);

// Chronik: alles Gelesene und Erinnerte zum Nachlesen
function chronik(){
  const ids = Object.keys(D.gelesen).filter(id => LORE[id]).sort((a, b) => D.gelesen[a] - D.gelesen[b]);

function kampfRegeln(then){
  const R = [

const SAVE_KEY = 'mondgelaeut-v2' + (EMB && EMB.p ? '@' + EMB.p : '');

  };
}
let D = neuesSpiel();
function gespeichert(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');

/* ---------- Werte des Helden ---------- */
const lvlKosten = () => Math.round(110 * Math.pow(1.27, D.lvl - 1) / 10) * 10;
const anzahl = id => D.items[id] || 0;
function tals(){ return D.tal.filter(k => k && D.tals[k]).map(k => TALISMANE[k]); }
function profil(waffe = D.waffe, attr = D.attr){
  const h = HERK[D.herk], w = WAFFEN[waffe], T2 = tals(), stufe = D.waffen[waffe] || 0;
  const mul = k => T2.reduce((m, t) => m * (t[k] || 1), 1);
  const sh = w.klasse === 'klinge' && D.schild ? SCHILDE[D.schild] : null, kb = KLASSE_BLOCK[w.klasse];
  return {
    hpMax: Math.round((90 + attr.vit * 12) * mul('hp')), stMax: 80 + attr.aus * 8, fpMax: h.fp,
    flasksMax: D.flasksMax, heal: Math.max(.42, ...T2.map(t => t.heal || 0)),
    waffe: w, dmgMul: (1 + .1 * stufe) * (1 + attr.str * w.skal.str + attr.ges * w.skal.ges) * mul('dmg'),
    block: sh ? sh.block : kb.block, blockSt: (sh ? sh.st : kb.st) * mul('blockSt'), dodgeSt: w.dodgeSt || 22,
    stRegen: mul('stRegen'), pzMul: mul('pz'), parryFp: 10 * mul('parryFp')
  };
}
const hpJetzt = () => { const p = profil(); return D.hp == null ? p.hpMax : Math.min(p.hpMax, D.hp); };
function heldAufBuehne(){
  const P = Stage.hero(D.herk || 'kron', D.waffe || 'langschwert', D.schild);
  Stage.showP = true; P.alpha = 1; P.hideW = false; P.glow = 0; P.H = HELD_H;
  if (!D.herk){ P.look = LOOK.leer; P.hideW = true; }
  return P;
}
function geben(g){
  const out = [];
  const add = (id, n = 1) => { D.items[id] = anzahl(id) + n; out.push(GEGENSTAENDE[id].name + (n > 1 ? ' ×' + n : '')); };
  if (g.item){
    const L = Array.isArray(g.item) ? (Array.isArray(g.item[0]) ? g.item : [g.item]) : [[g.item, 1]];
    L.forEach(([id, n]) => add(id, n));
  }
  if (g.tal && TALISMANE[g.tal]){
    D.tals[g.tal] = true;
    const frei = D.tal.indexOf(null);
    if (frei >= 0 && !D.tal.includes(g.tal)){ D.tal[frei] = g.tal; out.push(TALISMANE[g.tal].name + ' (angelegt)'); }
    else out.push(TALISMANE[g.tal].name);
  }
  if (g.schild && SCHILDE[g.schild]){ D.schilde[g.schild] = true; out.push(SCHILDE[g.schild].name); }
  if (g.waffe && WAFFEN[g.waffe]){ if (!(g.waffe in D.waffen)) D.waffen[g.waffe] = 0; out.push(WAFFEN[g.waffe].name); }
  if (g.glut){ D.glut += g.glut; out.push(fmt(g.glut) + ' Glut'); }
  return out;
}

const cv = $('#stage'), ctx = cv.getContext('2d');
let wt = 0, last = performance.now();
// Wenn das Gerät nicht mitkommt, zeichnen wir mit weniger Pixeln
let sparsam = false, ruckelT = 0, ruckelN = 0;
function ruckelPruefen(dt){
  if (sparsam || document.hidden) return;
  ruckelN++; ruckelT += dt;
  if (ruckelN >= 120){
    if (ruckelT / ruckelN > 24 && (window.devicePixelRatio || 1) > 1){ sparsam = true; resize(); }
    ruckelN = 0; ruckelT = 0;
  }
}
function resize(){
  const r = Math.min(sparsam ? 1 : 2, window.devicePixelRatio || 1), b = $('#app').getBoundingClientRect();
  const w = Math.max(1, Math.round(b.width)), h = Math.max(1, Math.round(b.height));
  cv.width = Math.round(w * r); cv.height = Math.round(h * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
  World.resize(w, h, r); Stage.place();
  if (modus === 'karte') renderKarte();
  if (modus === 'kampf') kampfKamera();
}
function frame(now){
  const roh = now - last, dt = Math.min(50, roh); last = now; wt += dt;
  if (modus === 'welt' || modus === 'kampf') ruckelPruefen(Math.min(roh, 100));
  if (!pause){
    if (modus === 'kampf'){ Fight.update(dt); Erk.update(dt, D, true); }
    else if (modus === 'prolog') Prolog.update(dt);
    else if (Erk.gebiet()) Erk.update(dt, D);
    if (modus === 'welt') weltSchritt(dt);
    if (modus === 'titel') titelKamera(dt);
    World.updateFx(dt);
  }
  if (modus !== 'titel' && modus !== 'prolog' && D.herk && !document.hidden && !pause){
    D.st.ms += dt;
    if (now - lastSave > 30000 && modus === 'welt') speichern();
  }
  if (modus === 'prolog') Prolog.draw(ctx, wt, dt);
  else World.draw(ctx, wt, dt, {
    hinten: c => { Erk.zeichneHinten(c, D); zeichneDrop(c); },
    figuren: c => { Erk.figuren(c); if (Fight.on()) Fight.drawActors(c); },
    kampf: c => Fight.drawFx(c),
    spiegel: c => Erk.figuren(c, true),
    vorn: c => { Erk.zeichneVorn(c, D); if (modus === 'welt') zeichneMarke(c); }
  });
  if (modus === 'welt') hudWelt(dt);
  if (modus === 'kampf' && Fight.pl()) hud(dt);
  requestAnimationFrame(frame);
}

// Zwischenszene: Zeilen nacheinander, Kinobalken, Kamera fest
async function szene(zeilen, o = {}){

    const [wer, text, opt] = Array.isArray(z) ? z : ['', z];
    await zeile(wer, text, Object.assign({ rede: !!wer }, opt));

// Gespräch mit einer Figur in der Welt
async function gespraech(ent){
  const npc = ent.def.id, key = gespraechFuer(npc, D, Erk.gebiet().id), G = GESPRAECHE[key];
  if (!G) return;
  modus = 'dialog'; Erk.setAus(true);
  const P = Stage.P, A = ent.actor;
  A.face = Math.sign(P.x - A.x) || A.face;
  World.focus((P.x + A.x) / 2, P.gy - 70, 1.35, .004); World.letterbox(1);
  if (G.setze) D.merker[G.setze] = true;
  D.gelesen['npc_' + npc] = D.gelesen['npc_' + npc] || Date.now();
  let k = G.start;
  const wer = NPC[G.wer];
  while (k){
    const n = G.k[k];
    if (n.setze) D.merker[n.setze] = true;
    let gab = [];
    if (n.nimmt && anzahl(n.nimmt)){ D.items[n.nimmt]--; gab.push('Abgegeben: ' + GEGENSTAENDE[n.nimmt].name); }
    if (n.gibt) gab = gab.concat(geben(n.gibt).map(g => 'Erhalten: ' + g));
    if (gab.length){ toast(gab.join(' · '), 2800); Snd.play('glut'); }
    const antworten = (n.a || []).filter(a => !a.wenn || a.wenn(D));
    const opts = antworten.map((a, i) => ({ t: a.t, sub: a.sub, v: i, cls: a.laden ? 'fire' : '' }));
    if (!opts.length) opts.push({ t: 'Gehen', v: -1 });
    const i = await wahl(`${wer.name} · ${wer.titel}`, typeof n.text === 'function' ? n.text(D) : n.text, opts, { rede: true });
    const a = antworten[i];
    if (!a) break;
    if (a.setze) D.merker[a.setze] = true;
    if (a.laden){ await new Promise(r => handel(G.wer, r)); continue; }
    k = a.go || null;
  }
  speichern();
  World.letterbox(0); World.release();

  if (pl.flasks !== lastFlask){ hudEl.flaskN.textContent = pl.flasks; lastFlask = pl.flasks; }
  const g = D.glut + Fight.glut();
  if (g !== lastGlut){ hudEl.glutN.textContent = fmt(g); lastGlut = g; }
  const cb = hudEl.cb;
  cb.flask.classList.toggle('off', pl.flasks <= 0);
  cb.art.classList.toggle('off', pl.fp < pl.waffe.art.fp);
  const crit = Fight.critReady();
  cb.atk.classList.toggle('crit', crit);
  hudEl.atkLbl.textContent = crit ? 'Todesstoß' : 'Angriff';
  const low = pl.st < 12;
  cb.dodge.classList.toggle('off', low); cb.heavy.classList.toggle('off', low);
}
$$('#rtc .cb').forEach(b => {
  const k = b.dataset.k;
  let down = false;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); Snd.init();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    down = true; b.classList.add('on'); Fight.press(k);
  });
  const up = () => { if (!down) return; down = false; b.classList.remove('on'); Fight.release(k); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
(() => {
  const t = $('#fTouch'); let sx = 0, sy = 0, st = 0, id = null;
  t.addEventListener('pointerdown', e => { id = e.pointerId; sx = e.clientX; sy = e.clientY; st = performance.now(); Snd.init(); });
  t.addEventListener('pointerup', e => {
    if (e.pointerId !== id) return; id = null;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) > 36){ Fight.press('dodge'); Fight.release('dodge'); }
    else if (performance.now() - st < 350){ Fight.press('atk'); Fight.release('atk'); }
  });
})();
$('#btnPause').addEventListener('click', () => { Snd.play('ui'); pauseSheet(); });
const KEYS = { ' ': 'atk', j: 'atk', h: 'heavy', k: 'dodge', Shift: 'dodge', l: 'block', b: 'block', u: 'art', e: 'flask', f: 'flask' };
document.addEventListener('keydown', e => {
  if (sheetOffen()){ if (e.key === 'Escape') closeSheet(); return; }
  if (lesenZu && (e.key === 'Escape' || e.key === 'Enter')){ lesenZu(); return; }
  if (modus === 'karte' && e.key === 'Escape'){ karteZu(); return; }
  if (modus === 'titel' && e.key === 'Escape' && EMB){ ccLeave(); return; }
  if (modus !== 'kampf') return;
  if (e.key === 'Escape'){ pauseSheet(); return; }
  const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!k || e.repeat) return;
  e.preventDefault(); Fight.press(k);
});
document.addEventListener('keyup', e => {
  const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (k && modus === 'kampf') Fight.release(k);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && modus === 'kampf' && Fight.on() && !Fight.paused() && !sheetOffen()) pauseSheet();
  if (document.hidden && modus === 'welt') speichern();
});
window.addEventListener('pagehide', () => { if (modus === 'welt') speichern(); });
function pauseSheet(){
  if (!Fight.on()) return;
  Fight.setPaused(true);
  $$('#rtc .cb').forEach(b => b.classList.remove('on'));
  const boss = !!kampfBoss;
  sheet(`<h3>Pause</h3>
    ${row('resume', 'Weiterkämpfen')}
    ${row('ring', 'Hilfe: Zeitring', 'Zeigt, wann ein Treffer kommt. Macht es deutlich leichter.', S.ring ? 'an' : 'aus')}
    ${row('sound', 'Ton', '', S.sound ? 'an' : 'aus')}
    ${hasVoices() ? row('voice', 'Stimmen', '', S.voice ? 'an' : 'aus') : ''}
    ${row('help', 'Steuerung', 'Die Regeln noch einmal')}
    ${row('flee', 'Zurückweichen', boss ? 'Du gehst zurück. Der Boss wartet, sein Leben füllt sich wieder.' : 'Du gehst ein Stück zurück. Die Gegner erholen sich.')}`, {
    onClose: () => Fight.setPaused(false),
    on(a, b){
      if (a === 'resume') return closeSheet();
      if (a === 'ring'){ S.ring = !S.ring; saveSettings(); b.querySelector('.val').textContent = S.ring ? 'an' : 'aus'; return; }
      if (a === 'sound'){ S.sound = !S.sound; saveSettings(); Snd.setOn(S.sound); b.querySelector('.val').textContent = S.sound ? 'an' : 'aus'; return; }
      if (a === 'voice'){ S.voice = !S.voice; saveSettings(); b.querySelector('.val').textContent = S.voice ? 'an' : 'aus'; if (!S.voice) Voice.stop(); return; }
      if (a === 'help'){ closeSheet(false); kampfRegeln(() => Fight.setPaused(false)); return; }
      if (a === 'flee'){ closeSheet(false); fliehen(); }
    }
  });
}

/* ---------- Karte ---------- */
let kRegion = 'strandung', kSel = null, kReise = false, kVorher = 'welt';
function karte(reise = false){
  if (!D.herk || modus === 'kampf' || modus === 'karte') return;
  kVorher = modus; kReise = reise || modus === 'feuer'; modus = 'karte'; pausiere(true);
  kRegion = GEBIETE[Erk.gebiet().id].region; kSel = null;
  show('karte'); renderKarte();
}
function karteZu(){ pausiere(false); if (kVorher === 'feuer'){ modus = 'feuer'; show('feuer'); } else welt(); }
$('#btnKarteZu').addEventListener('click', () => { Snd.play('ui'); karteZu(); });
function renderKarte(){
  const regs = Object.keys(REGIONEN).filter(r => Object.keys(GEBIETE).some(k => GEBIETE[k].region === r && D.besucht[k]));
  $('#kTabs').innerHTML = regs.map(r => `<button type="button" role="tab" data-r="${r}" aria-selected="${r === kRegion}">${esc(REGIONEN[r].name)}</button>`).join('');
  const box = $('#kMap'), Wd = Math.max(200, box.clientWidth), Hd = Math.max(200, box.clientHeight);
  const ids = Object.keys(GEBIETE).filter(k => GEBIETE[k].region === kRegion && (D.besucht[k] || nachbarBesucht(k)));
  if (!ids.length){ box.innerHTML = ''; kInfo(); return; }
  const all = ids.map(k => GEBIETE[k].kartenPos);
  const minX = Math.min(...all.map(p => p[0])), maxX = Math.max(...all.map(p => p[0] + p[2])), minY = Math.min(...all.map(p => p[1])), maxY = Math.max(...all.map(p => p[1] + p[3]));
  const sc = Math.min((Wd - 30) / Math.max(1, maxX - minX), (Hd - 30) / Math.max(1, maxY - minY), 70);
  const ox = (Wd - (maxX - minX) * sc) / 2 - minX * sc, oy = (Hd - (maxY - minY) * sc) / 2 - minY * sc;
  const R = k => { const p = GEBIETE[k].kartenPos; return [ox + p[0] * sc, oy + p[1] * sc, p[2] * sc, p[3] * sc]; };
  let svg = '';
  ids.forEach(a => verbindungen(a).forEach(b => {
    if (!ids.includes(b) || b < a) return;
    const [x1, y1, w1, h1] = R(a), [x2, y2, w2, h2] = R(b);
    svg += `<path class="edge${D.besucht[a] && D.besucht[b] ? ' known' : ''}" d="M${x1 + w1 / 2} ${y1 + h1 / 2}L${x2 + w2 / 2} ${y2 + h2 / 2}"/>`;
  }));
  const cur = Erk.gebiet().id;
  ids.forEach(k => {
    const [x, y, w, h] = R(k), G = GEBIETE[k], bekannt = D.besucht[k];
    const feuer = Object.entries(D.feuerOrt).filter(([id, f]) => f[0] === k && D.lit[id]);
    svg += `<g class="node gebiet${bekannt ? '' : ' unbekannt'}${k === kSel ? ' sel' : ''}${feuer.length ? ' feuer' : ''}" data-o="${k}"><rect class="dot" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
    svg += `<text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle">${esc(bekannt ? G.name : '?')}</text>`;
    feuer.forEach(([id], i) => { svg += `<path class="flame" transform="translate(${x + w - 10 - i * 12} ${y + 11})" d="M0 -5c2.4 2.2 3.3 4 3.3 5.7a3.3 3.3 0 0 1-6.6 0c0-1.3.8-2.2 1.5-3 .2 1.1.9 1.6 1.4 1.6 0-1.6-.4-2.8.4-4.3z"/>`; });
    if (bekannt && Object.values(G.o || {}).some(o => o.t === 'boss' && !D.bosse[o.boss])) svg += `<path class="foe" transform="translate(${x + 10} ${y + 11})" d="M0 -4L4 0 0 4-4 0z"/>`;
    if (D.drop && D.drop.gebiet === k) svg += `<circle class="glutpunkt" cx="${x + w / 2}" cy="${y + h - 8}" r="4"/>`;
    if (k === cur){ const G2 = Erk.gebiet(), px = x + clamp(Erk.S.x / G2.W, .04, .96) * w, py = y + clamp(Erk.S.y / G2.Hh, .15, .85) * h; svg += `<circle class="here" cx="${px}" cy="${py}" r="7"/><circle class="hierpunkt" cx="${px}" cy="${py}" r="3"/>`; }
    svg += '</g>';
  });
  box.innerHTML = `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Karte: ${esc(REGIONEN[kRegion].name)}">${svg}</svg>`;
  kInfo();
}
function verbindungen(k){
  const G = GEBIETE[k], out = Object.values(G.links || {}).map(z => z.split(':')[0]);
  Object.values(G.o || {}).forEach(o => { if ((o.t === 'tuer' || o.t === 'ausgang') && o.ziel) out.push((o.ziel || '').split(':')[0]); });
  return out;
}
function nachbarBesucht(k){ return Object.keys(GEBIETE).some(a => D.besucht[a] && verbindungen(a).includes(k)); }
function kInfo(){
  const box = $('#kInfo');
  if (!kSel){ box.innerHTML = `<h3>${esc(REGIONEN[kRegion].name)}</h3><p>${kReise ? 'Tippe auf ein Gebiet mit Leuchtfeuer, um dorthin zu reisen.' : 'Reisen kannst du, wenn du an einem Leuchtfeuer rastest.'}</p>`; return; }
  const G = GEBIETE[kSel], feuer = Object.entries(D.feuerOrt).filter(([id, f]) => f[0] === kSel && D.lit[id]);
  let html = `<h3>${esc(D.besucht[kSel] ? G.name : 'Unerforscht')}</h3><p>${esc(D.besucht[kSel] ? (G.beschreibung || REGIONEN[G.region].name) : 'Hier warst du noch nicht.')}</p>`;
  if (kReise) feuer.forEach(([id]) => { if (id !== D.feuer) html += `<button type="button" class="btn primary" data-reise="${id}">Reisen: ${esc(FEUERNAME(id))}</button>`; });
  box.innerHTML = html;
  box.querySelectorAll('[data-reise]').forEach(b => b.addEventListener('click', () => { Snd.play('choice'); reisen(b.dataset.reise); }));
}
function FEUERNAME(id){ for (const g of Object.values(GEBIETE)) for (const o of Object.values(g.o || {})) if (o.t === 'feuer' && o.id === id) return o.name; return 'Leuchtfeuer'; }
function reisen(id){
  const f = D.feuerOrt[id]; if (!f) return;
  pausiere(false);
  blende(() => {
    heldAufBuehne();
    Erk.betrete(f[0], { x: f[1] + 34, y: f[2] }, D);
    D.besucht[f[0]] = true; D.gebiet = f[0];
    const e = Erk.ents().find(x => x.typ === 'feuer' && x.def.id === id);
    Music.play(GEBIETE[f[0]].musik || 'amb');
    if (e){ Stage.P.poseFn = null; playAnim(Stage.P, [[0, SETS[Stage.P.set].kneel]], true); rasten(e, 'rast'); }
    else welt();
  }, 600);
}
$('#kTabs').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b) return; Snd.play('ui'); kRegion = b.dataset.r; kSel = null; renderKarte(); });
$('#kMap').addEventListener('click', e => { const n = e.target.closest('.node'); if (!n) return; Snd.play('ui'); kSel = n.dataset.o; renderKarte(); });

/* ---------- Ende von Akt I ---------- */
function akt1Ende(){
  const erst = !D.ende; D.ende = true; speichern();
  modus = 'ende'; Erk.setAus(true); Voice.stop();
  show('ende');
  World.focus(Erk.S.x, Erk.S.y - 160, .9, .002); World.letterbox(0);
  Music.play('amb');
  if (erst){ Snd.bell(98, .3, 6, .85); setTimeout(() => Snd.bell(98, .2, 5, .85), 600); }
  const min = Math.max(1, Math.floor(D.st.ms / 60000)), zeit = min >= 60 ? `${Math.floor(min / 60)} Std. ${min % 60} Min.` : `${min} Min.`;
  $('#eText').textContent = 'Im Osten glüht Grauhall, die Schmiedefeste. Dort läutet die nächste Glocke. Und hinter dir steigt das Wasser.';
  const bosse = Object.keys(FEINDE).filter(k => FEINDE[k].boss);
  $('#eStats').innerHTML = [
    ['Spielzeit', zeit], ['Stufe', D.lvl], ['Bosse', `${bosse.filter(k => D.bosse[k]).length} von ${bosse.length}`], ['Tode', D.st.tode],
    ['Paraden', D.st.paraden], ['Geheimnisse', `${Object.keys(D.gelesen).filter(k => LORE[k]).length} von ${Object.keys(LORE).length}`]
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const ch = $('#eChoices'); ch.innerHTML = '';
  [{ t: 'Weiter erkunden', sub: 'Was du noch nicht gefunden hast, wartet', fn: () => { Erk.setAus(false); welt(); }, main: true },
   { t: EMB ? 'Zurück zum Couchclub' : 'Zum Titel', fn: () => EMB ? ccLeave() : titel() }].forEach(w => {
    const b = el('button', 'choice in' + (w.main ? ' main' : ''), `<b>${esc(w.t)}</b>${w.sub ? `<small>${esc(w.sub)}</small>` : ''}`);
    b.type = 'button'; b.addEventListener('click', () => { Snd.play('choice'); w.fn(); });
    ch.appendChild(b);
  });
}

/* ---------- Erkundung meldet Kämpfe ---------- */
Erk.hook.kampf = (gruppe, vorteil) => kampf(gruppe, vorteil);

/* ---------- Start ---------- */
function init(){
  resize();
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  titel();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  const s = gespeichert();
  ccPost({ t: 'ready', sum: s ? ccSumme(s) : { runs: 0 } });
  if (DEBUG) window.__mg = {
    D: () => D, setD: d => { D = d; }, neuesSpiel, S, Fight, Stage, World, Erk, Eingabe, profil, betrete, kampfStart, feuer, karte, menue, gespraech,
    akt1Ende, titel, speichern, gespeichert, sterben, heldAufBuehne, modus: () => modus, welt, zeigeLore, bossAuftritt, szene, SKRIPTE, erwachen, GEBIETE, LORE
  };
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(init);
else init();
