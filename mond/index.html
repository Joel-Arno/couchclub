function drawWesen(ctx, a, alpha = 1){
  const L = a.look, H = a.H, p = a.pose, jit = a.shake > 0 ? (rnd() - .5) * H * .025 : 0;
  ctx.save();
  ctx.globalAlpha = alpha * a.alpha;
  const sx = a.x + a.face * p.x * H;
  let g = ctx.createRadialGradient(sx, a.gy, 1, sx, a.gy, H * .5);
  g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, a.gy + 2, H * .5, H * .06, 0, 0, TAU); ctx.fill();
  const paint = L.kind === 'spinne' ? paintSpinne : paintKrabbe;
  [[RIM, RIM, 1.4, -1.1, false], [INK, INK2, 0, 0, true]].forEach(([c, cB, dx, dy, main]) => {
    ctx.save(); ctx.translate(a.x + dx + jit, a.gy + a.sink + dy); ctx.scale(a.face, 1); ctx.rotate(p.rot);
    paint(ctx, a, H, c, cB, main);
    ctx.restore();
  });
  ctx.restore();
  if (a.trailUntil > a.t && a.sk){
    const t = a.sk.tip;
    a.trail.push({ tip: t, mid: [lerp(a.sk.chest[0], t[0], .6), lerp(a.sk.chest[1], t[1], .6)], t: a.t });
  }
}
function augen(ctx, a, pts, r){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const col = a.glow > .5 ? '#ff8a6a' : a.look.eyes;
  pts.forEach(([x, y]) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * (2.5 + a.glow * 2));
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = (.7 + a.glow * .3) * a.alpha; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * (2.5 + a.glow * 2), 0, TAU); ctx.fill();
    ctx.globalAlpha = a.alpha; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * .5, 0, TAU); ctx.fill();
  });
  ctx.restore();
}
// Salzkrabbe: breiter Panzer, sechs Beine, zwei Scheren
function paintKrabbe(ctx, a, H, col, colB, main){
  const p = a.pose, t = a.t;
  const cx = p.x * H, cy = -H * (.26 - p.f2 * .13) + p.y * H, bw = H * .34, bh = H * .15;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [-1, 1].forEach(side => {
    ctx.strokeStyle = side < 0 ? colB : col;
    for (let i = 0; i < 3; i++){
      const ax = cx + (i - 1) * bw * .45, ay = cy + bh * .3;
      const ph = Math.sin(t * .01 + i * 2 + side) * .025 * H;
      const kx = ax + (i - 1) * H * .12 + ph + side * H * .02, ky = cy - H * .04 - p.f2 * H * .05;
      const fx = ax + (i - 1) * H * .22 + ph * 1.5 + side * H * .03;
      seg(ctx, [ax, ay], [kx, ky], H * .032); seg(ctx, [kx, ky], [fx, 0], H * .024);
    }
  });
  // hintere Schere
  const schere = (raise, open, reach, c, back) => {
    ctx.strokeStyle = c; ctx.fillStyle = c;
    const s0 = [cx + bw * .7, cy + (back ? -bh * .1 : bh * .2)];
    const ang = -.2 - raise * 1.2, el = [s0[0] + Math.cos(ang) * H * .14, s0[1] + Math.sin(ang) * H * .14];
    const ang2 = ang + 1.1 - reach * .9, hand = [el[0] + Math.cos(ang2) * H * (.12 + reach * .1), el[1] + Math.sin(ang2) * H * (.12 + reach * .1)];
    seg(ctx, s0, el, H * .05); seg(ctx, el, hand, H * .045);
    const o = .25 + open * .6;
    [[-o, 1], [o * .6, .8]].forEach(([d, l]) => {
      const a2 = ang2 + d, tip = [hand[0] + Math.cos(a2) * H * .13 * l, hand[1] + Math.sin(a2) * H * .13 * l];
      ctx.beginPath(); ctx.moveTo(hand[0] - H * .02, hand[1] - H * .02);
      ctx.quadraticCurveTo(hand[0] + Math.cos(a2 - .4) * H * .1, hand[1] + Math.sin(a2 - .4) * H * .1, tip[0], tip[1]);
      ctx.lineTo(hand[0] + H * .02, hand[1] + H * .02); ctx.closePath(); ctx.fill();
    });
    return [hand[0] + Math.cos(ang2) * H * .1, hand[1] + Math.sin(ang2) * H * .1];
  };
  schere(p.b1, p.b2, 0, colB, true);
  // Panzer
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.lean * .6);
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, bw, bh, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 5; i++){
    const x = -bw * .7 + i * bw * .35;
    ctx.beginPath(); ctx.moveTo(x - H * .025, -bh * .8); ctx.lineTo(x, -bh * 1.25 - (i % 2) * H * .02); ctx.lineTo(x + H * .025, -bh * .8); ctx.fill();
  }
  ctx.strokeStyle = col; ctx.lineWidth = H * .014;
  const eye = [[bw * .55, -bh * 1.5 + Math.sin(t * .006) * H * .01], [bw * .8, -bh * 1.35 + Math.cos(t * .007) * H * .01]];
  eye.forEach(e => { ctx.beginPath(); ctx.moveTo(e[0] - H * .01, -bh * .6); ctx.lineTo(e[0], e[1]); ctx.stroke(); ctx.beginPath(); ctx.arc(e[0], e[1], H * .018, 0, TAU); ctx.fill(); });
  ctx.restore();
  const tip = schere(p.a1, p.a2, p.w, col, false);
  if (main){
    const c = Math.cos(p.lean * .6), s = Math.sin(p.lean * .6);
    const ew = eye.map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c]);
    augen(ctx, a, ew, H * .012);
    a.sk = { tip, chest: [cx, cy], head: ew[1], hip: [cx, cy], sho: [cx, cy], handA: tip, handB: tip, wAng: 1.6, hd: 0 };
  }
}
// Wrackspinne: Rumpf eines Bootes, acht Beine aus Rudern, Laternenaugen
function paintSpinne(ctx, a, H, col, colB, main){
  const p = a.pose, t = a.t;
  const cx = p.x * H, cy = -H * (.4 - p.f2 * .2) + p.y * H;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const thorax = [cx + H * .12, cy - H * .02];
  let frontTip = null;
  const bein = (side, i, c) => {
    ctx.strokeStyle = c; ctx.fillStyle = c;
    const hip = [thorax[0] - i * H * .05, thorax[1] + H * .02];
    const gait = Math.sin(t * .006 + i * 1.7 + side * 2) * H * .02;
    let foot = [cx + H * (.62 - i * .4) + gait + side * H * .03, 0];
    const raise = i === 0 ? (side > 0 ? p.a1 : p.b1) : 0;
    if (raise > .05){
      const r = Math.min(1, raise), tx = cx + H * (.5 + .45 * p.w), ty = cy - H * (.15 + .35 * Math.max(0, raise - p.w * .5));
      foot = [lerp(foot[0], tx, r), lerp(foot[1], ty, r)];
    }
    const knee = [(hip[0] + foot[0]) / 2 + (i < 2 ? .06 : -.06) * H, Math.min(hip[1], foot[1]) - H * (.26 + .05 * (i % 2)) + p.f2 * H * .1];
    seg(ctx, hip, knee, H * .034); seg(ctx, knee, foot, H * .024);
    // Ruderblatt am Ende
    const an = Math.atan2(foot[1] - knee[1], foot[0] - knee[0]);
    ctx.save(); ctx.translate(lerp(knee[0], foot[0], .8), lerp(knee[1], foot[1], .8)); ctx.rotate(an);
    ctx.beginPath(); ctx.ellipse(0, 0, H * .06, H * .02, 0, 0, TAU); ctx.fill(); ctx.restore();
    if (side > 0 && i === 0) frontTip = foot;
  };
  for (let i = 3; i >= 0; i--) bein(-1, i, colB);
  // Rumpf: kieloben liegendes Boot
  ctx.save(); ctx.translate(cx - H * .18, cy); ctx.rotate(p.lean * .5);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(H * .2, -H * .05); ctx.quadraticCurveTo(H * .05, -H * .26, -H * .38, -H * .12);
  ctx.quadraticCurveTo(-H * .46, -H * .02, -H * .34, H * .06); ctx.quadraticCurveTo(0, H * .1, H * .2, H * .04); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = H * .012;
  for (let k = 0; k < 3; k++){ ctx.beginPath(); ctx.moveTo(-H * .3, -H * (.08 - k * .05)); ctx.quadraticCurveTo(-H * .05, -H * (.18 - k * .06), H * .16, -H * (.03 - k * .03)); ctx.stroke(); }
  // Tau hängt herab
  ctx.lineWidth = H * .008; ctx.beginPath(); ctx.moveTo(-H * .2, H * .05); ctx.quadraticCurveTo(-H * .22 + Math.sin(t * .003) * H * .03, H * .2, -H * .18, H * .3); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(thorax[0], thorax[1], H * .1, 0, TAU); ctx.fill();
  for (let i = 3; i >= 0; i--) bein(1, i, col);
  if (main){
    const e = [[thorax[0] + H * .07, thorax[1] - H * .04], [thorax[0] + H * .09, thorax[1] - H * .0], [thorax[0] + H * .04, thorax[1] - H * .06], [thorax[0] + H * .1, thorax[1] - H * .05]];
    augen(ctx, a, e, H * .01);
    a.sk = { tip: frontTip, chest: thorax, head: e[0], hip: [cx, cy], sho: thorax, handA: frontTip, handB: frontTip, wAng: 1.6, hd: 0 };
  }
}

/* =====================================================================
   LEVEL: Gebiete aus Textkarten, Kollision und Geländeformen
   Eine Karte besteht aus Zeilen von oben nach unten, ein Zeichen pro Kachel:
     #  Fels und Erde        X  Mauerwerk          W  Holz (Wrack, Planken)
     =  Steg, von unten durchlässig                H  Leiter
     ~  Wasser               ^  Stacheln aus Salz oder Eisen
     %  brüchige Wand        |  Gitter, öffnet sich über einen Hebel
     .  oder Leerzeichen: Luft
   Buchstaben und Ziffern (außer H, W, X) sind Anker für Objekte, die im
   Gebiet unter „o“ beschrieben sind. Der Anker steht auf der Kachel über
   dem Boden, das Objekt steht also auf dem Boden darunter.
   ===================================================================== */
const T = 24;
const K = { luft: 0, fels: 1, mauer: 2, holz: 3, steg: 4, leiter: 5, wasser: 6, stachel: 7, bruch: 8, gitter: 9 };
const ZEICHEN = { '#': K.fels, 'X': K.mauer, 'W': K.holz, '=': K.steg, 'H': K.leiter, '~': K.wasser, '^': K.stachel, '%': K.bruch, '|': K.gitter };
const FEST = new Set([K.fels, K.mauer, K.holz, K.bruch, K.gitter]);

function ladeGebiet(id){
  const def = GEBIETE[id];
  const rows = def.karte;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const grid = new Uint8Array(w * h);
  const anker = {};
  for (let y = 0; y < h; y++){
    const r = rows[y];
    for (let x = 0; x < w; x++){
      const c = r[x] || ' ';
      if (ZEICHEN[c] != null) grid[y * w + x] = ZEICHEN[c];
      else if (/[A-Za-z0-9]/.test(c)) anker[c] = [x, y];
    }
  }
  const G = { id, def, w, h, grid, anker, W: w * T, Hh: h * T, offen: {} };
  G.hinten = (def.hinten || []).map(([x0, y0, x1, y1]) => [x0 * T, y0 * T, (x1 + 1) * T, (y1 + 1) * T]);
  G.wasser = wasserFlaechen(G);
  // Gitter merken, bevor sie sich öffnen: gezeichnet werden sie auch offen (hochgezogen)
  G.gitter = [];
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++){
    if (grid[y * w + x] !== K.gitter || (y > 0 && grid[(y - 1) * w + x] === K.gitter)) continue;
    let y1 = y; while (y1 < h && grid[y1 * w + x] === K.gitter) y1++;
    G.gitter.push({ x: x * T, y0: y * T, y1: y1 * T, tx: x, ty0: y, ty1: y1, auf: 0 });
  }
  baueFormen(G);
  return G;
}

/* ---------- Abfragen ---------- */
function kachel(G, tx, ty){
  if (tx < 0) tx = 0; else if (tx >= G.w) tx = G.w - 1;   // links und rechts geht der Rand weiter
  if (ty < 0) return K.luft;
  if (ty >= G.h) return K.fels;
  return G.grid[ty * G.w + tx];
}
function istFest(G, tx, ty){ return FEST.has(kachel(G, tx, ty)); }
// Oberkante einer Leiter trägt wie ein Steg
function traegt(G, tx, ty){
  const k = kachel(G, tx, ty);
  return k === K.steg || (k === K.leiter && kachel(G, tx, ty - 1) !== K.leiter);
}
const tileAt = v => Math.floor(v / T);
function setzeKachel(G, tx, ty, k){ G.grid[ty * G.w + tx] = k; }
// Boden unter einem Punkt (Weltkoordinaten), sucht nach unten
function bodenUnter(G, x, y){
  const tx = tileAt(x);
  for (let ty = Math.max(0, tileAt(y)); ty < G.h + 1; ty++) if (istFest(G, tx, ty) || traegt(G, tx, ty)) return ty * T;
  return G.Hh;
}
// Freie Sicht zwischen zwei Punkten (für Gegner, die den Spieler bemerken)
function sicht(G, x0, y0, x1, y1){
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / (T / 2));
  for (let i = 1; i < n; i++){ const u = i / n; if (istFest(G, tileAt(lerp(x0, x1, u)), tileAt(lerp(y0, y1, u)))) return false; }
  return true;
}
function wasserFlaechen(G){
  // Zusammenhängende Wasserkacheln zu Becken. Pro Spalte: Oberfläche und Grund.
  const seen = new Uint8Array(G.w * G.h), out = [];
  const ist = (x, y) => x >= 0 && y >= 0 && x < G.w && y < G.h && G.grid[y * G.w + x] === K.wasser;
  for (let i = 0; i < G.w * G.h; i++){
    if (seen[i] || G.grid[i] !== K.wasser) continue;
    const q = [i], sp = {}; seen[i] = 1;
    let minX = 1e9, maxX = -1;
    while (q.length){
      const j = q.pop(), x = j % G.w, y = (j - x) / G.w;
      const c = sp[x] || (sp[x] = [y, y + 1]); c[0] = Math.min(c[0], y); c[1] = Math.max(c[1], y + 1);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
        const nx = x + dx, ny = y + dy;
        if (ist(nx, ny) && !seen[ny * G.w + nx]){ seen[ny * G.w + nx] = 1; q.push(ny * G.w + nx); }
      }
    }
    const spalten = [];
    for (let x = minX; x <= maxX; x++) spalten.push(sp[x] ? [sp[x][0] * T, sp[x][1] * T] : null);
    const tops = spalten.filter(Boolean).map(c => c[0]), bots = spalten.filter(Boolean).map(c => c[1]);
    out.push({ tx0: minX, x0: minX * T, x1: (maxX + 1) * T, y0: Math.min(...tops), y1: Math.max(...bots), spalten });
  }
  return out;
}
// Welche Wasserfläche an einem Punkt? Liefert die Oberfläche (y0) in dieser Spalte
function wasserAn(G, x, y){
  for (const r of G.wasser){
    if (x < r.x0 || x >= r.x1) continue;
    const c = r.spalten[Math.floor(x / T) - r.tx0];
    if (c && y > c[0] && y <= c[1] + T * .5) return { y0: c[0], y1: c[1] };
  }
  return null;
}

/* ---------- Formen: Umrisse der festen Bereiche ---------- */
// Kanten zwischen festen und freien Kacheln, im Uhrzeigersinn um das Feste
function umrisse(G, pruef){
  const pad = 3, W = G.w + pad * 2, H = G.h + pad;
  // Außerhalb des erweiterten Rahmens ist nichts fest, damit sich jeder Umriss schließt
  const fest = (x, y) => {
    if (x < 0 || x >= W || y < 0 || y >= H) return false;
    if (y >= G.h) return pruef(K.fels);
    return pruef(kachel(G, x - pad, y));
  };
  const key = (x, y) => x * 4096 + y;
  const edges = new Map();
  const add = (x0, y0, x1, y1) => { const k = key(x0, y0); if (!edges.has(k)) edges.set(k, []); edges.get(k).push([x0, y0, x1, y1]); };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    if (!fest(x, y)) continue;
    if (!fest(x, y - 1)) add(x, y, x + 1, y);
    if (!fest(x + 1, y)) add(x + 1, y, x + 1, y + 1);
    if (!fest(x, y + 1)) add(x + 1, y + 1, x, y + 1);
    if (!fest(x - 1, y)) add(x, y + 1, x, y);
  }
  const loops = [];
  const used = new Set();
  for (const [, list] of edges) for (const e of list){
    if (used.has(e)) continue;
    const loop = [];
    let cur = e, guard = 0;
    while (cur && !used.has(cur) && guard++ < 100000){
      used.add(cur); loop.push([cur[0], cur[1]]);
      const next = edges.get(key(cur[2], cur[3]));
      if (!next) break;
      const cand = next.filter(n => !used.has(n));
      if (!cand.length) break;
      // Bei Berührung über Eck: rechts abbiegen, damit Bereiche getrennt bleiben
      const dx = cur[2] - cur[0], dy = cur[3] - cur[1];
      cand.sort((a, b) => turn(dx, dy, a) - turn(dx, dy, b));
      cur = cand[0];
    }
    if (loop.length > 2) loops.push(loop.map(([x, y]) => [(x - pad) * T, y * T]));
  }
  return loops;
}
function turn(dx, dy, e){ const ex = e[2] - e[0], ey = e[3] - e[1], cr = dx * ey - dy * ex; return cr > 0 ? 0 : cr === 0 ? 1 : 2; }
// Gerade Stücke zusammenfassen
function vereinfache(loop){
  const out = [];
  for (let i = 0; i < loop.length; i++){
    const a = loop[(i - 1 + loop.length) % loop.length], b = loop[i], c = loop[(i + 1) % loop.length];
    if ((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]) !== 0) out.push(b);
  }
  return out;
}
function unterteile(loop, step){
  const out = [];
  for (let i = 0; i < loop.length; i++){
    const a = loop[i], b = loop[(i + 1) % loop.length], n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 0; k < n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function chaikin(loop, n){
  for (let it = 0; it < n; it++){
    const out = [];
    for (let i = 0; i < loop.length; i++){
      const a = loop[i], b = loop[(i + 1) % loop.length];
      out.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
    }
    loop = out;
  }
  return loop;
}
// Ortsfestes Rauschen, damit Felsen bei jedem Laden gleich aussehen
function hash2(x, y){ let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function rauhe(loop, amp){
  return loop.map((p, i) => {
    const a = loop[(i - 1 + loop.length) % loop.length], b = loop[(i + 1) % loop.length];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    // Oberseiten nur wenig verformen, damit man sichtbar auf dem Boden steht
    const k = ny < -.6 ? .2 : 1, r = (hash2(Math.round(p[0]), Math.round(p[1])) - .5) * 2 * amp * k;
    return [p[0] + nx * r, p[1] + ny * r];
  });
}
function baueFormen(G){
  const stil = G.def.stil || {};
  const F = {};
  const pfad = (loops, fn) => { const p = new Path2D(); loops.forEach(l => { const q = fn(l); if (q.length < 3) return; p.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) p.lineTo(q[i][0], q[i][1]); p.closePath(); }); return p; };
  const fels = umrisse(G, k => k === K.fels || k === K.bruch).map(vereinfache).filter(l => l.length > 2);
  const felsFn = l => chaikin(rauhe(unterteile(l, T * .5), stil.rauh == null ? 3.5 : stil.rauh), 2);
  F.felsLoops = fels.map(felsFn);
  F.fels = pfad(F.felsLoops, l => l);
  const mauer = umrisse(G, k => k === K.mauer).map(vereinfache).filter(l => l.length > 2);
  F.mauerLoops = mauer;
  F.mauer = pfad(mauer, l => l);
  const holz = umrisse(G, k => k === K.holz).map(vereinfache).filter(l => l.length > 2);
  F.holzLoops = holz.map(l => chaikin(unterteile(l, T), 1));
  F.holz = pfad(F.holzLoops, l => l);
  // Lichtkanten: Stücke der Umrisse, deren Außenseite nach oben zeigt
  F.kante = new Path2D(); F.kanteSeiten = new Path2D();
  const kanten = [];
  [F.felsLoops, F.mauerLoops, F.holzLoops].forEach(ls => ls.forEach(l => {
    for (let i = 0; i < l.length; i++){
      const a = l[i], b = l[(i + 1) % l.length], nx = b[1] - a[1], ny = -(b[0] - a[0]), len = Math.hypot(nx, ny) || 1;
      // Umlauf im Uhrzeigersinn: die Normale (dy, -dx) zeigt nach außen
      const up = -ny / len;
      if (up > .45){ F.kante.moveTo(a[0], a[1]); F.kante.lineTo(b[0], b[1]); kanten.push([a, b]); }
      else if (Math.abs(nx / len) > .7){ F.kanteSeiten.moveTo(a[0], a[1]); F.kanteSeiten.lineTo(b[0], b[1]); }
    }
  }));
  F.kanten = kanten;
  // Fugen im Mauerwerk
  F.fugen = new Path2D();
  for (let y = 0; y < G.h; y++) for (let x = 0; x < G.w; x++){
    if (G.grid[y * G.w + x] !== K.mauer) continue;
    const X = x * T, Y = y * T;
    F.fugen.moveTo(X, Y + T); F.fugen.lineTo(X + T, Y + T);
    const off = (y % 2) ? T * .5 : 0;
    F.fugen.moveTo(X + off, Y); F.fugen.lineTo(X + off, Y + T);
  }
  // Stege, Leitern, Stacheln, Gitter und brüchige Wände werden einzeln gezeichnet
  F.stege = []; F.leitern = []; F.stacheln = []; F.brueche = [];
  for (let y = 0; y < G.h; y++){
    let x = 0;
    while (x < G.w){
      const k = G.grid[y * G.w + x];
      if (k === K.steg || k === K.stachel){
        let x1 = x; while (x1 < G.w && G.grid[y * G.w + x1] === k) x1++;
        (k === K.steg ? F.stege : F.stacheln).push([x * T, y * T, x1 * T]);
        x = x1; continue;
      }
      if (k === K.leiter && (y === 0 || G.grid[(y - 1) * G.w + x] !== K.leiter)){
        let y1 = y; while (y1 < G.h && G.grid[y1 * G.w + x] === K.leiter) y1++;
        F.leitern.push([x * T, y * T, y1 * T]);
      }
      if (k === K.bruch && (y === 0 || G.grid[(y - 1) * G.w + x] !== K.bruch)){
        let y1 = y; while (y1 < G.h && G.grid[y1 * G.w + x] === K.bruch) y1++;
        F.brueche.push({ x: x * T, y0: y * T, y1: y1 * T, tx: x, ty0: y, ty1: y1 });
      }
      x++;
    }
  }
  G.F = F;
}
// Brüchige Wand zerschlagen: Kacheln werden Luft, die Formen neu gebaut
function zerbrich(G, b){
  for (let y = b.ty0; y < b.ty1; y++) setzeKachel(G, b.tx, y, K.luft);
  baueFormen(G);
}
// Gitter öffnen: begehbar sofort, hochgezogen wird es im Bild
function oeffneGitter(G, g, sofort){
  for (let y = g.ty0; y < g.ty1; y++) setzeKachel(G, g.tx, y, K.luft);
  g.offen = true; if (sofort) g.auf = 1;
}

/* =====================================================================
   THEMEN: Farbwelt und Hintergrundebenen jedes Gebiets
   Jede Ebene wird einmal in einen Streifen gemalt, der sich nahtlos
   wiederholt. par: wie stark sie sich mit der Kamera bewegt (0 = gar nicht).
   base: Anteil der Streifenhöhe, an dem der Horizont liegt.
   ===================================================================== */

/* ---------- Werkzeuge für die Maler ---------- */
// Etwas nahtlos in einen Streifen malen: auch um die Breite verschoben
function nahtlos(w, x, breite, fn){ fn(x); if (x + breite > w) fn(x - w); if (x - breite < 0) fn(x + w); }
function verlauf(g, y0, y1, farben){ const gr = g.createLinearGradient(0, y0, 0, y1); farben.forEach((c, i) => gr.addColorStop(i / (farben.length - 1), c)); return gr; }
function bergkette(g, w, base, hoehe, R, farbe, zacken = 18, rau = 1){
  g.fillStyle = farbe; g.beginPath(); g.moveTo(0, base + 2);
  const n = Math.round(w / zacken), pts = [];
  for (let i = 0; i <= n; i++) pts.push(R());
  pts[n] = pts[0];
  for (let i = 0; i <= n; i++){
    const x = i * zacken, s = Math.sin(i / n * TAU * 2) * .3 + Math.sin(i / n * TAU * 5 + 1) * .2;
    g.lineTo(x, base - hoehe * (.55 + s * .5 + (pts[i] - .5) * .25 * rau));
  }
  g.lineTo(w, base + 2); g.closePath(); g.fill();
}
function turmAufWasser(g, x, base, h, w, farbe, licht){
  g.fillStyle = farbe;
  g.fillRect(x - w / 2, base - h, w, h + 2);
  g.fillRect(x - w * .8, base - h - h * .12, w * 1.6, h * .14);
  g.beginPath(); g.moveTo(x - w * .8, base - h - h * .12); g.lineTo(x, base - h - h * .34); g.lineTo(x + w * .8, base - h - h * .12); g.fill();
  if (licht){ g.fillStyle = licht; g.fillRect(x - 1, base - h - h * .08, 2, 2); }
}
function meerFlaeche(g, w, h, base, farben){
  g.fillStyle = verlauf(g, base, h, farben); g.fillRect(0, base, w, h - base);
  g.fillStyle = 'rgba(214,224,238,.12)'; g.fillRect(0, base, w, 1);
  g.strokeStyle = 'rgba(190,205,220,.05)'; g.lineWidth = 1;
  for (let i = 1; i < 12; i++){ const y = base + Math.pow(i / 12, 1.6) * (h - base); g.beginPath(); for (let x = 0; x <= w; x += 20){ const yy = y + Math.sin(x * .02 + i) * (1 + i * .15); x ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke(); }
}
function haus(g, R, x, base, w, h, col, licht){
  g.fillStyle = col;
  g.fillRect(x - w / 2, base - h, w, h + 2);
  g.beginPath(); g.moveTo(x - w * .56, base - h); g.lineTo(x, base - h - w * .55); g.lineTo(x + w * .56, base - h); g.closePath(); g.fill();
  if (R() < .5) g.fillRect(x + w * .18, base - h - w * .45, w * .1, w * .3);
  const rows = Math.max(1, Math.floor(h / (w * .45))), cols = w > 30 ? 2 : 1;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
    const wx = x - w * (cols === 2 ? .22 : 0) + k * w * .44 - w * .07, wy = base - h + h * .12 + r * w * .45;
    const on = licht && R() < licht;
    g.fillStyle = on ? 'rgba(235,190,120,.6)' : 'rgba(0,0,0,.45)';
    g.fillRect(wx, wy, w * .14, w * .2);
  }
}
function toterBaum(g, R, x, base, h, dir, farbe){
  g.strokeStyle = farbe;
  const ast = (x0, y0, len, ang, lw, d) => {
    const x1 = x0 + Math.sin(ang) * len, y1 = y0 - Math.cos(ang) * len;
    g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(x0 + Math.sin(ang) * len * .3 + dir * len * .1, y0 - Math.cos(ang) * len * .6, x1, y1); g.stroke();
    if (d > 0){ ast(x1, y1, len * .62, ang - .5 - R() * .3, lw * .6, d - 1); ast(x1, y1, len * .55, ang + .4 + R() * .3, lw * .6, d - 1); }
  };
  ast(x, base, h * .45, dir * .12, Math.max(2, h * .05), 4);
}
function schilfBuesche(g, R, w, base, n, hoehe, farbe){
  g.strokeStyle = farbe; g.fillStyle = farbe;
  for (let i = 0; i < n; i++){
    const cx = R() * w, hh = hoehe * (.5 + R() * .6), k = 6 + Math.floor(R() * 8);
    nahtlos(w, cx, 40, x => {
      for (let j = 0; j < k; j++){
        const bx = x + (R() - .5) * hh * .5, h2 = hh * (.6 + R() * .5), bend = (R() - .4) * hh * .25;
        g.lineWidth = Math.max(1, hh * .02);
        g.beginPath(); g.moveTo(bx, base); g.quadraticCurveTo(bx + bend * .3, base - h2 * .6, bx + bend, base - h2); g.stroke();
        if (R() < .3){ g.beginPath(); g.ellipse(bx + bend * .95, base - h2 * .93, hh * .014 + 1, hh * .05, bend * .01, 0, TAU); g.fill(); }
      }
    });
  }
}
function wrack(g, x, base, s, dir, farbe){
  g.strokeStyle = farbe; g.fillStyle = farbe;
  g.lineWidth = Math.max(2, s * .06);
  for (let i = 0; i < 6; i++){
    const bx = x + dir * i * s * .18, h = s * (.5 + i * .09);
    g.beginPath(); g.moveTo(bx, base + 4); g.quadraticCurveTo(bx - dir * s * .22, base - h * .6, bx + dir * s * .06, base - h); g.stroke();
  }
  g.lineWidth = Math.max(3, s * .08); g.beginPath(); g.moveTo(x - dir * s * .15, base - 2); g.lineTo(x + dir * s * 1.1, base - s * .1); g.stroke();
  g.lineWidth = Math.max(2, s * .04); g.beginPath(); g.moveTo(x + dir * s * .5, base - s * .1); g.lineTo(x + dir * s * .7, base - s * 1.6); g.stroke();
}
function schiff(g, x, base, w, h, tilt, farbe){
  g.save(); g.translate(x, base); g.rotate(tilt); g.fillStyle = farbe;
  g.beginPath(); g.moveTo(-w / 2, -h); g.lineTo(w / 2, -h * 1.15); g.quadraticCurveTo(w * .46, h * .1, w * .2, h * .2); g.lineTo(-w * .3, h * .2); g.quadraticCurveTo(-w * .5, 0, -w / 2, -h); g.fill();
  g.restore();
}
function mast(g, x, base, h, tilt, farbe){
  g.strokeStyle = farbe; g.lineWidth = Math.max(2, h * .018);
  const x1 = x + Math.sin(tilt) * h, y1 = base - Math.cos(tilt) * h;
  g.beginPath(); g.moveTo(x, base); g.lineTo(x1, y1); g.stroke();
  g.lineWidth = Math.max(1.5, h * .01);
  g.beginPath(); g.moveTo(x1 - Math.cos(tilt) * h * .2, y1 + h * .15); g.lineTo(x1 + Math.cos(tilt) * h * .2, y1 + h * .15 + Math.sin(tilt) * h * .4); g.stroke();
  return [x1, y1];
}
function glockenturm(g, x, base, h, w, farbe){
  g.fillStyle = farbe;
  g.fillRect(x - w / 2, base - h, w, h + 4);

/* ---------- Dekor an den Oberkanten des Geländes ---------- */
function dekoKiesel(ctx, kanten, v){
  ctx.fillStyle = 'rgba(150,165,185,.18)';
  for (const [a, b] of kanten){
    if (b[0] < v[0] || a[0] > v[2]) continue;
    const n = Math.floor(Math.abs(b[0] - a[0]) / 7);
    for (let i = 0; i < n; i++){ const u = (i + .5) / n, x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u); if (hash2(x, y) < .35) ctx.fillRect(x, y - 1.5, 2 + hash2(y, x) * 3, 1.5); }
  }
}
function dekoGras(farbe, hoch, dicht){
  return (ctx, kanten, v, t) => {
    ctx.strokeStyle = farbe; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const [a, b] of kanten){
      if (b[0] < v[0] || a[0] > v[2]) continue;
      const n = Math.floor(Math.abs(b[0] - a[0]) / 5);
      for (let i = 0; i < n; i++){
        const u = (i + .5) / n, x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u), s = hash2(x | 0, y | 0);
        if (s > dicht) continue;
        const hh = hoch * (.4 + s * 1.4), sw = Math.sin(t * .0015 + x * .05) * hh * .15;
        ctx.moveTo(x, y + 1); ctx.quadraticCurveTo(x + sw * .3, y - hh * .5, x + sw + (s - .5) * hh * .4, y - hh);
      }
    }
    ctx.stroke();
  };
}
function dekoSalz(ctx, kanten, v){
  for (const [a, b] of kanten){
    if (b[0] < v[0] || a[0] > v[2]) continue;
    const n = Math.floor(Math.abs(b[0] - a[0]) / 9);
    for (let i = 0; i < n; i++){

/* ---------- Vordergrund: dunkle Formen dicht vor der Kamera ---------- */
function vorneFormen(art){
  return (ctx, cam, W, H, t, z) => {
    const par = 1.45, step = 520, off = cam.x * z * par;
    const i0 = Math.floor((off - 200) / step), i1 = Math.floor((off + W + 200) / step);
    ctx.fillStyle = '#020304'; ctx.strokeStyle = '#020304';
    for (let i = i0; i <= i1; i++){
      const s = hash2(i, 91); if (s > .55) continue;
      const x = i * step - off + s * 200, base = H + 10 - (cam.y - (World.horizontY() || 0)) * z * .05;
      if (art === 'schilf'){
        ctx.lineWidth = 3;
        for (let k = 0; k < 9; k++){ const bx = x + (hash2(i, k) - .5) * 60, h = 90 + hash2(k, i) * 120, sw = Math.sin(t * .001 + k) * 8; ctx.beginPath(); ctx.moveTo(bx, base); ctx.quadraticCurveTo(bx + sw * .5, base - h * .6, bx + sw + 10, base - h); ctx.stroke(); }
      } else if (art === 'kette'){
        ctx.lineWidth = 5; ctx.setLineDash([9, 5]);
        ctx.beginPath(); ctx.moveTo(x, -10); ctx.quadraticCurveTo(x + 30 + Math.sin(t * .001) * 8, H * .3, x + 10, H * .55); ctx.stroke(); ctx.setLineDash([]);
      } else if (art === 'pfahl'){
        ctx.fillRect(x, base - H * .5, 22, H * .6);
        ctx.fillRect(x - 6, base - H * .5, 34, 8);
      } else {
        ctx.beginPath(); ctx.moveTo(x - 80, base); ctx.quadraticCurveTo(x, base - 70 - s * 90, x + 110, base); ctx.fill();
      }
    }
  };
}

    for (let x = x0; x <= x1 + 10; x += 10){ const y = lv + Math.sin(x * .03 + t * .003) * 2.5 + Math.sin(x * .011 - t * .0017) * 2; x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }

  }

  /* ---------- Licht ---------- */
  function glow(ctx, x, y, r, col, a){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function drawLichter(ctx, t){
    const [x0, y0, x1, y1] = view();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const L of lights.concat(dynLights)){
      if (L.x + L.r < x0 || L.x - L.r > x1 || L.y + L.r < y0 || L.y - L.r > y1) continue;
      const fl = L.flacker ? .85 + .15 * Math.sin(t * .013 + L.x) * Math.sin(t * .031 + L.y) : 1;
      glow(ctx, L.x, L.y, L.r * fl, L.col, (L.a || .35) * fl);
    }
    ctx.restore();
  }
  // Dunkelheit in Höhlen und Innenräumen, mit Löchern um jedes Licht
  function drawDunkel(ctx){
    if (dunkel < .02) return;
    if (!cache.dunkel || cache.dunkel.w !== W){ const [c, g] = canvas(W / 2, Hh / 2); cache.dunkel = { c, g, w: W }; }
    const { c, g } = cache.dunkel;
    g.setTransform(.5, 0, 0, .5, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, W, Hh);
    g.fillStyle = `rgba(1,2,4,${dunkel})`; g.fillRect(0, 0, W, Hh);
    g.globalCompositeOperation = 'destination-out';
    for (const L of lights.concat(dynLights)){
      const [sx, sy] = toScreen(L.x, L.y), r = L.r * cam.z * (L.hell || 1.4);
      if (sx + r < 0 || sx - r > W || sy + r < 0 || sy - r > Hh) continue;
      const gr = g.createRadialGradient(sx, sy, 0, sx, sy, r);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.5, 'rgba(0,0,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    ctx.drawImage(c, 0, 0, W, Hh);
  }

  /* ---------- Wetter und Schwebeteilchen ---------- */
  function wetterStep(dt, t){
    const n = TH.regen ? Math.round(TH.regen * 140) : 0;
    while (wetter.length < n) wetter.push({ x: rnd() * W, y: rnd() * Hh, v: .9 + rnd() * .5, l: 10 + rnd() * 14 });
    for (const d of wetter){ d.y += d.v * dt * .9; d.x += d.v * dt * .18; if (d.y > Hh){ d.y = -20; d.x = rnd() * (W + 100) - 100; } }
  }
  function drawWetter(ctx, t){
    if (wetter.length){
      ctx.strokeStyle = 'rgba(190,205,225,.22)'; ctx.lineWidth = 1; ctx.beginPath();
      for (const d of wetter){ ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y - d.l); }
      ctx.stroke();
    }
    // Schwebeteilchen je nach Gebiet
    const art = TH.teilchen;
    if (!art) return;
    const def = TEILCHEN[art], n = def.n;
    for (let i = 0; i < n; i++){
      const s = hash2(i, 7), s2 = hash2(i, 13), sp = def.v * (.5 + s2);
      const par = .4 + s * .9;
      let x = ((s * 1.7 + t * sp * def.dx * .00004) % 1.2 - .1) * W - cam.x * baseZ * par * .08;
      x = ((x % (W * 1.2)) + W * 1.2) % (W * 1.2) - W * .1;
      let y = ((s2 * 1.3 + t * sp * def.dy * .00004) % 1.1 - .05) * Hh + Math.sin(t * .001 * def.wob + i) * 12 - cam.y * baseZ * par * .05;
      y = ((y % (Hh * 1.1)) + Hh * 1.1) % (Hh * 1.1) - Hh * .05;
      const a = def.a * (.4 + .6 * Math.sin(t * .002 + i * 1.7) ** 2), r = def.r * (.6 + s * .8);
      if (def.glut){ ctx.globalCompositeOperation = 'lighter'; }
      ctx.globalAlpha = a; ctx.fillStyle = def.col;
      if (def.form === 'blatt'){ ctx.save(); ctx.translate(x, y); ctx.rotate(t * .002 + i); ctx.beginPath(); ctx.ellipse(0, 0, r * 1.8, r * .8, 0, 0, TAU); ctx.fill(); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
  }
  const TEILCHEN = {
    gischt: { n: 36, v: 1, dx: 1.4, dy: .2, wob: 1, a: .35, r: 1.1, col: '#dbe6f0' },
    salz: { n: 50, v: .6, dx: .4, dy: .9, wob: 1.5, a: .5, r: 1.2, col: '#eef4fa' },
    staub: { n: 40, v: .3, dx: .5, dy: .3, wob: .8, a: .35, r: 1, col: '#c9d3df' },
    glut: { n: 28, v: .7, dx: .3, dy: -1.2, wob: 2, a: .8, r: 1.3, col: '#ffae5c', glut: true },
    irrlicht: { n: 16, v: .25, dx: .6, dy: .15, wob: .6, a: .9, r: 1.8, col: '#9fe8c8', glut: true },
    blueten: { n: 26, v: .5, dx: .9, dy: .7, wob: 2.5, a: .55, r: 2.2, col: '#e9ecef', form: 'blatt' }
  };
  function drawNebel(ctx, t){
    const n = TH.nebel || 0; if (!n) return;
    const hy = Hh / 2 + (horizontY() - cam.y) * baseZ * .5;
    for (let i = 0; i < 5; i++){
      const x = ((i * .31 + t * .000012 * (1 + i * .4) - cam.x * .00008 * (1 + i * .3)) % 1.4 + 1.4) % 1.4 * W - W * .2;

      ctx.fillStyle = g; ctx.fillRect(x - r, y - r * .4, r * 2, r * .8);
    }
  }

  /* ---------- Effekte (Weltkoordinaten) ---------- */
  const KIND = {
    spark: () => ({ v: .35, size: [1, 2.2], life: [180, 380], col: '255,210,150', g: .0006, add: true }),
    gold:  () => ({ v: .45, size: [1.2, 2.8], life: [300, 650], col: '240,205,120', g: .0003, add: true }),
    drop:  () => ({ v: .22, size: [1.2, 2.6], life: [400, 800], col: '160,200,210', g: .0009, add: false }),
    ember: () => ({ v: .08, size: [1, 2.2], life: [900, 1800], col: '255,160,80', g: -.00006, add: true }),
    mist:  () => ({ v: .03, size: [8, 18], life: [800, 1600], col: '150,170,190', g: -.00004, add: false, fade: .18 }),
    heal:  () => ({ v: .06, size: [1, 2], life: [700, 1200], col: '200,225,255', g: -.00012, add: true }),
    salz:  () => ({ v: .3, size: [1, 2.4], life: [400, 900], col: '235,242,250', g: .0008, add: false }),
    staub: () => ({ v: .12, size: [3, 7], life: [500, 900], col: '120,130,140', g: -.00002, add: false, fade: .3 }),
    blut:  () => ({ v: .25, size: [1.2, 2.6], life: [400, 800], col: '120,20,20', g: .0009, add: false }),
    splash: () => ({ v: .28, size: [1, 2.2], life: [300, 600], col: '190,220,230', g: .0012, add: false })
  };
  function burst(x, y, kind, n = 10, dir = null){
    const k = KIND[kind](); if (!k) return;
    for (let i = 0; i < n; i++){
      const a = dir === null ? rnd() * TAU : dir + (rnd() - .5) * 1.4, v = k.v * (.35 + rnd());

    }
  }
  function glutFlow(from, to, n = 24){
    for (let i = 0; i < n; i++) parts.push({ x: from[0] + (rnd() - .5) * 30, y: from[1] + (rnd() - .5) * 40, vx: (rnd() - .5) * .15, vy: -rnd() * .15, life: -i * 30, max: 1500, size: 1.2 + rnd() * 1.5, col: '255,170,90', g: 0, add: true, drag: .99, home: to });
  }
  function ring(x, y, r0, r1, col, dur = 420, w = 2){ rings.push({ x, y, r0, r1, col, t: 0, dur, w }); }
  function pop(x, y, text, col = '#e8ecf2', size = 18){ pops.push({ x, y, text, col, size, t: 0, dur: 900 }); }
  function ghost(a){ ghosts.push({ a: Object.assign({}, a, { pose: Object.assign({}, a.pose), trail: [] }), t: 0, dur: 260 }); }
  function shake(p){ if (!reduceMotion) shakeP = Math.max(shakeP, p); }
  function flash(col, a){ flashC = col; flashA = Math.max(flashA, a); }
  function wave(x0, x1, dur, gy){ waves.push({ x0, x1, dur, t: 0, gy }); }
  function updateFx(dt){
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.life += dt;
      if (p.life < 0) continue;
      if (p.home){
        const to = typeof p.home === 'function' ? p.home() : p.home;
        const dx = to[0] - p.x, dy = to[1] - p.y, d = Math.hypot(dx, dy) || 1, pull = Math.min(1, p.life / 500) * .0022;
        p.vx += dx / d * pull * dt; p.vy += dy / d * pull * dt;
        if (d < 14 && p.life > 300) p.life = p.max;
      }
      p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;

    }

    for (let i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > pops[i].dur) pops.splice(i, 1); }
    for (let i = ghosts.length - 1; i >= 0; i--){ ghosts[i].t += dt; if (ghosts[i].t > ghosts[i].dur) ghosts.splice(i, 1); }
    shakeP *= Math.pow(.988, dt); if (shakeP < .2) shakeP = 0;
    flashA *= Math.pow(.992, dt);
    flood += (floodT - flood) * (1 - Math.pow(.9985, dt));
    tint += (tintT - tint) * (1 - Math.pow(.998, dt));
    slowA += ((slowOn ? 1 : 0) - slowA) * (1 - Math.pow(.99, dt));
    letter += (letterT - letter) * (1 - Math.pow(.993, dt));
    dunkel += (dunkelT - dunkel) * (1 - Math.pow(.997, dt));
    stepCam(dt);
    wetterStep(dt);
    cam.sx = shakeP ? (rnd() - .5) * shakeP : 0; cam.sy = shakeP ? (rnd() - .5) * shakeP : 0;
  }
  function drawWellen(ctx, dt){
    for (let i = waves.length - 1; i >= 0; i--){
      const w = waves[i]; w.t += dt;
      const k = Math.min(1, w.t / w.dur), x = lerp(w.x0, w.x1, EASE.in(k)), gy = w.gy, h = 90 * Math.sin(Math.min(1, k * 1.3) * Math.PI * .5 + .2), dir = Math.sign(w.x1 - w.x0) || 1;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(x, gy - h, x, gy);
      g.addColorStop(0, 'rgba(190,240,236,.6)'); g.addColorStop(1, 'rgba(40,110,120,.25)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x + 40 * dir, gy);
      ctx.quadraticCurveTo(x + 10 * dir, gy - h * 1.1, x - 20 * dir, gy - h); ctx.quadraticCurveTo(x - 10 * dir, gy - h * .5, x - 70 * dir, gy);
      ctx.closePath(); ctx.fill(); ctx.restore();
      if (rnd() < .7) burst(x - 10 * dir + rnd() * 30 * dir, gy - h * rnd(), 'drop', 1);
      if (w.t > w.dur + 120) waves.splice(i, 1);
    }
  }
  function drawFxWelt(ctx, t, dt){
    drawWellen(ctx, dt);
    for (const p of parts){

      ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
      ctx.fillStyle = `rgba(${p.col},${Math.min(1, k * 1.5) * p.fade})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.fade < 1 ? (1.4 - k * .6) : 1), 0, TAU); ctx.fill();
    }

  }
  // Schadenszahlen in Bildschirmgröße, damit sie beim Zoomen lesbar bleiben

      const k = p.t / p.dur, [sx, sy] = toScreen(p.x, p.y);

      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(p.text, sx, y);

  }

  /* ---------- Ein ganzes Bild ---------- */
  // h: { hinten(ctx), figuren(ctx), spiegel(ctx), vorn(ctx), kampf(ctx) }
  function draw(ctx, t, dt, h = {}){
    if (!G){ ctx.fillStyle = '#050608'; ctx.fillRect(0, 0, W, Hh); return; }
    const hy = Hh / 2 + (horizontY() - cam.y) * baseZ * .15;

    drawEbenen(ctx);
    drawNebel(ctx, t);
    ctx.save();
    ctx.translate(W / 2 + cam.sx, Hh / 2 + cam.sy); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);

    if (h.hinten) h.hinten(ctx);
    drawLichter(ctx, t);
    for (const g of ghosts) drawActor(ctx, g.a, .35 * (1 - g.t / g.dur));
    if (h.figuren) h.figuren(ctx);
    if (h.kampf) h.kampf(ctx);
    drawWasser(ctx, t, h.spiegel);
    drawFlut(ctx, t);
    if (h.vorn) h.vorn(ctx);
    drawFxWelt(ctx, t, dt);
    if (TH.vorWelt) TH.vorWelt(ctx, G, view(), t);
    ctx.restore();
    if (TH.vordergrund) TH.vordergrund(ctx, cam, W, Hh, t, baseZ);
    drawDunkel(ctx);
    drawWetter(ctx, t);
    drawPops(ctx);
    drawUeber(ctx, t);
    dynLights = [];
  }
  function drawUeber(ctx, t){
    if (tint > .01){ ctx.fillStyle = `rgba(30,90,100,${tint * .14})`; ctx.fillRect(0, 0, W, Hh); }
    if (slowA > .01){ ctx.fillStyle = `rgba(120,160,210,${slowA * .1})`; ctx.fillRect(0, 0, W, Hh); }
    if (TH.farbe){ ctx.fillStyle = TH.farbe; ctx.fillRect(0, 0, W, Hh); }
    ctx.drawImage(cache.vignette, -W * .05, -Hh * .05, W * 1.1, Hh * 1.1);
    if (!reduceMotion){ ctx.globalAlpha = .6; const ox = -(t * .37 % 160), oy = -(t * .23 % 160); for (let x = ox; x < W; x += 160) for (let y = oy; y < Hh; y += 160) ctx.drawImage(cache.korn, x, y); ctx.globalAlpha = 1; }
    if (letter > .005){ const b = letter * Hh * .09; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, b); ctx.fillRect(0, Hh - b, W, b); }
    if (flashA > .01){ ctx.globalAlpha = Math.min(1, flashA); ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, Hh); ctx.globalAlpha = 1; }
  }
  // Glocke im Turm, als Teil der Welt gezeichnet
  function glocke(ctx, x, y, bw, t){
    bellSwing += (bellT - bellSwing) * .02;
    bellPh += .0015 + bellSwing * .002;
    const ang = Math.sin(bellPh * 1.4) * (.03 + bellSwing * .22), bh = bw * .9;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = '#080a0d';
    ctx.fillRect(-bw * .05, 0, bw * .1, bh * .12);
    ctx.beginPath(); ctx.moveTo(-bw * .2, bh * .12); ctx.quadraticCurveTo(-bw * .28, bh * .15, -bw * .3, bh * .45);
    ctx.quadraticCurveTo(-bw * .34, bh * .8, -bw * .52, bh); ctx.lineTo(bw * .52, bh); ctx.quadraticCurveTo(bw * .34, bh * .8, bw * .3, bh * .45);
    ctx.quadraticCurveTo(bw * .28, bh * .15, bw * .2, bh * .12); ctx.closePath(); ctx.fill();

    resize, size, setArea, area, theme, setLights, dynLight, follow, focus, release, cam, toScreen, view, zoomBase, horizontY,

    burst, glutFlow, ring, pop, ghost, shake, flash, wave,
    setFlood(v, gy){ floodT = v; if (gy != null) floodY = gy; }, sceneFlood: () => 0,
    setTint(v){ tintT = v; }, setSlow(v){ slowOn = v; }, bell(v){ bellT = v; },
    letterbox(v){ letterT = v; }, dunkel(v){ dunkelT = v == null ? (TH && TH.dunkel) || 0 : v; },
    clearFx(){ parts.length = 0; rings.length = 0; pops.length = 0; ghosts.length = 0; waves.length = 0; },
    reset(){ parts.length = 0; rings.length = 0; pops.length = 0; ghosts.length = 0; waves.length = 0; flood = floodT = 0; tint = tintT = 0; bellT = 0; }
  };
})();

/* =====================================================================
   EINGABE: Stick und Knöpfe auf dem Bildschirm, dazu die Tastatur
   Erkundung: links ein Stick (irgendwo in die linke Hälfte tippen),
   rechts Springen, Angriff, Ausweichen und die Aktion am Ort.
   ===================================================================== */
const Eingabe = (() => {
  const st = { x: 0, y: 0, keyX: 0, keyY: 0, stickX: 0, stickY: 0 };
  const gedrueckt = {}, neu = {};
  let stick = null, aktiv = true;
  const TASTE = {
    ArrowLeft: 'links', a: 'links', ArrowRight: 'rechts', d: 'rechts', ArrowUp: 'hoch', w: 'hoch', ArrowDown: 'runter', s: 'runter',
    ' ': 'sprung', j: 'angriff', Enter: 'angriff', e: 'aktion', k: 'rolle', Shift: 'rolle', m: 'karte', Escape: 'menue'
  };
  function druck(k){ if (!gedrueckt[k]) neu[k] = true; gedrueckt[k] = true; }
  function los(k){ gedrueckt[k] = false; }
  function tasten(){
    st.keyX = (gedrueckt.rechts ? 1 : 0) - (gedrueckt.links ? 1 : 0);
    st.keyY = (gedrueckt.runter ? 1 : 0) - (gedrueckt.hoch ? 1 : 0);
  }
  document.addEventListener('keydown', e => {
    const k = TASTE[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (!k || !aktiv) return;
    if (e.repeat){ e.preventDefault(); return; }
    druck(k); tasten();
    if (['links', 'rechts', 'hoch', 'runter', 'sprung'].includes(k)) e.preventDefault();
  });
  document.addEventListener('keyup', e => { const k = TASTE[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k){ los(k); tasten(); } });

  // Stick: erscheint dort, wo der Daumen aufsetzt
  function stickSetup(zone, ring, knopf){
    const R = 46;
    zone.addEventListener('pointerdown', e => {
      if (stick) return;
      e.preventDefault();
      try { zone.setPointerCapture(e.pointerId); } catch (err) {}
      const b = zone.getBoundingClientRect();
      stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, bx: b.left, by: b.top };
      ring.style.transform = `translate(${e.clientX - b.left}px, ${e.clientY - b.top}px)`; ring.classList.add('an');
      knopf.style.transform = 'translate(0px, 0px)';
      if (window.Snd) Snd.init();
    });
    const move = e => {
      if (!stick || e.pointerId !== stick.id) return;
      let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
      const d = Math.hypot(dx, dy);
      // Der Stick wandert mit, wenn der Daumen weit wegrutscht
      if (d > R * 1.4){ const k = (d - R * 1.4) / d; stick.ox += dx * k; stick.oy += dy * k; dx = e.clientX - stick.ox; dy = e.clientY - stick.oy; ring.style.transform = `translate(${stick.ox - stick.bx}px, ${stick.oy - stick.by}px)`; }
      const m = Math.min(1, Math.hypot(dx, dy) / R);
      const ang = Math.atan2(dy, dx);

    };

      if (!stick || e.pointerId !== stick.id) return;
      stick = null; st.stickX = 0; st.stickY = 0; ring.classList.remove('an');
    };

    setAktiv(v){ aktiv = v; if (!v) this.loslassen(); }
  };

  greta: { name: 'Greta', look: 'greta', titel: 'Netzflickerin aus Pfahlwyk' },

};
// Welches Gespräch gerade dran ist
function gespraechFuer(id, D, ort){
  const m = D.merker;
  if (id === 'enna'){
    if (ort === 'turmtreppe') return D.bosse.isolde ? 'enna_ende' : 'enna_treppe';
    if (!m.enna1) return 'enna1';
    if (D.bosse.vogt && !m.enna_vogt) return 'enna_vogt';
    return 'enna_rast';
  }
  if (id === 'oswin') return m.oswin1 ? 'oswin2' : 'oswin1';
  if (id === 'mira'){
    if (!m.mira1) return 'mira1';
    if ((D.items.helm || 0) > 0) return 'mira_helm';
    if (ort === 'brunnenplatz' && !m.mira_velmora) return 'mira_velmora';
    return 'mira_handel';
  }
  if (id === 'greta'){
    if (!m.greta1) return 'greta1';
    if ((D.items.nadel || 0) > 0) return 'greta_nadel';
    return m.greta_fertig ? 'greta_nach' : 'greta_warten';
  }
  if (id === 'kalden'){
    if (ort === 'brunnenplatz') return 'kalden_abschied';
    if (!m.kalden1) return 'kalden1';
    return 'kalden2';
  }
}

/* ---------- Stimmen (derzeit nicht im Spiel, siehe README) ---------- */
const SPRECHER = {
  erzaehler: { name: 'Erzähler', stimme: 'de_DE-thorsten-high', tempo: 1.08, tiefe: .96, hall: .2, laut: 1 },
  vogt:      { name: 'Der Strandvogt', stimme: 'de_DE-thorsten_emotional-medium', sprecher: 'disgusted', tempo: 1.12, tiefe: .8, hall: .5, laut: 1.1 }
};
function stimmZeilen(){
  const z = [];
  ANFANG.erwachen.forEach((t, i) => z.push({ id: 'erwachen.' + i, wer: 'erzaehler', text: t }));
  ANFANG.herkunft.forEach((t, i) => z.push({ id: 'herkunft.' + i, wer: 'erzaehler', text: t }));
  for (const k in HERK) z.push({ id: 'herk.' + k, wer: 'erzaehler', text: HERK[k].rise });
  for (const k in SAETZE) z.push({ id: k, wer: 'erzaehler', text: SAETZE[k] });
  for (const k in FEINDE){
    const d = FEINDE[k], wer = SPRECHER[k] ? k : 'erzaehler';
    if (d.intro) z.push({ id: k + '.intro', wer, text: d.intro });
    (d.phasen || []).forEach((p, i) => { if (p.line) z.push({ id: k + '.phase' + (i + 1), wer, text: p.line }); });
  }
  return z;
}

/* =====================================================================
   SKRIPTE: Hinweise, Ereignisse in der Welt und Zwischenszenen
   Ein Ereignis in einer Karte nennt sein Skript mit „skript“.
   Bosse: vor_<boss>(e) läuft vor dem Kampf, nach_<boss>(e, beute) danach.
   Gebiete: „betreten“ nennt ein Skript, das beim Betreten läuft (erst = zum ersten Mal).
   ===================================================================== */
const lies = id => new Promise(r => zeigeLore(id, r));
const erhalten = gab => { if (gab && gab.length) toast('Erhalten: ' + gab.join(', '), 3400); };
// Den Gegner nach dem Kampf noch einmal zeigen, kniend oder liegend
function gefallen(e, stance = 'kneel'){
  const A = e.actor; if (!A) return null;
  A.anim = null; A.poseFn = null; A.alpha = 1; A.glow = 0; A.stance = stance;
  A.pose = mkPose({}, SETS[A.set][stance] || SETS[A.set].idle);
  return Erk.figur(A, A.x, A.gy, A.face);
}

/* =====================================================================
   STIMME: eingebettete Sprachaufnahmen abspielen
   Tonhöhe, Hall und alle anderen Effekte stecken schon in der Aufnahme
   (siehe stimme.py). Während jemand spricht, wird die Musik leiser.
   ===================================================================== */
const Voice = (() => {
  const cache = {};
  let cur = null, curG = null, done = null, tok = 0;

  const has = id => typeof STIMMEN !== 'undefined' && !!STIMMEN[id];
  const ok = id => S.voice && S.sound && has(id) && !!Snd.ac();
  const whoOf = id => { const p = id.split('.')[0]; return SPRECHER[p] ? p : 'erzaehler'; };

  function decode(id){
    if (cache[id]) return cache[id];
    const bin = atob(STIMMEN[id]), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    cache[id] = new Promise((res, rej) => {
      try {
        // Ältere Safari-Versionen kennen nur die Rückruf-Form
        const p = Snd.ac().decodeAudioData(u.buffer, res, rej);
        if (p && p.then) p.then(res, rej);
      } catch (e) { rej(e); }
    });
    cache[id].catch(() => { delete cache[id]; });
    return cache[id];
  }
  function finish(v){ const f = done; done = null; if (f) f(v); }
  function stop(){
    tok++;
    if (cur){
      // Kurz ausblenden statt hart abzuschneiden, falls noch Hall nachklingt
      const ac = Snd.ac(), t = ac.currentTime;
      try { curG.gain.setTargetAtTime(0, t, .06); cur.onended = null; cur.stop(t + .35); } catch (e) {}
      cur = null; curG = null;
    }
    Music.duck(false);
    finish(false);
  }
  // Spielt eine Zeile ab. Das Versprechen erfüllt sich, wenn sie zu Ende ist oder abgebrochen wird.
  function say(id){
    stop();
    if (!ok(id)) return Promise.resolve(false);
    const my = tok;
    return new Promise(res => {
      done = res;
      decode(id).then(buf => {
        if (my !== tok) return;
        const sp = SPRECHER[whoOf(id)], ac = Snd.ac();
        const src = ac.createBufferSource(), g = ac.createGain();
        src.buffer = buf; g.gain.value = sp.laut;
        src.connect(g); Snd.out(g, 0);
        src.onended = () => { if (cur !== src) return; cur = null; Music.duck(false); finish(true); };
        cur = src; curG = g; Music.duck(true); src.start();
        // Weiter geht es, sobald die Worte gesprochen sind; der Hall klingt dabei aus
        const ende = STIMMEN_ENDE[id];
        if (ende) setTimeout(() => { if (my === tok) finish(true); }, ende * 1000);
      }, () => { if (my === tok) finish(false); });
    });
  }
  // Vorab entpacken, damit die erste Zeile einer Szene ohne Verzögerung kommt
  function warm(ids){ if (!Snd.ac()) return; ids.forEach(id => { if (has(id)) decode(id).catch(() => {}); }); }
  // Wie lange gesprochen wird, in Sekunden (für Untertitel)
  async function length(id){
    if (!ok(id)) return 0;
    if (STIMMEN_ENDE[id]) return STIMMEN_ENDE[id];
    try { return (await decode(id)).duration; } catch (e) { return 0; }
  }
  return { say, stop, warm, has, ok, length, speaking: () => !!cur };
})();

/* =====================================================================
   BÜHNE: die Figuren des Kampfes, mitten in der Welt
   Der Kampf findet dort statt, wo er beginnt. duel.x ist der Platz des
   Helden, duel.dir die Richtung zum Gegner (1 rechts, -1 links).
   ===================================================================== */
const Stage = {
  P: null, E: null, E2: null, N: null, showP: true, showE: false, showN: false, duel: null,
  place(){
    const d = this.duel; if (!d) return;
    const P = this.P;
    if (P){ P.x = d.x; P.gy = d.gy; P.face = d.dir; P.H = HELD_H; }
    [this.E, this.E2].forEach((a, i) => {
      if (!a) return;
      const L = a.look;
      a.H = HELD_H * (L.scale || 1);
      a.baseX = d.x + d.dir * (this.abstand(a) + i * 75);
      a.gy = d.gy; a.face = -d.dir;
      a.x = a.baseX + d.dir * (a.enter || 0) * 260;
    });
  },
  // Abstand zum Gegner, aber nie in eine Wand hinein
  abstand(a){
    let d = 100 + a.H * .8 + (a.look.breit ? a.H * .3 : 0);
    const G = typeof Erk !== 'undefined' && Erk.gebiet(), du = this.duel;
    if (G && du){
      for (let s = T; s <= d + a.H * .35; s += T / 2){
        const x = du.x + du.dir * s;
        if (istFest(G, tileAt(x), tileAt(du.gy - 20)) || istFest(G, tileAt(x), tileAt(du.gy - 60))){ d = Math.max(90, s - a.H * .35 - 6); break; }
      }
    }
    return d;
  },
  hero(herk, waffe, schild){
    const w = WAFFEN[waffe] || WAFFEN.langschwert;
    const look = Object.assign({}, LOOK[herk] || LOOK.kron, { weapon: w.look, off: w.klasse === 'klinge' && schild ? (schild === 'glockenschild' ? 'glockenschild' : 'schild') : null, twoHand: w.klasse === 'speer' ? -.2 : w.klasse === 'wucht' ? .15 : 0 });
    const P = makeActor({ set: KLASSE_SET[w.klasse], look, face: 1, H: HELD_H });
    if (this.P){ P.pose = this.P.pose; P.t = this.P.t; P.x = this.P.x; P.gy = this.P.gy; P.face = this.P.face; P.poseFn = this.P.poseFn; P.bew = this.P.bew; }
    this.P = P; return P;
  },
  // Gegner für den Kampf: am liebsten die Figur, die schon in der Welt stand
  foe(key, actor, slot = 'E'){
    const d = FEINDE[key], L = LOOK[d.look || d.set];
    const a = actor || makeActor({ set: d.set, look: L, face: -1, H: HELD_H * (L.scale || 1) });
    a.set = d.set; a.look = L; a.poseFn = null; a.bew = null; a.stance = null; a.alpha = 1; a.glow = 0; a.torn = false;
    this[slot] = a;
    if (slot === 'E') this.showE = true;
    if (this.duel){
      a.H = HELD_H * (L.scale || 1);
      const base = this.duel.x + this.duel.dir * (this.abstand(a) + (slot === 'E2' ? 75 : 0));
      a.enter = actor ? clamp((actor.x - base) / (this.duel.dir * 260), 0, 3) : 0;
      this.place();
    }
    return a;
  },
  update(dt){
    [this.E, this.E2].forEach(a => {
      if (!a || !a.enter || !this.duel) return;
      a.enter = Math.max(0, a.enter - dt / (a.enterDur || 700));
      a.x = a.baseX + this.duel.dir * EASE.out(Math.min(1, a.enter)) * 260 * Math.max(1, a.enter);
      if (a.enter > 0 && !a.anim){ a.poseFn = bewegungsPose; a.bew = { m: 'lauf', ph: a.t * .012, st: .8 }; }
      else if (a.enter <= 0 && a.poseFn){ a.poseFn = null; a.bew = null; }
    });
  }
};
const KLASSE_SET = { klinge: 'kron', speer: 'harp', wucht: 'moench' };

/* =====================================================================
   KAMPF: Reaktion. Gegner holen sichtbar aus, der Spieler weicht aus,
   blockt oder pariert im richtigen Moment.
   ===================================================================== */
const REGEL = {
  parade: 165, paradePause: 520,
  rolle: { dur: 460, i0: 50, i1: 330, perfekt: 170 },
  puffer: 300,
  stRegen: 50, stRegenBlock: 16, stPause: 560,
  konterFenster: 520, konterMul: 1.6,
  heilSchluck: 360, heilWirkt: 660, heilDauer: 950,
  gapMul: .7
};

const Fight = (() => {
  let on = false, def = null, key = '', T = 0, hitStop = 0, slowUntil = 0, paused = false;
  let pl = null, en = null, W = null, P = null, E = null, onEnd = null, ended = false, f = 1;
  let queue = [], actors = [], idx = 0, glut = 0, dmgScale = 1;
  let hinten = null;   // Gegner aus der zweiten Reihe, der aus der Ferne angreift
  const tells = [], projs = [], eprojs = [];
  let stats = { parries: 0, perfect: 0, hits: 0, taken: 0 };
  const hook = { toast: () => {}, line: () => {}, foe: () => {}, phase: () => {}, besiegt: () => {} };

  /* ---------- Start ----------
     o: { foes: [key, ...], actors: [actor, ...], profil, zustand: { hp, fp, flasks }, onEnd, scale, vorteil } */
  function start(o){
    queue = o.foes.slice(); actors = (o.actors || []).slice(); idx = 0; glut = 0; onEnd = o.onEnd; dmgScale = o.scale || 1;
    const pr = o.profil;
    W = pr.waffe;
    P = Stage.P; f = Stage.duel ? Stage.duel.dir : 1;
    P.stance = null; P.anim = null; P.hideW = false; P.glow = 0; P.poseFn = null; P.bew = null; P.alpha = 1;
    T = 0; hitStop = 0; slowUntil = 0; paused = false; ended = false;
    tells.length = 0; projs.length = 0; eprojs.length = 0;
    const z = o.zustand || {};
    pl = Object.assign({}, pr, {
      act: null, blockHeld: false, heavyHeld: false, blockPress: -1e9, lastParryTry: -1e9, lastSpend: -1e9,
      combo: 0, comboUntil: 0, buf: null, konterBis: 0
    });
    pl.hp = Math.min(pl.hpMax, z.hp == null ? pl.hpMax : z.hp);
    pl.fp = Math.min(pl.fpMax, z.fp == null ? pl.fpMax : z.fp);
    pl.flasks = z.flasks == null ? pl.flasksMax : z.flasks;
    pl.st = pl.stMax;
    stats = { parries: 0, perfect: 0, hits: 0, taken: 0 };
    World.setFlood(0, Stage.duel ? Stage.duel.gy : 0); World.setTint(0); World.setSlow(false);
    on = true;
    setupFoe(false, o.vorteil);
    setupHinten();
    if (o.vorteil === 'hinterhalt') hinterhalt();
  }
  function setupFoe(enter, vorteil){
    key = queue[idx]; def = FEINDE[key];
    E = Stage.foe(key, actors[idx] || null, 'E');
    E.torn = false; E.glow = 0; E.alpha = 1;
    const s = def.boss ? 1 : dmgScale;
    en = {
      hp: Math.round(def.hp * s), hpMax: Math.round(def.hp * s), pz: def.pz, pzMax: def.pz, st: E.enter > 0 ? 'enter' : 'idle', t0: 0,
      next: T + (vorteil === 'bemerkt' ? 700 : def.boss ? 3600 : 1100) + (E.enter > 0 ? E.enter * 700 : 0), until: T + (E.enter > 0 ? E.enter * 700 : 0),
      move: null, hi: 0, told: [], trailed: [], shot: [], phase: 0, lastPz: -1e9, hist: [], moves: def.moves, dmgMul: s * (def.schaden || 1),
      guardAus: 0, offenBis: 0, treffer: 0, trefferT: 0, kind: []
    };
    tells.length = 0; eprojs.length = 0;
    hook.foe(def, idx, queue.length);
  }
  // Der nächste lebende Gegner mit Fernangriffen wartet nicht untätig
  function setupHinten(){
    hinten = null; Stage.E2 = null;
    for (let i = idx + 1; i < queue.length; i++){
      const d = FEINDE[queue[i]];
      if (d.fern){ hinten = { i, key: queue[i], def: d, next: T + rr(...d.fern.gap) + 1200, move: null, hi: 0, shot: [], told: [] }; Stage.foe(queue[i], actors[i] || null, 'E2'); break; }
    }
  }
  function stop(){ on = false; pl && (pl.blockHeld = false); World.setSlow(false); }
  function finish(result){
    if (ended) return;
    ended = true;
    setTimeout(() => {
      on = false;
      onEnd && onEnd(result, { hp: pl.hp, fp: pl.fp, flasks: pl.flasks, stats, glut, boss: def.boss ? key : null, idx });
    }, result === 'win' ? 1700 : 1800);
  }
  function hinterhalt(){
    // Der erste Schlag aus dem Hinterhalt reißt eine tiefe Wunde
    const S = P_SET();
    act('crit', { hit: 300, dur: 800, hinterhalt: true });
    playAnim(P, [[0, S.l3W], [200, S.l3W], [300, S.crit, EASE.in], [500, S.crit], [800, S.idle]]);
    P.trailUntil = P.t + 360;
    en.next = T + 2200;
  }

  /* ---------- Spieler: Aktionen ---------- */
  const P_SET = () => SETS[P.set];
  function spend(c){ pl.st = Math.max(0, pl.st - c); pl.lastSpend = T; }
  function hasSt(c){ if (pl.st >= c * .5 && pl.st > 1) return true; hook.toast('st'); return false; }
  function act(k, o = {}){ pl.act = Object.assign({ k, t0: T, done: false }, o); }

  function startLight(){
    const i = T < pl.comboUntil ? (pl.combo + 1) % W.light.length : 0, L = W.light[i];
    if (!hasSt(L.st)) return true;
    spend(L.st); pl.combo = i; pl.comboUntil = T + L.dur + 260;
    act('light', { hit: L.hit, dur: L.dur, L, konter: T < pl.konterBis });
    const S = P_SET();
    playAnim(P, [[0, S[L.pose + 'W']], [L.hit - 55, S[L.pose + 'W']], [L.hit, S[L.pose + 'S'], EASE.in], [L.hit + 90, S[L.pose + 'S']], [L.dur, S.idle]]);
    P.trailUntil = P.t + L.hit + 60;
    setTimeout(() => Snd.play('swing'), Math.max(0, L.hit - 80));
    return true;
  }
  // Schwerer Angriff: gedrückt ausholen, loslassen schlägt zu. Jede Waffe hat ihr eigenes Mindestausholen.
  function startHeavy(){
    if (!hasSt(W.heavy.st)) return true;
    spend(W.heavy.st);
    act('heavyW');
    playAnim(P, [[0, P_SET().hW]], true);
    return true;
  }
  function releaseHeavy(){
    const a = pl.act; if (!a || a.k !== 'heavyW') return;
    const H = W.heavy, held = T - a.t0, extra = Math.max(0, H.wind - held), charged = held >= H.wind + 420;
    const hit = H.hit + extra, dur = hit + H.dur;
    act('heavyS', { hit, dur, mult: charged ? 1.35 : 1, konter: T < pl.konterBis });
    const S = P_SET();
    playAnim(P, [[0, S.hW], [hit - 70, S.hW], [hit, S.hS, EASE.in], [hit + 140, S.hS], [dur, S.idle]]);
    P.trailUntil = P.t + hit + 80;
    if (charged){ P.glow = 1; World.pop(P.x, P.gy - P.H * 1.15, 'Aufgeladen', '#f4c08a', 13); }
    setTimeout(() => Snd.play('heavySwing'), Math.max(0, hit - 120));
  }
  function startDodge(){
    if (!hasSt(pl.dodgeSt)) return true;
    spend(pl.dodgeSt);
    act('dodge', { dur: REGEL.rolle.dur });
    const S = P_SET();
    playAnim(P, [[0, S.dodge], [280, S.dodge], [REGEL.rolle.dur, S.idle]]);
    Snd.play('dodge');
    World.ghost(P); setTimeout(() => on && World.ghost(P), 70); setTimeout(() => on && World.ghost(P), 150);
    return true;
  }
  function startParry(){
    const S = P_SET();
    if (T - pl.lastParryTry >= REGEL.paradePause){ pl.blockPress = T; pl.lastParryTry = T; }
    act('parry', { dur: 230 });
    playAnim(P, [[0, S.parry], [120, S.parry], [230, pl.blockHeld ? S.block : S.idle]]);
    return true;
  }
  function startHeal(){
    if (pl.flasks <= 0){ hook.toast('flask'); return true; }
    act('heal', { dur: REGEL.heilDauer });
    const S = P_SET();
    playAnim(P, [[0, S.heal], [REGEL.heilDauer - 200, S.heal], [REGEL.heilDauer, S.idle]]);
    // Gegner nutzen den Moment
    if (en.st === 'idle' && en.next - T > 250){ en.next = T + 160; en.strafe = true; }
    return true;
  }
  function startArt(){
    const A = W.art;
    if (pl.fp < A.fp){ hook.toast('fp'); return true; }
    pl.fp -= A.fp;
    const hit = A.hits[0].t;
    act('art', { dur: A.dur, art: A, hitsDone: 0 });
    const S = P_SET();
    Snd.play('art');
    if (A.anim === 'sprung'){
      playAnim(P, [[0, S.artW], [200, S.artW], [380, S.artA, EASE.out], [hit, S.artS, EASE.in], [hit + 160, S.artS], [A.dur, S.idle]]);
    } else if (A.anim === 'wurf'){
      playAnim(P, [[0, S.artW], [200, S.artW], [260, S.artS, EASE.in], [460, S.artS], [A.dur, S.idle]]);
      setTimeout(() => { if (!on) return; P.hideW = true; projs.push({ t0: T, hit: hit - 240, back: 360, look: P.look.weapon }); }, 240);
    } else if (A.anim === 'wirbel'){
      const h2 = A.hits[1].t;
      playAnim(P, [[0, S.l2W], [hit - 60, S.l2W], [hit, S.l2S, EASE.in], [h2 - 70, S.l1W, EASE.io], [h2, S.l1S, EASE.in], [h2 + 120, S.l1S], [A.dur, S.idle]]);
    } else {
      playAnim(P, [[0, S.artW], [300, S.artA], [hit, S.artS, EASE.in], [hit + 220, S.artS], [A.dur, S.idle]]);
    }
    P.trailUntil = P.t + A.hits[A.hits.length - 1].t + 60;
    P.glow = 1;
    return true;
  }
  function startCrit(){
    act('crit', { hit: 380, dur: 820 });
    const S = P_SET();
    playAnim(P, [[0, S.l3W], [260, S.l3W], [380, S.crit, EASE.in], [560, S.crit], [820, S.idle]]);
    P.trailUntil = P.t + 440;
    return true;
  }

  function tryAct(k){
    const a = pl.act, t = a ? T - a.t0 : 0;
    if (pl.hp <= 0 || en.st === 'dead' || en.st === 'enter') return true;
    let free = !a || a.k === 'block';
    if (a && (a.k === 'light' || a.k === 'heavyS' || a.k === 'crit') && t >= a.hit + 70 && k !== 'flask' && k !== 'art') free = true;
    if (a && a.k === 'parry' && k === 'dodge') free = true;
    if (!free) return false;
    switch (k){
      case 'atk': return en.st === 'broken' ? startCrit() : startLight();
      case 'heavy': return startHeavy();
      case 'dodge': return startDodge();
      case 'block': return startParry();
      case 'art': return startArt();
      case 'flask': return startHeal();
    }
    return true;
  }
  function endAct(){
    const a = pl.act;
    pl.act = null;
    if (a && (a.k === 'art' || a.k === 'heavyS')) P.glow = 0;
    if (pl.blockHeld){ act('block'); P.stance = 'block'; } else P.stance = null;
    const b = pl.buf; pl.buf = null;
    if (b && T - b.t < REGEL.puffer) tryAct(b.k);
  }

  /* ---------- Eingaben ---------- */
  function press(k){
    if (!on || paused || ended) return;
    if (k === 'block') pl.blockHeld = true;
    if (k === 'heavy') pl.heavyHeld = true;
    if (!tryAct(k)) pl.buf = { k, t: T };
  }
  function release(k){
    if (!on) return;
    if (k === 'block'){
      pl.blockHeld = false;
      if (pl.act && pl.act.k === 'block'){ pl.act = null; P.stance = null; }
    }
    if (k === 'heavy'){ pl.heavyHeld = false; if (pl.act && pl.act.k === 'heavyW') releaseHeavy(); }
  }

  /* ---------- Spieler: Ablauf pro Bild ---------- */
  function stepPlayer(){
    const a = pl.act; if (!a) return;
    const t = T - a.t0;
    if (a.k === 'heavyW' && (t >= W.heavy.wind + 900 || !pl.heavyHeld)) { releaseHeavy(); return; }
    if (a.hit != null && !a.done && t >= a.hit){ a.done = true; playerHits(a); }
    if (a.k === 'art'){
      const hs = a.art.hits;
      while (a.hitsDone < hs.length && t >= hs[a.hitsDone].t){ artHit(a.art, hs[a.hitsDone], a.hitsDone); a.hitsDone++; }
    }
    if (a.k === 'heal'){
      if (!a.geschluckt && t >= REGEL.heilSchluck){ a.geschluckt = true; pl.flasks--; }
      if (!a.healed && t >= REGEL.heilWirkt){
        a.healed = true; const h = Math.round(pl.hpMax * pl.heal);
        pl.hp = Math.min(pl.hpMax, pl.hp + h);
        Snd.play('heal'); const c = chestPt(P); World.burst(c[0], c[1], 'heal', 18); World.pop(P.x, P.gy - P.H * 1.1, '+' + h, '#cfe3ff', 16);
      }
    }
    if (a.dur && t >= a.dur) endAct();
  }
  function playerHits(a){
    const km = a.konter ? REGEL.konterMul : 1;
    if (a.k === 'light') return hitEnemy(a.L.d * km, a.L.pz * km, { konter: a.konter });
    if (a.k === 'heavyS') return hitEnemy(W.heavy.d * a.mult * km, W.heavy.pz * a.mult * km, { heavy: true, konter: a.konter });
    if (a.k === 'crit'){
      if (a.hinterhalt){
        const frac = def.boss ? .12 : def.elite ? .3 : .55;
        return hitEnemy(Math.max(W.heavy.d * 2, en.hpMax * frac / pl.dmgMul), en.pzMax, { crit: true, heavy: true, hinterhalt: true });
      }
      return hitEnemy(W.heavy.d * 2.4, 0, { crit: true, heavy: true });
    }
  }
  function artHit(A, h, i){
    const c = chestPt(E);
    if (A.ring){
      Snd.play('geleut');
      const g = [P.x + f * P.H * .5, P.gy - P.H * .1], big = A.ring === 'gross';
      World.ring(g[0], g[1], 10, P.H * (big ? 2.4 : 1.6), 'rgba(230,220,190,.9)', big ? 900 : 700, 3);
      World.ring(g[0], g[1], 10, P.H * (big ? 1.7 : 1.1), 'rgba(200,225,255,.7)', 520, 2);
      World.shake(big ? 14 : 8);
      if (big && hinten) hintenTreffer(h.d * .6);
    }
    if (A.heal && i === 0){ pl.hp = Math.min(pl.hpMax, pl.hp + A.heal); World.pop(P.x, P.gy - P.H * 1.1, '+' + A.heal, '#cfe3ff', 16); }
    if (A.anim === 'sprung'){ World.shake(12); World.burst(P.x + f * P.H * .5, P.gy, 'spark', 16); }
    const interrupted = A.interrupt && interrupt();
    hitEnemy(h.d, h.pz, { heavy: true, art: true });
    if (interrupted) World.pop(c[0], c[1] - E.H * .45, 'Unterbrochen', '#f4c08a', 15);
  }
  // Harpune und Haken reißen den Gegner aus dem Ausholen, aber nicht bei roten Angriffen von Bossen
  function interrupt(){
    if (en.st !== 'move') return false;
    const nh = en.move.hits[en.hi];
    if (!nh || nh.t - (T - en.t0) < 140 || en.move.armor || (en.move.hits.some(h => h.k === 'u') && def.boss)) return false;
    en.st = 'flinch'; en.until = T + 850; en.move = null; tells.length = 0; eprojs.length = 0; E.glow = 0;
    const S = SETS[E.set];
    playAnim(E, [[0, S.stagger], [500, S.stagger], [850, S.idle]]);
    return true;
  }
  function hintenTreffer(d){
    if (!hinten || !Stage.E2) return;
    const a = Stage.E2, c = chestPt(a);
    hinten.move = null; hinten.next = T + 1800;
    World.pop(c[0], c[1] - 10, String(Math.round(d)), '#eef1f5', 16);
    World.burst(c[0], c[1], 'spark', 10);
    playAnim(a, [[0, SETS[a.set].hurt], [400, SETS[a.set].idle]]);
  }

  /* ---------- Treffer am Gegner ---------- */
  function hitEnemy(d, pz, o){
    if (en.st === 'dead' || en.st === 'trans' || en.st === 'enter') return;
    const c = chestPt(E);
    const offen = T < en.offenBis || en.st === 'broken' || en.st === 'flinch';
    // Schild: leichte Schläge prallen ab, schwere brechen die Deckung
    if (def.guard && !offen && T >= en.guardAus && (en.st === 'idle' || (en.st === 'move' && T - en.t0 < 250))){
      if (!o.heavy && !o.crit && !o.art){
        d *= 1 - def.guard.block; pz *= .25;
        Snd.play('block'); World.burst(c[0] - f * E.H * .2, c[1], 'spark', 14, f > 0 ? Math.PI : 0); E.shake = 120;
        World.pop(c[0], c[1] - E.H * .4, 'Abgewehrt', '#aab4c2', 13);
        zaehleTreffer();
        const dmg = Math.max(1, Math.round(d * pl.dmgMul));
        en.hp = Math.max(0, en.hp - dmg); en.pz -= pz * pl.pzMul; en.lastPz = T;
        if (en.hp <= 0) return enemyDie();
        return;
      }
      en.guardAus = T + 2600; pz *= 1.4;
      World.pop(c[0], c[1] - E.H * .55, 'Deckung gebrochen', '#f0cd78', 14);
    }
    // Panzer: nur schwere Schläge oder offene Stellen treffen richtig
    let gepanzert = false;
    if (def.panzer && !offen && !o.heavy && !o.crit && !o.art){ d *= 1 - def.panzer; pz *= .5; gepanzert = true; }
    const dmg = Math.max(1, Math.round(d * pl.dmgMul));
    en.hp = Math.max(0, en.hp - dmg);
    en.pz -= pz * pl.pzMul; en.lastPz = T; stats.hits++;
    World.pop(c[0] + (rnd() - .5) * 20, c[1] - 10, String(dmg), o.crit ? '#f4d27a' : gepanzert ? '#9aa6b4' : o.konter ? '#bcd3f5' : '#eef1f5', o.crit ? 26 : o.heavy ? 21 : 18);
    if (o.konter) World.pop(c[0], c[1] - E.H * .55, 'Gegenschlag', '#bcd3f5', 13);
    if (o.hinterhalt) World.pop(c[0], c[1] - E.H * .6, 'Hinterhalt', '#f4d27a', 16);
    World.burst(c[0], c[1], gepanzert ? 'spark' : def.blut || 'drop', o.heavy ? 16 : 9, f > 0 ? 0 : Math.PI);
    Snd.play(gepanzert ? 'block' : o.heavy ? 'hitHeavy' : 'hit');
    hitStop = o.crit ? 140 : o.heavy ? 85 : 55;
    E.shake = 140; World.shake(o.crit ? 16 : o.heavy ? 8 : 4);
    buzz(o.heavy ? 25 : 12);
    if (o.crit){ World.flash('#fff', .35); slowUntil = T + 260; World.burst(c[0], c[1], 'gold', 26); }
    if (en.hp <= 0) return enemyDie();
    if (def.phasen && def.phasen[en.phase] && en.hp <= en.hpMax * def.phasen[en.phase].at) return phaseChange();
    if (o.crit){
      en.st = o.hinterhalt ? 'broken' : 'idle'; if (o.hinterhalt){ en.until = T + 1400; E.stance = 'stagger'; }
      en.pz = o.hinterhalt ? 0 : en.pzMax; en.next = T + 1000; if (!o.hinterhalt) E.stance = null;
      playAnim(E, [[0, SETS[E.set].hurt], [300, SETS[E.set].stagger], [900, o.hinterhalt ? SETS[E.set].stagger : SETS[E.set].idle]]);
      return;
    }
    if (en.pz <= 0 && en.st !== 'broken') return breakPoise();
    zaehleTreffer();
    if (en.st === 'idle' && !def.boss && !def.panzer){
      en.next = Math.max(en.next, T + 260);
      playAnim(E, [[0, SETS[E.set].hurt], [240, SETS[E.set].idle]]);
    }
  }
  // Wer zu oft blind zuschlägt, wird gekontert
  // Ohne eigenen Konter schlägt jeder normale Gegner nach drei Treffern mit seinem schnellsten Angriff zurück
  function zaehleTreffer(){
    const k = def.konter || (def.boss ? null : { nach: 3 });
    if (!k || en.st !== 'idle') return;
    if (T - en.trefferT > 1400) en.treffer = 0;
    en.treffer++; en.trefferT = T;
    if (en.treffer >= k.nach){ en.treffer = 0; en.next = T + 120; en.zwang = k.move || schnellster(); }
  }
  function breakPoise(){
    en.pz = 0; en.move = null; tells.length = 0; eprojs.length = 0; E.glow = en.phase > 0 ? .8 : 0; E.trailUntil = 0;
    Snd.play('hitHeavy'); World.flash('rgba(240,205,120,1)', .12);
    const c = chestPt(E); World.pop(c[0], c[1] - E.H * .5, 'Haltung gebrochen', '#f0cd78', 15);
    E.stance = 'stagger'; playAnim(E, [[0, SETS[E.set].stagger]]);
    en.st = 'broken'; en.until = T + (def.boss ? 2300 : 2500);
  }
  // Neue Phase: jeder Boss hat seinen eigenen Auftritt
  function phaseChange(){
    const ph = def.phasen[en.phase];
    en.phase++; en.st = 'trans'; en.until = T + 2800; en.move = null; tells.length = 0; eprojs.length = 0;
    en.moves = scaleMoves(def.moves, ph.tempo || .9); en.pz = en.pzMax; E.stance = null;
    const S = SETS[E.set], big = S.W_slam ? ['W_slam', 'S_slam'] : ['W_over', 'S_over'];
    playAnim(E, [[0, S.stagger], [700, S.stagger], [1300, S[big[0]], EASE.io], [1600, S[big[1]], EASE.in], [2200, S[big[1]]], [2800, S.idle]]);
    setTimeout(() => {
      if (!on) return;
      E.torn = true; E.glow = 1; World.shake(22);
      const gy = Stage.duel.gy;
      if (ph.fx === 'flut'){ World.setFlood(1.2 + en.phase * .3, gy); World.setTint(1); World.flash('rgba(190,240,236,1)', .25); World.burst(E.x, E.gy, 'drop', 40); Snd.play('wave'); }
      if (ph.fx === 'glocke'){ World.bell(en.phase); World.setFlood(1 + en.phase * .5, gy); World.setTint(1); World.flash('rgba(210,220,255,1)', .3); Snd.bell(65.4, .5, 7, .9); }
      if (ph.fx === 'wut'){ World.flash('rgba(200,60,40,1)', .22); Snd.play('danger'); }
