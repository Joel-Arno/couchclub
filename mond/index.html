<style>/* =====================================================================
   MONDGELÄUT – STIL
   Eine einzige, dunkle Welt: Nacht, Mondsilber, Glut.
   ===================================================================== */
:root {
  color-scheme: dark;
  --night: #0A0D12;
  --deep: #10141B;
  --slate: #19202B;
  --line: rgba(196, 208, 224, .16);
  --line-2: rgba(196, 208, 224, .32);
  --silver: #D8DEE8;
  --mist: #8F9AAB;
  --ember: #E39A55;
  --ember-2: #F4C08A;
  --gold: #E6C36A;
  --blood: #B5463F;
  --blood-2: #E07A6E;
  --tide: #7FA8D8;
  --stam: #93A67E;
  --serif: 'Cormorant Garamond', 'Cormorant', Garamond, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --pad-t: calc(env(safe-area-inset-top, 0px) + 14px);
  --pad-b: calc(env(safe-area-inset-bottom, 0px) + 16px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--silver);
  font: 15px/1.45 var(--sans); overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ember-2); outline-offset: 3px; }
.app { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: var(--night); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: var(--pad-t) 16px var(--pad-b); pointer-events: none;
}
.screen > * { pointer-events: auto; }
.screen[hidden] { display: none; }

/* ---------- Knöpfe ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border-radius: 2px;
  border: 1px solid var(--line-2); background: rgba(16, 20, 27, .72);
  font: 600 18px/1 var(--serif); letter-spacing: .14em; text-transform: uppercase;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn.primary { border-color: rgba(227, 154, 85, .75); background: linear-gradient(rgba(227, 154, 85, .16), rgba(227, 154, 85, .06)); color: #F7E3CC; box-shadow: 0 0 28px rgba(227, 154, 85, .16); }
.btn.ghost { border-color: transparent; background: none; color: var(--mist); }
.btn[disabled] { opacity: .4; }
.link { background: none; border: 0; padding: 6px 0; color: var(--silver); font: 600 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); }

/* ---------- Titel ---------- */
.title { justify-content: flex-end; gap: 22px; background: linear-gradient(to bottom, rgba(10, 13, 18, 0) 18%, rgba(10, 13, 18, .72) 52%, rgba(10, 13, 18, .95) 82%); }
.t-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
.eyebrow { margin: 0; font: 600 11px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--ember); }
.title h1 {
  margin: 0; font: 600 clamp(36px, 10.2vw, 76px)/.95 var(--serif); letter-spacing: .1em; text-transform: uppercase;
  color: var(--silver); text-shadow: 0 0 40px rgba(200, 215, 235, .25); padding-left: .1em;
}
.lede { margin: 0; max-width: 34ch; color: var(--mist); font: 500 18px/1.4 var(--serif); text-wrap: balance; }
.t-actions { display: grid; gap: 8px; width: 100%; max-width: 460px; margin: 0 auto; }
.t-actions .btn { display: grid; gap: 4px; padding: 10px 22px; }
.t-actions .btn small { font: 400 12px var(--sans); letter-spacing: .04em; text-transform: none; color: var(--mist); }
.t-foot { margin: 0; display: flex; justify-content: center; gap: 14px; align-items: baseline; font-size: 12px; color: var(--mist); }

/* ---------- Geschichte und Leuchtfeuer ---------- */
.story { justify-content: flex-end; padding: 0; }
.st-panel {
  display: grid; gap: 12px; max-height: 64%; overflow-y: auto; touch-action: pan-y;
  padding: 56px 20px var(--pad-b);
  background: linear-gradient(to bottom, rgba(10, 13, 18, 0), rgba(10, 13, 18, .9) 64px, rgba(10, 13, 18, .97));
}
.st-panel > * { width: 100%; max-width: 560px; margin-inline: auto; }
.st-place { margin-block: 0; font: 600 11px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--ember); }
.st-text { display: grid; gap: 10px; }
.st-text p { margin: 0; font: 500 20px/1.45 var(--serif); color: var(--silver); opacity: 0; transform: translateY(6px); transition: opacity .9s, transform .9s; }
.st-text p.in { opacity: 1; transform: none; }
.st-text p.note { font: 400 14px/1.5 var(--sans); color: var(--mist); }
.st-choices { display: grid; margin-top: 4px; }
.choice {
  display: grid; grid-template-columns: 10px 1fr; column-gap: 14px; align-items: baseline; text-align: left;
  padding: 13px 2px; background: none; border: 0; border-top: 1px solid var(--line);
  opacity: 0; transition: opacity .6s, background .15s;
}
.choice.in { opacity: 1; }
.choice::before { content: ''; width: 7px; height: 7px; transform: rotate(45deg) translateY(-2px); border: 1px solid var(--ember); }
.choice b { font: 600 19px/1.25 var(--serif); letter-spacing: .02em; }
.choice small { grid-column: 2; font: 400 13px/1.4 var(--sans); color: var(--mist); margin-top: 3px; }
.choice:active { background: rgba(227, 154, 85, .07); }
.choice[disabled] { opacity: .38; }
.choice.main b { color: var(--ember-2); }
.f-stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 2px 22px; margin: 2px 0 0; }
.f-stats.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
.f-stats div { display: grid; gap: 1px; }
.f-stats dt { font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--mist); }
.f-stats dd { margin: 0; font: 600 17px var(--sans); font-variant-numeric: tabular-nums; }
.b-title { margin-block: 0; font: 600 30px/1.1 var(--serif); letter-spacing: .04em; text-wrap: balance; }
.b-ask { margin-block: 0; font: 500 19px/1.4 var(--serif); color: var(--ember-2); }
.b-text { margin-block: 0; font: 500 18px/1.45 var(--serif); color: var(--silver); }

/* ---------- Leiste über dem Ort ---------- */
.o-bar {
  position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: grid; grid-template-columns: 40px 1fr auto 40px; gap: 12px; align-items: center;
  padding: var(--pad-t) 16px 18px; background: linear-gradient(rgba(10, 13, 18, .75), rgba(10, 13, 18, 0));
}
.o-where { margin: 0; min-width: 0; display: grid; font: italic 500 16px/1.2 var(--serif); color: var(--silver); white-space: nowrap; }
.o-where small { font: 600 10.5px/1.5 var(--sans); font-style: normal; letter-spacing: .06em; color: var(--mist); overflow: hidden; text-overflow: ellipsis; }
.intro .o-bar { display: none; }
.st-text p.rede { font-style: italic; color: #E9EEF5; }
.st-text p.gabe { font: 600 13px/1.5 var(--sans); color: var(--ember-2); letter-spacing: .02em; }
.choice.fire b { color: var(--ember-2); }
.choice.fire::before { background: var(--ember); box-shadow: 0 0 10px rgba(227, 154, 85, .7); }
.choice.fight::before { border-color: var(--blood-2); }
.choice.talk::before { border-radius: 50%; transform: translateY(-2px); }

/* ---------- Karte ---------- */
.karte { background: rgba(6, 8, 11, .9); gap: 10px; }
.k-head { display: flex; gap: 10px; align-items: center; }
.k-head, .k-info { width: 100%; max-width: 560px; margin-inline: auto; }
.k-tabs { flex: 1; display: flex; gap: 6px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
.k-tabs button { flex: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px; background: none; font: 600 15px var(--serif); letter-spacing: .08em; color: var(--mist); }
.k-tabs button[aria-selected="true"] { color: var(--silver); border-color: var(--line-2); background: rgba(40, 48, 62, .5); }
.k-map { flex: 1; min-height: 0; position: relative; }
.k-map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.k-map .edge { stroke: rgba(196, 208, 224, .28); stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; }
.k-map .edge.known { stroke: rgba(196, 208, 224, .5); stroke-dasharray: none; }
.k-map .node { cursor: pointer; }
.k-map .node circle.dot { fill: #0e1219; stroke: rgba(196, 208, 224, .55); stroke-width: 1.5; }
.k-map .node.unbekannt circle.dot { stroke-dasharray: 2 3; stroke: rgba(196, 208, 224, .35); }
.k-map .node.feuer circle.dot { fill: #3a2414; stroke: var(--ember); }
.k-map .node.boss circle.dot { stroke: var(--blood-2); }
.k-map .node.boss.besiegt circle.dot { stroke: rgba(196, 208, 224, .55); }
.k-map .node.sel circle.dot { stroke: var(--silver); stroke-width: 2.5; }
.k-map .node text { fill: var(--silver); font: 600 13px var(--serif); letter-spacing: .04em; paint-order: stroke; stroke: rgba(6, 8, 11, .9); stroke-width: 4px; }
.k-map .node.unbekannt text { fill: var(--mist); font-style: italic; }
.k-map .here { fill: none; stroke: var(--silver); stroke-width: 1.2; animation: here 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.k-map .flame { fill: var(--ember-2); }
.k-map .foe { fill: var(--blood-2); }
.k-map .exit text { fill: var(--mist); font: italic 500 13px var(--serif); }
@keyframes here { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.k-info { display: grid; gap: 8px; min-height: 108px; padding: 12px 14px; border: 1px solid var(--line); background: rgba(16, 20, 27, .9); }
.k-info h3 { margin: 0; font: 600 21px/1.1 var(--serif); letter-spacing: .04em; }
.k-info p { margin: 0; font-size: 13.5px; color: var(--mist); }
.k-info .btn { min-height: 44px; }

/* ---------- Überblende beim Reisen ---------- */
.fade { position: absolute; inset: 0; z-index: 28; background: #030405; opacity: 0; pointer-events: none; transition: opacity .35s; }
.fade.on { opacity: 1; pointer-events: auto; }

/* ---------- Kampf ---------- */
.fight { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
.f-top { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; position: relative; z-index: 2; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10, 13, 18, .55); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.foe { display: grid; gap: 5px; padding-top: 2px; min-width: 0; }
.foe-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.foe-name span { font: 600 17px/1.1 var(--serif); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.foe-name small { font: italic 500 14px var(--serif); color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { position: relative; height: 7px; background: rgba(0, 0, 0, .6); border: 1px solid rgba(214, 222, 232, .2); overflow: hidden; }
.bar i { position: absolute; inset: 0; transform-origin: left center; }
.bar .fill { background: linear-gradient(#c65a50, #8e332d); }
.bar .lag { background: rgba(240, 220, 180, .55); }
.bar.f-pz { height: 4px; border-color: rgba(230, 195, 106, .25); }
.bar.f-pz .fill { background: var(--gold); }
.glut { display: grid; justify-items: end; line-height: 1.1; padding-top: 2px; }
.glut small { font: 600 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--mist); }
.glut b { font: 600 17px var(--sans); color: var(--ember-2); font-variant-numeric: tabular-nums; }
.f-line {
  position: absolute; left: 16px; right: 16px; top: calc(var(--pad-t) + 64px); margin: 0 auto; max-width: 480px; z-index: 2;
  text-align: center; font: italic 500 19px/1.35 var(--serif); color: #E9EEF5; text-shadow: 0 1px 12px #000, 0 0 2px #000;
  opacity: 0; transition: opacity .8s; pointer-events: none !important;
}
.f-line.in { opacity: 1; }
.f-touch { position: absolute; left: 0; right: 0; top: calc(var(--pad-t) + 60px); bottom: 42%; z-index: 1; touch-action: none; }
.f-bottom { margin-top: auto; display: grid; gap: 14px; position: relative; z-index: 2; }
.p-bars { display: grid; gap: 4px; width: min(66%, 300px); }
.p-row { display: flex; align-items: center; gap: 8px; }
.p-row .bar { flex: 1; }
.p-hp { height: 9px; }
.p-st .fill { background: linear-gradient(#a9bb93, #6f8160); }
.p-fp .fill { background: linear-gradient(#9dbde6, #5a7fae); }
.p-st, .p-fp { height: 5px; }
.p-num { font: 600 11px var(--sans); color: var(--mist); font-variant-numeric: tabular-nums; min-width: 52px; }
.p-row.warn .bar { border-color: rgba(224, 122, 110, .9); }

/* Reaktion: Daumenknöpfe */
.rtc { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.cl { display: grid; gap: 22px 10px; align-items: end; justify-items: center; }
.cb {
  --s: clamp(58px, 18vw, 76px);
  width: var(--s); height: var(--s); border-radius: 50%; padding: 0; position: relative; display: grid; place-items: center;
  border: 1.5px solid rgba(214, 222, 232, .34); color: var(--silver); touch-action: none;
  background: radial-gradient(circle at 50% 32%, rgba(42, 50, 64, .85), rgba(10, 13, 18, .88));
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45); transition: transform .06s, border-color .12s, opacity .2s;
}
.cb.big { --s: clamp(66px, 21vw, 88px); }
.cb.sm { --s: clamp(46px, 13vw, 56px); }
.cb svg { width: 42%; height: 42%; }
.cb > span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 5px; font: 600 9.5px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); white-space: nowrap; }
.cb.on { transform: scale(.94); border-color: var(--silver); background: radial-gradient(circle at 50% 32%, rgba(70, 82, 102, .95), rgba(20, 25, 33, .95)); }
.cb.off { opacity: .4; }
.cb .cnt { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--ember); color: #1d1208; font: 700 11px/20px var(--sans); font-style: normal; text-align: center; }
.cb.crit { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 4px rgba(230, 195, 106, .2), 0 0 26px rgba(230, 195, 106, .5); animation: pulse .7s ease-in-out infinite alternate; }
.cb.nope { animation: nope .3s; }
@keyframes pulse { to { box-shadow: 0 0 0 8px rgba(230, 195, 106, .08), 0 0 34px rgba(230, 195, 106, .7); } }
@keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* ---------- Großer Schriftzug ---------- */
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; }
.banner[hidden] { display: none; }
.banner.fire { align-items: start; padding-top: calc(var(--pad-t) + 12vh); }
.band {
  width: 100%; padding: 30px 16px 26px; display: grid; justify-items: center; gap: 8px; text-align: center;
  background: linear-gradient(to right, transparent, rgba(0, 0, 0, .82) 18%, rgba(0, 0, 0, .82) 82%, transparent);
  opacity: 0; transition: opacity 1.4s;
}
.banner.in .band { opacity: 1; }
.band b { font: 600 clamp(34px, 11vw, 70px)/1 var(--serif); letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; transform: scale(1.06); transition: transform 3.5s ease-out; }
.banner.in .band b { transform: scale(1); }
.band small { font: italic 500 17px var(--serif); color: var(--mist); }
.banner.dead b { color: #C0453B; text-shadow: 0 0 30px rgba(192, 69, 59, .35); }
.banner.win b { color: var(--gold); text-shadow: 0 0 30px rgba(230, 195, 106, .35); }
.banner.fire b { color: var(--ember-2); font-size: clamp(24px, 7.5vw, 44px); text-shadow: 0 0 30px rgba(227, 154, 85, .4); }
.banner.boss b { color: var(--silver); font-size: clamp(28px, 9vw, 54px); }
.banner.region { align-items: start; padding-top: calc(var(--pad-t) + 10vh); }
.banner.region b { color: var(--silver); font-size: clamp(26px, 8vw, 48px); text-shadow: 0 0 30px rgba(200, 215, 235, .3); }

/* ---------- Blatt (Menüs) ---------- */
.sheet-back { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(4, 5, 8, .62); }
.sheet-back[hidden] { display: none; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; touch-action: pan-y;
  padding: 22px 20px var(--pad-b); display: grid; gap: 12px;
  background: var(--deep); border-top: 1px solid var(--line-2);
}
.sheet h3 { margin: 0; font: 600 24px/1.15 var(--serif); letter-spacing: .06em; }
.sheet p { margin: 0; color: var(--mist); font-size: 14px; }
.sheet .rules { display: grid; gap: 10px; margin: 2px 0 4px; padding: 0; list-style: none; }
.sheet .rules li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14px; line-height: 1.45; color: var(--silver); }
.sheet .rules li i { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 50%; font: 600 11px var(--sans); font-style: normal; color: var(--mist); }
.sheet .keys { font-size: 12px; color: var(--mist); }
.sheet .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.sheet .row b { font: 600 17px var(--serif); letter-spacing: .03em; }
.sheet .row small { display: block; color: var(--mist); font-size: 12.5px; margin-top: 2px; }
.sheet .row .val { font: 600 13px var(--sans); color: var(--ember-2); }
.sheet .row[disabled] { opacity: .4; }
.sheet .btn { width: 100%; }
.sheet .sec { margin: 8px 0 -4px; font: 600 10.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ember); }
.sheet .row.on b { color: var(--ember-2); }
.sheet .row .val small { display: inline; margin: 0; color: var(--mist); }
.sheet .row .buy { font: 600 12px var(--sans); color: var(--ember-2); text-align: right; }
.sheet .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; margin: 0; }
.sheet .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.sheet .stats div { display: grid; gap: 1px; min-width: 0; }
.sheet .stats dt { font: 600 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mist); }
.sheet .stats dd { margin: 0; font: 600 16px var(--sans); font-variant-numeric: tabular-nums; }
.sheet .note { font-size: 12.5px; color: var(--mist); }

.toast {
  position: absolute; left: 50%; top: calc(var(--pad-t) + 70px); transform: translateX(-50%); z-index: 25;
  padding: 8px 14px; background: rgba(10, 13, 18, .9); border: 1px solid var(--line-2); border-radius: 2px;
  font: 600 13px var(--sans); white-space: nowrap; pointer-events: none;
}
.toast[hidden] { display: none; }

@media (min-height: 760px) { .st-text p { font-size: 21px; } }
@media (max-height: 640px) {
  .title h1 { font-size: 40px; }
  .lede { display: none; }
  .cb { --s: 56px; } .cb.big { --s: 64px; } .cb.sm { --s: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .st-text p, .choice, .band, .band b { transition: none; }
  .cb.crit { animation: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- ===================== TITEL ===================== -->
  <section class="screen title" id="title">
    <div class="t-head">
      <p class="eyebrow">Akt I · Die Ertränkte Braut</p>
      <h1>Mondgeläut</h1>
      <p class="lede">Die Flut hat dich ausgespuckt. Irgendwo läutet eine Glocke, die nur du hörst.</p>
    </div>
    <div class="t-actions" id="tActions"></div>
    <p class="t-foot"><button type="button" class="link" id="btnSound">Ton: an</button><button type="button" class="link" id="btnVoice" hidden>Stimme: an</button><button type="button" class="link" id="btnLeave" hidden>Zum Couchclub</button><span id="tHint">Mit Kopfhörern am schönsten</span></p>
  </section>

  <!-- ===================== ORT, LEUCHTFEUER, GESPRÄCH ===================== -->
  <section class="screen story" id="ort" hidden>
    <div class="o-bar">
      <button type="button" class="icon-btn" id="btnKarte" aria-label="Karte">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l5-2 6 2 5-2v13l-5 2-6-2-5 2zM9 4.5v13M15 6.5v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <p class="o-where" id="oWhere"></p>
      <div class="glut" aria-label="Glut"><small>Glut</small><b id="oGlut">0</b></div>
      <button type="button" class="icon-btn" id="btnMenue" aria-label="Ausrüstung und Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="st-panel" id="stPanel">
      <p class="st-place" id="stPlace"></p>
      <div class="st-text" id="stText" aria-live="polite"></div>
      <dl class="f-stats" id="stStats" hidden></dl>
      <div class="st-choices" id="stChoices"></div>
    </div>
  </section>

  <!-- ===================== KARTE ===================== -->
  <section class="screen karte" id="karte" hidden>
    <div class="k-head">
      <div class="k-tabs" id="kTabs" role="tablist" aria-label="Gebiete"></div>
      <button type="button" class="icon-btn" id="btnKarteZu" aria-label="Karte schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="k-map" id="kMap"></div>
    <div class="k-info" id="kInfo"></div>
  </section>

  <!-- ===================== KAMPF ===================== -->
  <section class="screen fight" id="fight" hidden>
    <div class="f-top">
      <button type="button" class="icon-btn" id="btnPause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="foe">
        <div class="foe-name"><span id="foeName"></span><small id="foeTitle"></small></div>
        <div class="bar f-hp"><i class="lag" id="foeLag"></i><i class="fill" id="foeHp"></i></div>
        <div class="bar f-pz" aria-label="Haltung"><i class="fill" id="foePz"></i></div>
      </div>
      <div class="glut" aria-label="Glut"><small>Glut</small><b id="glutN">0</b></div>
    </div>
    <p class="f-line" id="fLine" hidden></p>
    <div class="f-touch" id="fTouch"></div>

    <div class="f-bottom">
      <div class="p-bars">
        <div class="p-row"><div class="bar p-hp"><i class="lag" id="pLag"></i><i class="fill" id="pHp"></i></div><span class="p-num" id="pHpN"></span></div>
        <div class="p-row" id="pStRow"><div class="bar p-st"><i class="fill" id="pSt"></i></div></div>
        <div class="p-row"><div class="bar p-fp"><i class="fill" id="pFp"></i></div></div>
      </div>

      <div class="rtc" id="rtc">
        <div class="cl left">
          <button type="button" class="cb sm" data-k="flask" style="grid-area:1/2" aria-label="Phiole trinken">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5M10.3 3v5.2L6.4 15.5a3.4 3.4 0 0 0 3 5h5.2a3.4 3.4 0 0 0 3-5l-3.9-7.3V3M8 15h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <em class="cnt" id="flaskN">3</em><span>Phiole</span>
          </button>
          <button type="button" class="cb big" data-k="dodge" style="grid-area:2/1" aria-label="Ausweichen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6l-6 6 6 6M19 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Ausweichen</span>
          </button>
          <button type="button" class="cb" data-k="block" style="grid-area:2/2" aria-label="Blocken, kurz vor dem Treffer: Parade">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.2c0 4.6-3.2 7.9-7 9.8-3.8-1.9-7-5.2-7-9.8V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>Blocken</span>
          </button>
        </div>
        <div class="cl right">
          <button type="button" class="cb sm" data-k="art" style="grid-area:1/1" aria-label="Waffenkunst">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M17.7 6.3l-2.5 2.5M8.8 15.2l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span id="artLbl">Kunst</span>
          </button>
          <button type="button" class="cb" data-k="heavy" style="grid-area:2/1" aria-label="Schwerer Angriff, halten lädt auf">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l3-3M6 14l4 4M9 15L19.5 4.5 20 4l-.5.5M9 15l1.8-4.2L20 4l-7 9.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Schwer</span>
          </button>
          <button type="button" class="cb big" data-k="atk" style="grid-area:2/2" aria-label="Angriff">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l3.2-3.2M6.8 13.8l3.4 3.4M9.3 14.7L19 5V4h-1L8.3 13.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="atkLbl">Angriff</span>
          </button>
        </div>
      </div>
    </div>
  </section>

<script>(function(){

/* ---------- Im Couchclub eingebettet ----------

/* =====================================================================

const Snd = (() => {
  let ac = null, master = null, send = null, noiseBuf = null;

  function init(){
    try {
      if (!ac){
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        ac = new C();
        master = ac.createGain(); master.gain.value = S.sound ? 1 : 0;
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .004; comp.release.value = .2;
        master.connect(comp); comp.connect(ac.destination);
        const verb = ac.createConvolver(); verb.buffer = impulse(3.4, 2.3);
        send = ac.createGain(); send.connect(verb);
        const wet = ac.createGain(); wet.gain.value = .34; verb.connect(wet); wet.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function impulse(sec, decay){
    const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  }
  function setOn(on){ if (master) master.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, .05); }
  // Anschluss an den Ausgang, mit Anteil im Hall
  function out(node, wet = .2){
    node.connect(master);
    if (wet > 0){ const g = ac.createGain(); g.gain.value = wet; node.connect(g); g.connect(send); }
  }
  function env(g, t, a, peak, d){
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  }
  function tone(type, f, t, a, d, vol, wet = .15, f2 = 0){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    env(g, t, a, vol, d); o.connect(g); out(g, wet);
    o.start(t); o.stop(t + a + d + .05);
  }
  function noise(t, dur, type, f, q, vol, wet = .1, f2 = 0, a = .004){
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + dur);
    env(g, t, a, vol, dur); s.connect(fl); fl.connect(g); out(g, wet);
    s.start(t, rnd() * 1.5); s.stop(t + a + dur + .05);
  }
  // Glocke: unharmonische Teiltöne wie bei einer gegossenen Glocke
  const BELL = [[.5, 1, 1.15], [1, .9, .9], [1.19, .5, .62], [1.5, .34, .5], [2, .42, .45], [2.51, .2, .3], [2.66, .17, .28], [3.01, .14, .22], [4.1, .07, .14]];
  function bell(f, vol = .2, dur = 3, wet = .5, t){
    if (!ac) return;
    if (t == null) t = ac.currentTime;
    for (const [r, v, dk] of BELL) tone('sine', f * r * (1 + (rnd() - .5) * .003), t, .003, dur * dk, vol * v * .5, wet);
  }
  const now = () => ac.currentTime;

  const P = {
    ui(){ tone('triangle', 740, now(), .003, .07, .05, .08); },
    choice(){ bell(1318, .045, 1.4, .5); },
    swing(){ const t = now(); noise(t, .13, 'bandpass', 700, 1.1, .2, .05, 2600); },
    heavySwing(){ const t = now(); noise(t, .26, 'bandpass', 420, 1, .28, .08, 1800, .03); tone('sine', 95, t, .02, .22, .08, 0, 60); },
    hit(){ const t = now(); tone('sine', 160, t, .002, .16, .42, .06, 52); noise(t, .09, 'lowpass', 2400, .7, .3, .08); },
    hitHeavy(){ const t = now(); tone('sine', 130, t, .002, .28, .55, .1, 40); noise(t, .16, 'lowpass', 1600, .7, .4, .12); noise(t + .01, .05, 'highpass', 3000, .7, .08, .05); },
    hurt(){ const t = now(); tone('sine', 120, t, .002, .3, .5, .06, 38); noise(t, .22, 'lowpass', 900, .8, .36, .08); tone('sawtooth', 70, t, .01, .16, .05, 0, 50); },
    block(){ const t = now(); noise(t, .12, 'bandpass', 2600, 6, .32, .15); [1250, 1830, 2710].forEach((f, i) => tone('triangle', f, t, .001, .16 - i * .03, .05, .2)); tone('sine', 140, t, .002, .1, .2, 0, 70); },
    parry(){ const t = now(); bell(740, .24, 2.6, .6); noise(t, .08, 'highpass', 3200, .7, .16, .2); tone('sine', 1480, t, .002, .5, .05, .5); },
    dodge(){ const t = now(); noise(t, .17, 'bandpass', 650, 1.2, .16, .04, 260); noise(t + .08, .05, 'highpass', 4200, .8, .05, 0); },
    perfect(){ bell(1480, .07, 1.3, .7); const t = now(); noise(t, .35, 'bandpass', 3000, 3, .05, .6, 800, .15); },
    heal(){ const t = now(); [523, 659, 784, 1046].forEach((f, i) => tone('sine', f, t + i * .06, .02, .55, .06, .6)); },
    glut(){ const t = now(); for (let i = 0; i < 7; i++) noise(t + rnd() * .35, .02, 'bandpass', 2600 + rnd() * 1800, 2, .06, .1); tone('triangle', 220, t, .12, .5, .05, .3, 330); },
    tell(){ tone('sine', 2350, now(), .002, .12, .035, .3); },
    danger(){ const t = now(); tone('sawtooth', 190, t, .02, .34, .07, .2, 120); noise(t, .3, 'bandpass', 300, 4, .08, .2); },
    art(){ const t = now(); noise(t, .4, 'bandpass', 900, 2, .15, .3, 3000, .08); tone('sine', 330, t, .05, .5, .08, .5, 660); },
    geleut(){ bell(392, .3, 3.5, .7); bell(587, .12, 2.5, .7); },
    enemyDie(){ const t = now(); noise(t, .9, 'lowpass', 900, .7, .26, .3, 160, .02); tone('sine', 82, t, .01, .7, .2, .2, 38); },
    bossDie(){ bell(98, .38, 7, .85); bell(146.8, .2, 6, .85); const t = now(); noise(t, 2.6, 'lowpass', 300, .7, .3, .6, 1200, .5); },
    death(){ const t = now(); tone('sine', 55, t, .6, 3, .26, .4); noise(t, 2.6, 'lowpass', 420, .8, .26, .5, 110, .7); bell(73.4, .28, 7, .9, t + .2); },
    phase(){ bell(87.3, .42, 6, .85); const t = now(); tone('sine', 62, t, .01, 1.3, .5, .2, 28); noise(t, 2.2, 'lowpass', 280, .8, .32, .5, 900, .9); },
    wave(){ const t = now(); noise(t, 1.1, 'lowpass', 180, .8, .34, .4, 1300, .55); },
    chain(){ const t = now(); for (let i = 0; i < 6; i++) tone('square', 1700 + rnd() * 700, t + i * .045, .001, .03, .025, .1); },
    heart(){ const t = now(); bell(98, .11, 2.4, .6, t); bell(98, .075, 2, .6, t + .3); },
    fire(){ const t = now(); noise(t, 1.4, 'bandpass', 420, .8, .16, .3, 900, .35); bell(392, .1, 3, .7, t + .15); },
    rise(){ const t = now(); noise(t, 1.4, 'lowpass', 200, .7, .12, .4, 700, .6); },
    lure(){ tone('sine', 196, now(), .3, 1.4, .05, .7, 147); }
  };
  function play(name, ...args){
    if (!ac || !S.sound || !P[name]) return;
    try { P[name](...args); } catch (e) {}
  }
  return { init, play, setOn, bell, tone, noise, out, env, ac: () => ac, master: () => master, send: () => send, noiseBuf: () => noiseBuf };
})();

/* =====================================================================
   MUSIK: Strand, Kampf und Bosskampf, ebenfalls erzeugt
   ===================================================================== */
const Music = (() => {
  let mode = null, bus = null, timer = null, nextT = 0, step = 0, held = [], level = 0, duckG = null, ducked = false;
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  // d-Moll, B-Dur, g-Moll, A-Dur
  const CHORDS = [[50, 53, 57], [46, 50, 53], [43, 46, 50], [45, 49, 52]];

  function stepDur(){
    if (mode === 'amb') return .5;
    if (mode === 'kampf') return 60 / 86 / 2;
    return 60 / (level ? 94 : 76) / 2;
  }
  function stop(fade = 1.4){
    clearInterval(timer); timer = null;
    const ac = Snd.ac();
    if (ac && bus){
      const b = bus, h = held;
      b.gain.cancelScheduledValues(ac.currentTime);
      b.gain.setTargetAtTime(.0001, ac.currentTime, fade / 4);
      setTimeout(() => { h.forEach(n => { try { n.stop(); } catch (e) {} }); try { b.disconnect(); } catch (e) {} }, fade * 1000 + 300);
    }
    bus = null; held = []; mode = null;
  }
  function play(m){
    if (mode === m && bus) return;
    stop();
    mode = m; level = 0;
    const ac = Snd.ac();
    if (!ac || !m) return;
    bus = ac.createGain(); bus.gain.value = .0001;
    bus.gain.exponentialRampToValueAtTime(m === 'amb' ? .8 : .7, ac.currentTime + 2.5);
    bus.connect(duckNode());
    if (m === 'amb') { sea(.16); drone([38, 45], .045, 380); }
    if (m === 'kampf') { sea(.08); drone([38, 50], .05, 260); }
    if (m === 'boss') { sea(.06); drone([26, 38], .1, 190); }
    nextT = ac.currentTime + .15; step = 0;
    timer = setInterval(tick, 80); tick();
  }
  // Leiser, solange jemand spricht. Eigener Knoten, damit Ein- und Ausblenden der Musik unberührt bleiben.
  function duckNode(){
    if (!duckG){
      const ac = Snd.ac();
      duckG = ac.createGain(); duckG.gain.value = ducked ? .28 : 1; duckG.connect(Snd.master());
      const s = ac.createGain(); s.gain.value = .35; duckG.connect(s); s.connect(Snd.send());
    }
    return duckG;
  }
  function duck(on){
    ducked = on;
    const ac = Snd.ac(); if (!ac) return;
    const g = duckNode().gain;
    g.cancelScheduledValues(ac.currentTime);
    g.setTargetAtTime(on ? .28 : 1, ac.currentTime, on ? .12 : .7);
  }
  function setLevel(l){
    level = l;
    if (l && bus){ const ac = Snd.ac(); drone([50, 57], .035, 900); Snd.play('phase'); bus.gain.setTargetAtTime(.8, ac.currentTime, 1); }
  }
  // Meeresrauschen mit langsamen Wellen
  function sea(vol){
    const ac = Snd.ac(), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    const lfo = ac.createOscillator(), lg = ac.createGain();
    s.buffer = Snd.noiseBuf(); s.loop = true; f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = .4;
    g.gain.value = vol * .6; lfo.frequency.value = .085; lg.gain.value = vol * .5;
    lfo.connect(lg); lg.connect(g.gain);
    s.connect(f); f.connect(g); g.connect(bus);
    s.start(); lfo.start(); held.push(s, lfo);
  }
  function drone(notes, vol, cut){
    const ac = Snd.ac(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = 1.2;
    lfo.frequency.value = .06; lg.gain.value = cut * .35; lfo.connect(lg); lg.connect(f.frequency);
    g.gain.value = vol; f.connect(g); g.connect(bus);
    notes.forEach((n, i) => {
      [-4, 4].forEach(det => {
        const o = ac.createOscillator(); o.type = i ? 'triangle' : 'sawtooth';
        o.frequency.value = hz(n); o.detune.value = det; o.connect(f); o.start(); held.push(o);
      });
    });
    lfo.start(); held.push(lfo);
  }
  function tick(){
    const ac = Snd.ac();
    if (!ac || !bus) return;
    while (nextT < ac.currentTime + .3){ sched(step, nextT); nextT += stepDur(); step++; }
  }
  function timp(t, vol){
    const ac = Snd.ac(), o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(82, t); o.frequency.exponentialRampToValueAtTime(40, t + .5);
    Snd.env(g, t, .004, vol, .6); o.connect(g); g.connect(bus); o.start(t); o.stop(t + .7);
  }
  function pad(t, chord, len, vol){
    const ac = Snd.ac(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = .6;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + len * .35);
    g.gain.exponentialRampToValueAtTime(.0001, t + len + .4);
    f.connect(g); g.connect(bus);
    chord.forEach(n => [-7, 6].forEach(det => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + len + .5);
    }));
  }
  function pluck(t, n, vol){
    const ac = Snd.ac(), o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz(n); f.type = 'bandpass'; f.frequency.value = hz(n) * 2; f.Q.value = 2;
    Snd.env(g, t, .004, vol, .16); o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + .25);
  }
  function sched(i, t){
    if (!S.sound) return;
    if (mode === 'amb'){
      if (i % 14 === 0) { Snd.bell(98, .07, 2.4, .7, t); Snd.bell(98, .05, 2, .7, t + .3); }
      if (i % 29 === 11) Snd.bell(hz(pickNote([74, 77, 81, 69])), .018, 3.5, .9, t);
      return;
    }
    if (mode === 'kampf'){
      const b = i % 16;
      if (b === 0 || b === 6 || b === 8) timp(t, b === 0 ? .32 : .2);
      if (b === 12) Snd.bell(146.8, .03, 1.8, .6, t);
      if (i % 64 === 32) Snd.bell(293.7, .04, 3, .8, t);
      return;
    }
    // Boss
    const bar = Math.floor(i / 8), b = i % 8, ch = CHORDS[bar % 4];
    if (b === 0) { pad(t, ch, stepDur() * 8, level ? .05 : .04); Snd.bell(hz(ch[0] + 24), .05, 3, .7, t); }
    if (b === 0 || b === 3 || b === 4) timp(t, b === 0 ? .42 : .26);
    if (level){
      if (b === 6 || b === 7) timp(t, .22);
      pluck(t, ch[i % 3] + 12, .05);
      if (b === 4) Snd.bell(hz(ch[1] + 24), .03, 2, .7, t);
    }
  }
  const pickNote = a => a[Math.floor(rnd() * a.length)];
  return { play, stop, setLevel, duck, mode: () => mode };
})();

/* ---------- Abläufe ---------- */
// Spur: [[Zeit in ms, Pose, Kurve], ...]
function sampleTrack(tr, t){
  if (t <= tr[0][0]) return tr[0][1];
  for (let i = 1; i < tr.length; i++){
    const [t1, p1, e] = tr[i];
    if (t <= t1){
      const [t0, p0] = tr[i - 1];
      return mixPose(p0, p1, (e || EASE.io)(t1 > t0 ? (t - t0) / (t1 - t0) : 1));
    }
  }
  return tr[tr.length - 1][1];
}
function makeActor(o){
  return Object.assign({
    x: 0, gy: 0, H: 100, face: 1, set: 'kron', look: LOOK.kron,
    pose: mkPose({}), anim: null, animT: 0, stance: null, t: rnd() * 5000,
    trail: [], trailUntil: 0, alpha: 1, glow: 0, hideW: false, sink: 0, shake: 0, sk: null
  }, o);
}
function playAnim(a, track, hold = false){ a.anim = track; a.animT = 0; a.hold = hold; }
function actorIdle(a){
  const P = SETS[a.set], base = (a.stance && P[a.stance]) || P.idle, t = a.t;
  if (a.stance === 'dead' || a.stance === 'lie' || a.stance === 'kneel') return base;
  const br = Math.sin(t * .0022), tw = a.set === 'ertrunken' ? Math.sin(t * .013) * Math.sin(t * .0031) * .05 : 0;
  return mkPose({ lean: base.lean + br * .02 + tw, head: base.head - br * .03 + tw, a2: base.a2 + br * .04, b2: base.b2 + br * .03, w: base.w + br * .02 }, base);
}
function updateActor(a, dt){
  a.t += dt;
  let target;
  if (a.anim){
    a.animT += dt;
    target = sampleTrack(a.anim, a.animT);
    if (a.animT >= a.anim[a.anim.length - 1][0] && !a.hold) a.anim = null;
  }
  if (!target) target = actorIdle(a);
  a.pose = mixPose(a.pose, target, 1 - Math.exp(-dt * .032));
  if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
}

/* ---------- Skelett ---------- */
function skeleton(p, H, L){
  const legA = BONE.th * Math.cos(p.f1) + BONE.sh * Math.cos(p.f1 + p.f2);
  const legB = BONE.th * Math.cos(p.k1) + BONE.sh * Math.cos(p.k1 + p.k2);
  const hip = [p.x * H, (-Math.max(legA, legB) + p.y) * H];
  const up = [Math.sin(p.lean), -Math.cos(p.lean)];
  const sho = [hip[0] + up[0] * BONE.torso * H, hip[1] + up[1] * BONE.torso * H];
  const hd = p.lean + p.head;
  const head = [sho[0] + Math.sin(hd) * (BONE.neck + BONE.head) * H, sho[1] - Math.cos(hd) * (BONE.neck + BONE.head) * H];
  const limb = (o, a1, a2, l1, l2) => {
    const d1 = dirv(a1), m = [o[0] + d1[0] * l1 * H, o[1] + d1[1] * l1 * H], d2 = dirv(a1 + a2);
    return [m, [m[0] + d2[0] * l2 * H, m[1] + d2[1] * l2 * H]];
  };
  const [kneeF, footF] = limb(hip, p.f1, p.f2, BONE.th, BONE.sh);
  const [kneeB, footB] = limb(hip, p.k1, p.k2, BONE.th, BONE.sh);
  const [elbA, handA] = limb(sho, p.a1 - p.lean, p.a2, BONE.ua, BONE.fa);
  let [elbB, handB] = limb(sho, p.b1 - p.lean, p.b2, BONE.ua, BONE.fa);
  const wAng = p.a1 - p.lean + p.a2 + p.w;
  if (L.twoHand){
    // Zweite Hand greift den Schaft
    const d = dirv(wAng), tgt = [handA[0] + d[0] * L.twoHand * H, handA[1] + d[1] * L.twoHand * H];
    [elbB, handB] = ik(sho, tgt, BONE.ua * H, BONE.fa * H);
  }
  return { hip, sho, head, hd, kneeF, footF, kneeB, footB, elbA, handA, elbB, handB, wAng, up };
}
function ik(o, t, l1, l2){
  const dx = t[0] - o[0], dy = t[1] - o[1];
  const d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + .01, l1 + l2 - .01);
  const a = Math.atan2(dy, dx), c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
  const ang = a + Math.acos(clamp(c, -1, 1));
  return [[o[0] + Math.cos(ang) * l1, o[1] + Math.sin(ang) * l1], [o[0] + Math.cos(a) * d, o[1] + Math.sin(a) * d]];
}
// Punkt aus dem Figurenraum in Weltkoordinaten
function toWorld(a, pt){
  const r = a.pose.rot, c = Math.cos(r), s = Math.sin(r);
  return [a.x + a.face * (pt[0] * c - pt[1] * s), a.gy + a.sink + pt[0] * s + pt[1] * c];
}
function weaponTip(a){
  const sk = a.sk; if (!sk) return [a.x, a.gy - a.H * .6];
  if (a.look.kind) return toWorld(a, sk.tip);
  const d = dirv(sk.wAng), len = WLEN[a.look.weapon] || .45, H = a.H;
  let tip = [sk.handA[0] + d[0] * len * H, sk.handA[1] + d[1] * len * H];
  if (KETTE[a.look.weapon]) tip = flailBall(a, sk, H);
  return toWorld(a, tip);
}
const WLEN = { schwert: .47, harpune: .64, hammer: .48, entermesser: .33, flegel: .5, haken: .66, pfahlspeer: .6, nadel: .42, kolben: .4, stab: .62, glockenstab: .5, kettenglocke: .55 };
// Waffen mit Kette: Länge der Kette und Größe des Endes (Anteile von H)
const KETTE = { flegel: { len: .3, r: .05 }, kettenglocke: { len: .36, r: .11 } };
function chestPt(a){ const sk = a.sk; if (!sk) return [a.x, a.gy - a.H * .6]; if (sk.chest) return toWorld(a, sk.chest); return toWorld(a, [lerp(sk.hip[0], sk.sho[0], .65), lerp(sk.hip[1], sk.sho[1], .65)]); }
function headPt(a){ const sk = a.sk; if (!sk) return [a.x, a.gy - a.H]; return toWorld(a, sk.head); }

/* ---------- Zeichnen ---------- */
const INK = '#040507', INK2 = '#0d1117', RIM = 'rgba(176,196,214,.5)';
function seg(ctx, p, q, w){ ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }

function drawActor(ctx, a, alpha = 1){
  const L = a.look, H = a.H, p = a.pose;
  if (L.kind) return drawWesen(ctx, a, alpha);
  const sk = skeleton(p, H, L);
  a.sk = sk;
  const jit = a.shake > 0 ? (rnd() - .5) * H * .025 : 0;
  ctx.save();
  ctx.globalAlpha = alpha * a.alpha;
  // Schatten am Boden
  if (!a.sink){
    const sx = a.x + a.face * (sk.hip[0]) * Math.cos(p.rot);
    const g = ctx.createRadialGradient(sx, a.gy, 1, sx, a.gy, H * .32);
    g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, a.gy + 2, H * .32, H * .05, 0, 0, TAU); ctx.fill();
  }
  // Lichtkante, dann die Figur selbst
  ctx.save(); ctx.translate(a.x + 1.4 + jit, a.gy + a.sink - 1.1); ctx.scale(a.face, 1); ctx.rotate(p.rot);
  paintFigure(ctx, a, sk, RIM, RIM, H); ctx.restore();
  ctx.save(); ctx.translate(a.x + jit, a.gy + a.sink); ctx.scale(a.face, 1); ctx.rotate(p.rot);
  paintFigure(ctx, a, sk, INK, INK2, H);
  ctx.globalCompositeOperation = 'lighter';
  paintGlow(ctx, a, sk, H);
  ctx.restore();
  ctx.restore();
  // Leuchtspur beim Schlag merken
  if (a.trailUntil > a.t && !a.hideW){
    const d = dirv(sk.wAng), len = (WLEN[L.weapon] || .45) * H, h = sk.handA;
    const tip = KETTE[L.weapon] ? flailBall(a, sk, H) : [h[0] + d[0] * len, h[1] + d[1] * len];
    a.trail.push({ tip, mid: [lerp(h[0], tip[0], .45), lerp(h[1], tip[1], .45)], t: a.t });
  }
}

function paintFigure(ctx, a, sk, col, colB, H){
  const L = a.look, p = a.pose, lw = H * (L.limb || 1), bulk = L.bulk || 1;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (L.cape || L.coat) cape(ctx, a, sk, H, colB);
  if (L.scarf) scarf(ctx, a, sk, H, colB);
  // hinteres Bein
  ctx.strokeStyle = colB;
  seg(ctx, sk.hip, sk.kneeB, lw * .078); seg(ctx, sk.kneeB, sk.footB, lw * .062);
  seg(ctx, sk.footB, [sk.footB[0] + H * .05, sk.footB[1]], lw * .05);
  // hinterer Arm
  seg(ctx, sk.sho, sk.elbB, lw * .056); seg(ctx, sk.elbB, sk.handB, lw * .046);
  if (L.chains) chains(ctx, a, sk, H, colB);

    const c = [lerp(sk.hip[0], sk.sho[0], .72) + .015 * H, lerp(sk.hip[1], sk.sho[1], .72)];
    dot(c[0], c[1], H * (.05 + beat * .03 + a.glow * .05), '#cfdcf2', .25 + beat * .35 + a.glow * .3);
  }
  ctx.globalAlpha = 1;
}

// Leuchtspur der Waffe, in Weltkoordinaten gezeichnet
function drawTrail(ctx, a, col){
  const keep = 110;
  a.trail = a.trail.filter(s => a.t - s.t < keep);
  if (a.trail.length < 2) return;
  const pts = a.trail.map(s => ({ tip: toWorld(a, s.tip), mid: toWorld(a, s.mid), k: 1 - (a.t - s.t) / keep }));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 1; i < pts.length; i++){
    const p0 = pts[i - 1], p1 = pts[i];
    ctx.globalAlpha = .16 * p1.k;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(p0.mid[0], p0.mid[1]); ctx.lineTo(p0.tip[0], p0.tip[1]); ctx.lineTo(p1.tip[0], p1.tip[1]); ctx.lineTo(p1.mid[0], p1.mid[1]); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawWesen(ctx, a, alpha = 1){
  const L = a.look, H = a.H, p = a.pose, jit = a.shake > 0 ? (rnd() - .5) * H * .025 : 0;
  ctx.save();
  ctx.globalAlpha = alpha * a.alpha;
  const sx = a.x + a.face * p.x * H;
  let g = ctx.createRadialGradient(sx, a.gy, 1, sx, a.gy, H * .5);
  g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, a.gy + 2, H * .5, H * .06, 0, 0, TAU); ctx.fill();
  const paint = L.kind === 'spinne' ? paintSpinne : paintKrabbe;
  [[RIM, RIM, 1.4, -1.1, false], [INK, INK2, 0, 0, true]].forEach(([c, cB, dx, dy, main]) => {
    ctx.save(); ctx.translate(a.x + dx + jit, a.gy + a.sink + dy); ctx.scale(a.face, 1); ctx.rotate(p.rot);
    paint(ctx, a, H, c, cB, main);
    ctx.restore();
  });
  ctx.restore();
  if (a.trailUntil > a.t && a.sk){
    const t = a.sk.tip;
    a.trail.push({ tip: t, mid: [lerp(a.sk.chest[0], t[0], .6), lerp(a.sk.chest[1], t[1], .6)], t: a.t });
  }
}
function augen(ctx, a, pts, r){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const col = a.glow > .5 ? '#ff8a6a' : a.look.eyes;
  pts.forEach(([x, y]) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * (2.5 + a.glow * 2));
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = (.7 + a.glow * .3) * a.alpha; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * (2.5 + a.glow * 2), 0, TAU); ctx.fill();
    ctx.globalAlpha = a.alpha; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * .5, 0, TAU); ctx.fill();
  });
  ctx.restore();
}
// Salzkrabbe: breiter Panzer, sechs Beine, zwei Scheren
function paintKrabbe(ctx, a, H, col, colB, main){
  const p = a.pose, t = a.t;
  const cx = p.x * H, cy = -H * (.26 - p.f2 * .13) + p.y * H, bw = H * .34, bh = H * .15;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [-1, 1].forEach(side => {
    ctx.strokeStyle = side < 0 ? colB : col;
    for (let i = 0; i < 3; i++){
      const ax = cx + (i - 1) * bw * .45, ay = cy + bh * .3;
      const ph = Math.sin(t * .01 + i * 2 + side) * .025 * H;
      const kx = ax + (i - 1) * H * .12 + ph + side * H * .02, ky = cy - H * .04 - p.f2 * H * .05;
      const fx = ax + (i - 1) * H * .22 + ph * 1.5 + side * H * .03;
      seg(ctx, [ax, ay], [kx, ky], H * .032); seg(ctx, [kx, ky], [fx, 0], H * .024);
    }
  });
  // hintere Schere
  const schere = (raise, open, reach, c, back) => {
    ctx.strokeStyle = c; ctx.fillStyle = c;
    const s0 = [cx + bw * .7, cy + (back ? -bh * .1 : bh * .2)];
    const ang = -.2 - raise * 1.2, el = [s0[0] + Math.cos(ang) * H * .14, s0[1] + Math.sin(ang) * H * .14];
    const ang2 = ang + 1.1 - reach * .9, hand = [el[0] + Math.cos(ang2) * H * (.12 + reach * .1), el[1] + Math.sin(ang2) * H * (.12 + reach * .1)];
    seg(ctx, s0, el, H * .05); seg(ctx, el, hand, H * .045);
    const o = .25 + open * .6;
    [[-o, 1], [o * .6, .8]].forEach(([d, l]) => {
      const a2 = ang2 + d, tip = [hand[0] + Math.cos(a2) * H * .13 * l, hand[1] + Math.sin(a2) * H * .13 * l];
      ctx.beginPath(); ctx.moveTo(hand[0] - H * .02, hand[1] - H * .02);
      ctx.quadraticCurveTo(hand[0] + Math.cos(a2 - .4) * H * .1, hand[1] + Math.sin(a2 - .4) * H * .1, tip[0], tip[1]);
      ctx.lineTo(hand[0] + H * .02, hand[1] + H * .02); ctx.closePath(); ctx.fill();
    });
    return [hand[0] + Math.cos(ang2) * H * .1, hand[1] + Math.sin(ang2) * H * .1];
  };
  schere(p.b1, p.b2, 0, colB, true);
  // Panzer
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.lean * .6);
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, bw, bh, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 5; i++){
    const x = -bw * .7 + i * bw * .35;
    ctx.beginPath(); ctx.moveTo(x - H * .025, -bh * .8); ctx.lineTo(x, -bh * 1.25 - (i % 2) * H * .02); ctx.lineTo(x + H * .025, -bh * .8); ctx.fill();
  }
  ctx.strokeStyle = col; ctx.lineWidth = H * .014;
  const eye = [[bw * .55, -bh * 1.5 + Math.sin(t * .006) * H * .01], [bw * .8, -bh * 1.35 + Math.cos(t * .007) * H * .01]];
  eye.forEach(e => { ctx.beginPath(); ctx.moveTo(e[0] - H * .01, -bh * .6); ctx.lineTo(e[0], e[1]); ctx.stroke(); ctx.beginPath(); ctx.arc(e[0], e[1], H * .018, 0, TAU); ctx.fill(); });
  ctx.restore();
  const tip = schere(p.a1, p.a2, p.w, col, false);
  if (main){
    const c = Math.cos(p.lean * .6), s = Math.sin(p.lean * .6);
    const ew = eye.map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c]);
    augen(ctx, a, ew, H * .012);
    a.sk = { tip, chest: [cx, cy], head: ew[1], hip: [cx, cy], sho: [cx, cy], handA: tip, handB: tip, wAng: 1.6, hd: 0 };
  }
}
// Wrackspinne: Rumpf eines Bootes, acht Beine aus Rudern, Laternenaugen
function paintSpinne(ctx, a, H, col, colB, main){
  const p = a.pose, t = a.t;
  const cx = p.x * H, cy = -H * (.4 - p.f2 * .2) + p.y * H;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const thorax = [cx + H * .12, cy - H * .02];
  let frontTip = null;
  const bein = (side, i, c) => {
    ctx.strokeStyle = c; ctx.fillStyle = c;
    const hip = [thorax[0] - i * H * .05, thorax[1] + H * .02];
    const gait = Math.sin(t * .006 + i * 1.7 + side * 2) * H * .02;
    let foot = [cx + H * (.62 - i * .4) + gait + side * H * .03, 0];
    const raise = i === 0 ? (side > 0 ? p.a1 : p.b1) : 0;
    if (raise > .05){
      const r = Math.min(1, raise), tx = cx + H * (.5 + .45 * p.w), ty = cy - H * (.15 + .35 * Math.max(0, raise - p.w * .5));
      foot = [lerp(foot[0], tx, r), lerp(foot[1], ty, r)];
    }
    const knee = [(hip[0] + foot[0]) / 2 + (i < 2 ? .06 : -.06) * H, Math.min(hip[1], foot[1]) - H * (.26 + .05 * (i % 2)) + p.f2 * H * .1];
    seg(ctx, hip, knee, H * .034); seg(ctx, knee, foot, H * .024);
    // Ruderblatt am Ende
    const an = Math.atan2(foot[1] - knee[1], foot[0] - knee[0]);
    ctx.save(); ctx.translate(lerp(knee[0], foot[0], .8), lerp(knee[1], foot[1], .8)); ctx.rotate(an);
    ctx.beginPath(); ctx.ellipse(0, 0, H * .06, H * .02, 0, 0, TAU); ctx.fill(); ctx.restore();
    if (side > 0 && i === 0) frontTip = foot;
  };
  for (let i = 3; i >= 0; i--) bein(-1, i, colB);
  // Rumpf: kieloben liegendes Boot
  ctx.save(); ctx.translate(cx - H * .18, cy); ctx.rotate(p.lean * .5);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(H * .2, -H * .05); ctx.quadraticCurveTo(H * .05, -H * .26, -H * .38, -H * .12);
  ctx.quadraticCurveTo(-H * .46, -H * .02, -H * .34, H * .06); ctx.quadraticCurveTo(0, H * .1, H * .2, H * .04); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = H * .012;
  for (let k = 0; k < 3; k++){ ctx.beginPath(); ctx.moveTo(-H * .3, -H * (.08 - k * .05)); ctx.quadraticCurveTo(-H * .05, -H * (.18 - k * .06), H * .16, -H * (.03 - k * .03)); ctx.stroke(); }
  // Tau hängt herab
  ctx.lineWidth = H * .008; ctx.beginPath(); ctx.moveTo(-H * .2, H * .05); ctx.quadraticCurveTo(-H * .22 + Math.sin(t * .003) * H * .03, H * .2, -H * .18, H * .3); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(thorax[0], thorax[1], H * .1, 0, TAU); ctx.fill();
  for (let i = 3; i >= 0; i--) bein(1, i, col);
  if (main){

  function paintGround(g, s, R, gy){

  /* ---------- Bewegte Teile ---------- */
  function seedAmb(){

  function drawSea(ctx, t){
    const s = SC[scene]; if (!s.sea) return;

    ctx.lineWidth = 1;

// Welches Gespräch gerade dran ist
function gespraechFuer(id, D, ort){
  if (id === 'enna'){
    if (ort === 'turmtreppe' && D.merker.isolde) return 'enna_ende';
    if (ort === 'turmtreppe') return 'enna_treppe';
    if (!D.merker.enna1) return 'enna1';
    if (D.bosse.vogt && !D.merker.enna_vogt) return 'enna_vogt';
    return 'enna_rast';
  }
  if (id === 'mira'){
    if (!D.merker.mira1) return 'mira1';
    if ((D.items.helm || 0) > 0) return 'mira_helm';
    if (ort === 'feuer_velmora' && !D.merker.mira_velmora) return 'mira_velmora';
    return 'mira_handel';
  }
  if (id === 'kalden'){
    if (!D.merker.kalden1) return 'kalden1';
    if (D.merker.isolde) return 'kalden3';
    return 'kalden2';
  }
}

/* =====================================================================
   STIMME: eingebettete Sprachaufnahmen abspielen
   Tonhöhe, Hall und alle anderen Effekte stecken schon in der Aufnahme
   (siehe stimme.py). Während jemand spricht, wird die Musik leiser.
   ===================================================================== */
const Voice = (() => {
  const cache = {};
  let cur = null, curG = null, done = null, tok = 0;

  const has = id => typeof STIMMEN !== 'undefined' && !!STIMMEN[id];
  const ok = id => S.voice && S.sound && has(id) && !!Snd.ac();
  const whoOf = id => { const p = id.split('.')[0]; return SPRECHER[p] ? p : 'erzaehler'; };

  function decode(id){
    if (cache[id]) return cache[id];
    const bin = atob(STIMMEN[id]), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    cache[id] = new Promise((res, rej) => {
      try {
        // Ältere Safari-Versionen kennen nur die Rückruf-Form
        const p = Snd.ac().decodeAudioData(u.buffer, res, rej);
        if (p && p.then) p.then(res, rej);
      } catch (e) { rej(e); }
    });
    cache[id].catch(() => { delete cache[id]; });
    return cache[id];
  }
  function finish(v){ const f = done; done = null; if (f) f(v); }
  function stop(){
    tok++;
    if (cur){
      // Kurz ausblenden statt hart abzuschneiden, falls noch Hall nachklingt
      const ac = Snd.ac(), t = ac.currentTime;
      try { curG.gain.setTargetAtTime(0, t, .06); cur.onended = null; cur.stop(t + .35); } catch (e) {}
      cur = null; curG = null;
    }
    Music.duck(false);
    finish(false);
  }
  // Spielt eine Zeile ab. Das Versprechen erfüllt sich, wenn sie zu Ende ist oder abgebrochen wird.
  function say(id){
    stop();
    if (!ok(id)) return Promise.resolve(false);
    const my = tok;
    return new Promise(res => {
      done = res;
      decode(id).then(buf => {
        if (my !== tok) return;
        const sp = SPRECHER[whoOf(id)], ac = Snd.ac();
        const src = ac.createBufferSource(), g = ac.createGain();
        src.buffer = buf; g.gain.value = sp.laut;
        src.connect(g); Snd.out(g, 0);
        src.onended = () => { if (cur !== src) return; cur = null; Music.duck(false); finish(true); };
        cur = src; curG = g; Music.duck(true); src.start();
        // Weiter geht es, sobald die Worte gesprochen sind; der Hall klingt dabei aus
        const ende = STIMMEN_ENDE[id];
        if (ende) setTimeout(() => { if (my === tok) finish(true); }, ende * 1000);
      }, () => { if (my === tok) finish(false); });
    });
  }
  // Vorab entpacken, damit die erste Zeile einer Szene ohne Verzögerung kommt
  function warm(ids){ if (!Snd.ac()) return; ids.forEach(id => { if (has(id)) decode(id).catch(() => {}); }); }
  // Wie lange gesprochen wird, in Sekunden (für Untertitel)
  async function length(id){
    if (!ok(id)) return 0;
    if (STIMMEN_ENDE[id]) return STIMMEN_ENDE[id];
    try { return (await decode(id)).duration; } catch (e) { return 0; }
  }
  return { say, stop, warm, has, ok, length, speaking: () => !!cur };
})();

/* =====================================================================
   BÜHNE: die Figuren und ihre Plätze
   ===================================================================== */
const Stage = {
  P: null, E: null, N: null, showP: true, showE: false, showN: false, enterT: 0,
  place(){
    const [W, Hh] = World.size(), A = World.arenaW(), gy = World.groundY();
    const H = Math.min(Hh * .2, A * .42);
    if (this.P){ this.P.x = W / 2 - A * .22; this.P.gy = gy; this.P.H = H; }
    [this.E, this.N].forEach(a => {
      if (!a) return;
      const L = a.look, big = (L.scale || 1) > 1.3;
      // Breite Wesen wie die Spinne stehen näher an der Mitte, damit sie ganz ins Bild passen
      a.baseX = W / 2 + A * (L.breit ? .15 : big ? .26 : .2); a.gy = gy; a.H = H * (L.scale || 1);
      a.x = a.baseX + (a.enter || 0) * W * .5;
    });
  },
  // Spielfigur mit Herkunft und Ausrüstung
  hero(herk, waffe, schild){
    const w = WAFFEN[waffe] || WAFFEN.langschwert;
    const look = Object.assign({}, LOOK[herk] || LOOK.kron, { weapon: w.look, off: w.klasse === 'klinge' && schild ? (schild === 'glockenschild' ? 'glockenschild' : 'schild') : null, twoHand: w.klasse === 'speer' ? -.2 : w.klasse === 'wucht' ? .15 : 0 });
    const P = makeActor({ set: KLASSE_SET[w.klasse], look, face: 1 });
    if (this.P){ P.pose = this.P.pose; P.t = this.P.t; }
    this.P = P; this.place(); return P;
  },
  foe(key, enter = false){
    const d = FEINDE[key];
    this.E = makeActor({ set: d.set, look: LOOK[d.look || d.set], face: -1, enter: enter ? 1 : 0 });
    this.showE = true; this.place(); return this.E;
  },
  npc(key){
    const n = NPC[key];
    this.N = makeActor({ set: n.set || 'npc', look: LOOK[n.look], face: -1 });
    this.showN = true; this.place(); return this.N;
  },
  update(dt){
    [this.E, this.N].forEach(a => {
      if (!a || !a.enter) return;
      a.enter = Math.max(0, a.enter - dt / 700);
      const [W] = World.size(); a.x = a.baseX + EASE.out(a.enter) * W * .5;
    });
  }
};
const KLASSE_SET = { klinge: 'kron', speer: 'harp', wucht: 'moench' };

/* =====================================================================
   KAMPF: Reaktion. Gegner holen sichtbar aus, der Spieler weicht aus,
   blockt oder pariert im richtigen Moment.
   ===================================================================== */
const PARRY_WIN = 210, PARRY_CD = 480, DODGE = { dur: 500, i0: 30, i1: 380, perfect: 200 }, BUF = 320;

const Fight = (() => {
  let on = false, def = null, key = '', T = 0, hitStop = 0, slowUntil = 0, paused = false;
  let pl = null, en = null, W = null, P = null, E = null, onEnd = null, ended = false;
  let queue = [], idx = 0, glut = 0, dmgScale = 1;
  const tells = [], projs = [], eprojs = [];
  let stats = { parries: 0, perfect: 0, hits: 0, taken: 0 };
  const hook = { toast: () => {}, line: () => {}, foe: () => {} };

  /* ---------- Start ---------- */
  // o: { foes: [key, ...], profil, zustand: { hp, fp, flasks }, onEnd }
  function start(o){
    queue = o.foes.slice(); idx = 0; glut = 0; onEnd = o.onEnd; dmgScale = o.scale || 1;
    const pr = o.profil;
    W = pr.waffe;
    P = Stage.P;
    P.stance = null; P.anim = null; P.hideW = false; P.glow = 0;
    T = 0; hitStop = 0; slowUntil = 0; paused = false; ended = false;
    tells.length = 0; projs.length = 0; eprojs.length = 0;
    const z = o.zustand || {};
    pl = Object.assign({}, pr, {
      act: null, blockHeld: false, heavyHeld: false, blockPress: -1e9, lastParryTry: -1e9, lastSpend: -1e9,
      combo: 0, comboUntil: 0, buf: null
    });
    pl.hp = Math.min(pl.hpMax, z.hp == null ? pl.hpMax : z.hp);
    pl.fp = Math.min(pl.fpMax, z.fp == null ? pl.fpMax : z.fp);
    pl.flasks = z.flasks == null ? pl.flasksMax : z.flasks;
    pl.st = pl.stMax;
    stats = { parries: 0, perfect: 0, hits: 0, taken: 0 };
    World.setFlood(o.flood != null ? o.flood : World.sceneFlood()); World.setTint(0); World.setSlow(false);
    on = true;
    setupFoe(false);
  }
  function setupFoe(enter){
    key = queue[idx]; def = FEINDE[key];
    E = Stage.foe(key, enter);
    E.torn = false; E.glow = 0;
    const s = def.boss ? 1 : dmgScale;
    en = {
      hp: Math.round(def.hp * s), hpMax: Math.round(def.hp * s), pz: def.pz, pzMax: def.pz, st: 'idle', t0: 0,
      next: T + (enter ? 1500 : def.boss ? 3600 : 1300), move: null, hi: 0, told: [], trailed: [],
      phase: 1, lastPz: -1e9, hist: [], moves: def.moves, dmgMul: s, until: 0
    };
    tells.length = 0; eprojs.length = 0;
    hook.foe(def, idx, queue.length);
  }
  function stop(){ on = false; pl && (pl.blockHeld = false); World.setSlow(false); }
  function finish(result){
    if (ended) return;
    ended = true;
    setTimeout(() => {
      on = false;
      onEnd && onEnd(result, { hp: pl.hp, fp: pl.fp, flasks: pl.flasks, stats, glut, boss: def.boss ? key : null, idx });
    }, result === 'win' ? 1900 : 1800);
  }

  /* ---------- Spieler: Aktionen ---------- */
  const P_SET = () => SETS[P.set];
  function spend(c){ pl.st = Math.max(0, pl.st - c); pl.lastSpend = T; }
  function hasSt(c){ if (pl.st >= c * .5 && pl.st > 1) return true; hook.toast('st'); return false; }
  function act(k, o = {}){ pl.act = Object.assign({ k, t0: T, done: false }, o); }

  function startLight(){
    const i = T < pl.comboUntil ? (pl.combo + 1) % W.light.length : 0, L = W.light[i];
    if (!hasSt(L.st)) return true;
    spend(L.st); pl.combo = i; pl.comboUntil = T + L.dur + 260;
    act('light', { hit: L.hit, dur: L.dur, L });
    const S = P_SET();
    playAnim(P, [[0, S[L.pose + 'W']], [L.hit - 55, S[L.pose + 'W']], [L.hit, S[L.pose + 'S'], EASE.in], [L.hit + 90, S[L.pose + 'S']], [L.dur, S.idle]]);
    P.trailUntil = P.t + L.hit + 60;
    setTimeout(() => Snd.play('swing'), Math.max(0, L.hit - 80));
    return true;
  }
  // Schwerer Angriff: gedrückt ausholen, loslassen schlägt zu. Jede Waffe hat ihr eigenes Mindestausholen.
  function startHeavy(){
    if (!hasSt(W.heavy.st)) return true;
    spend(W.heavy.st);
    act('heavyW');
    playAnim(P, [[0, P_SET().hW]], true);
    return true;
  }
  function releaseHeavy(){
    const a = pl.act; if (!a || a.k !== 'heavyW') return;
    const H = W.heavy, held = T - a.t0, extra = Math.max(0, H.wind - held), charged = held >= H.wind + 420;
    const hit = H.hit + extra, dur = hit + H.dur;
    act('heavyS', { hit, dur, mult: charged ? 1.35 : 1 });
    const S = P_SET();
    playAnim(P, [[0, S.hW], [hit - 70, S.hW], [hit, S.hS, EASE.in], [hit + 140, S.hS], [dur, S.idle]]);
    P.trailUntil = P.t + hit + 80;
    if (charged){ P.glow = 1; World.pop(P.x, P.gy - P.H * 1.15, 'Aufgeladen', '#f4c08a', 13); }
    setTimeout(() => Snd.play('heavySwing'), Math.max(0, hit - 120));
  }
  function startDodge(){
    if (!hasSt(pl.dodgeSt)) return true;
    spend(pl.dodgeSt);
    act('dodge', { dur: DODGE.dur });
    const S = P_SET();
    playAnim(P, [[0, S.dodge], [300, S.dodge], [DODGE.dur, S.idle]]);
    Snd.play('dodge');
    World.ghost(P); setTimeout(() => on && World.ghost(P), 70); setTimeout(() => on && World.ghost(P), 150);
    return true;
  }
  function startParry(){
    const S = P_SET();
    if (T - pl.lastParryTry >= PARRY_CD){ pl.blockPress = T; pl.lastParryTry = T; }
    act('parry', { dur: 230 });
    playAnim(P, [[0, S.parry], [120, S.parry], [230, pl.blockHeld ? S.block : S.idle]]);
    return true;
  }
  function startHeal(){
    if (pl.flasks <= 0){ hook.toast('flask'); return true; }
    act('heal', { dur: 1000 });
    const S = P_SET();
    playAnim(P, [[0, S.heal], [800, S.heal], [1000, S.idle]]);
    return true;
  }
  function startArt(){
    const A = W.art;
    if (pl.fp < A.fp){ hook.toast('fp'); return true; }
    pl.fp -= A.fp;
    const hit = A.hits[0].t;
    act('art', { dur: A.dur, art: A, hitsDone: 0 });
    const S = P_SET();
    Snd.play('art');
    if (A.anim === 'sprung'){
      playAnim(P, [[0, S.artW], [200, S.artW], [380, S.artA, EASE.out], [hit, S.artS, EASE.in], [hit + 160, S.artS], [A.dur, S.idle]]);
    } else if (A.anim === 'wurf'){
      playAnim(P, [[0, S.artW], [200, S.artW], [260, S.artS, EASE.in], [460, S.artS], [A.dur, S.idle]]);
      setTimeout(() => { if (!on) return; P.hideW = true; projs.push({ t0: T, hit: hit - 240, back: 360, look: P.look.weapon }); }, 240);
    } else if (A.anim === 'wirbel'){
      const h2 = A.hits[1].t;
      playAnim(P, [[0, S.l2W], [hit - 60, S.l2W], [hit, S.l2S, EASE.in], [h2 - 70, S.l1W, EASE.io], [h2, S.l1S, EASE.in], [h2 + 120, S.l1S], [A.dur, S.idle]]);
    } else {
      playAnim(P, [[0, S.artW], [300, S.artA], [hit, S.artS, EASE.in], [hit + 220, S.artS], [A.dur, S.idle]]);
    }
    P.trailUntil = P.t + A.hits[A.hits.length - 1].t + 60;
    P.glow = 1;
    return true;
  }
  function startCrit(){
    act('crit', { hit: 380, dur: 820 });
    const S = P_SET();
    playAnim(P, [[0, S.l3W], [260, S.l3W], [380, S.crit, EASE.in], [560, S.crit], [820, S.idle]]);
    P.trailUntil = P.t + 440;
    return true;
  }

  function tryAct(k){
    const a = pl.act, t = a ? T - a.t0 : 0;
    if (pl.hp <= 0 || en.st === 'dead' || en.st === 'enter') return true;
    let free = !a || a.k === 'block';
    if (a && (a.k === 'light' || a.k === 'heavyS' || a.k === 'crit') && t >= a.hit + 70 && k !== 'flask' && k !== 'art') free = true;
    if (a && a.k === 'parry' && k === 'dodge') free = true;
    if (!free) return false;
    switch (k){
      case 'atk': return en.st === 'broken' ? startCrit() : startLight();
      case 'heavy': return startHeavy();
      case 'dodge': return startDodge();
      case 'block': return startParry();
      case 'art': return startArt();
      case 'flask': return startHeal();
    }
    return true;
  }
  function endAct(){
    const a = pl.act;
    pl.act = null;
    if (a && (a.k === 'art' || a.k === 'heavyS')) P.glow = 0;
    if (pl.blockHeld){ act('block'); P.stance = 'block'; } else P.stance = null;
    const b = pl.buf; pl.buf = null;
    if (b && T - b.t < BUF) tryAct(b.k);
  }

  /* ---------- Eingaben ---------- */
  function press(k){
    if (!on || paused || ended) return;
    if (k === 'block') pl.blockHeld = true;
    if (k === 'heavy') pl.heavyHeld = true;
    if (!tryAct(k)) pl.buf = { k, t: T };
  }
  function release(k){
    if (!on) return;
    if (k === 'block'){
      pl.blockHeld = false;
      if (pl.act && pl.act.k === 'block'){ pl.act = null; P.stance = null; }
    }
    if (k === 'heavy'){ pl.heavyHeld = false; if (pl.act && pl.act.k === 'heavyW') releaseHeavy(); }
  }

  /* ---------- Spieler: Ablauf pro Bild ---------- */
  function stepPlayer(){
    const a = pl.act; if (!a) return;
    const t = T - a.t0;
    if (a.k === 'heavyW' && (t >= W.heavy.wind + 900 || !pl.heavyHeld)) { releaseHeavy(); return; }
    if (a.hit != null && !a.done && t >= a.hit){ a.done = true; playerHits(a); }
    if (a.k === 'art'){
      const hs = a.art.hits;
      while (a.hitsDone < hs.length && t >= hs[a.hitsDone].t){ artHit(a.art, hs[a.hitsDone], a.hitsDone); a.hitsDone++; }
    }
    if (a.k === 'heal' && !a.healed && t >= 620){
      a.healed = true; pl.flasks--; const h = Math.round(pl.hpMax * pl.heal);
      pl.hp = Math.min(pl.hpMax, pl.hp + h);
      Snd.play('heal'); const c = chestPt(P); World.burst(c[0], c[1], 'heal', 18); World.pop(P.x, P.gy - P.H * 1.1, '+' + h, '#cfe3ff', 16);
    }
    if (a.dur && t >= a.dur) endAct();
  }
  function playerHits(a){
    if (a.k === 'light') return hitEnemy(a.L.d, a.L.pz, {});
    if (a.k === 'heavyS') return hitEnemy(W.heavy.d * a.mult, W.heavy.pz * a.mult, { heavy: true });
    if (a.k === 'crit') return hitEnemy(W.heavy.d * 2.4, 0, { crit: true, heavy: true });
  }
  function artHit(A, h, i){
    const c = chestPt(E);
    if (A.ring){
      Snd.play('geleut');
      const g = [P.x + P.H * .5, P.gy - P.H * .1], big = A.ring === 'gross';
      World.ring(g[0], g[1], 10, P.H * (big ? 2.4 : 1.6), 'rgba(230,220,190,.9)', big ? 900 : 700, 3);
      World.ring(g[0], g[1], 10, P.H * (big ? 1.7 : 1.1), 'rgba(200,225,255,.7)', 520, 2);
      World.shake(big ? 14 : 8);

  /* ---------- Gegner: Ablauf ---------- */

    // Harpune im Flug
    for (let i = projs.length - 1; i >= 0; i--){
      const pr = projs[i], t = T - pr.t0, total = pr.hit + 160 + pr.back;
      if (t > total){ projs.splice(i, 1); P.hideW = false; continue; }
      const hand = P.sk ? toWorld(P, P.sk.handA) : [P.x, P.gy - P.H * .6], tgt = chestPt(E);
      const k = t < pr.hit ? EASE.out(t / pr.hit) : t < pr.hit + 160 ? 1 : 1 - EASE.in((t - pr.hit - 160) / pr.back);
      const x = lerp(hand[0], tgt[0], k), y = lerp(hand[1], tgt[1], k);
      ctx.save(); ctx.strokeStyle = 'rgba(180,196,212,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hand[0], hand[1]);
      ctx.quadraticCurveTo((hand[0] + x) / 2, Math.max(hand[1], y) + 20 * (1 - k), x, y); ctx.stroke();
      ctx.translate(x, y); ctx.rotate(Math.atan2(tgt[1] - hand[1], tgt[0] - hand[0]));
      ctx.fillStyle = INK; ctx.strokeStyle = RIM; ctx.lineWidth = P.H * .016;
      ctx.beginPath(); ctx.moveTo(-P.H * .5, 0); ctx.lineTo(0, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -P.H * .03); ctx.lineTo(P.H * .12, 0); ctx.lineTo(0, P.H * .03); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  return {
    start, stop, update, drawFx, press, release, hook,
    on: () => on, def: () => def, pl: () => pl, en: () => en, key: () => key,
    count: () => [idx, queue.length], glut: () => glut,
    setPaused(v){ paused = v; if (v && pl){ pl.blockHeld = false; pl.heavyHeld = false; } },
    paused: () => paused,
    critReady: () => on && en && en.st === 'broken',
    debug: () => ({ T, pl, en, tells, W })
  };
})();

const lvlKosten = () => Math.round(90 * Math.pow(1.25, D.lvl - 1) / 10) * 10;

function tals(){ return D.tal.filter(k => k && D.tals[k]).map(k => TALISMANE[k]); }
function profil(waffe = D.waffe, attr = D.attr){
  const h = HERK[D.herk], w = WAFFEN[waffe], T = tals(), stufe = D.waffen[waffe] || 0;
  const mul = k => T.reduce((m, t) => m * (t[k] || 1), 1);
  const sh = w.klasse === 'klinge' && D.schild ? SCHILDE[D.schild] : null, kb = KLASSE_BLOCK[w.klasse];
  return {
    hpMax: Math.round((90 + attr.vit * 12) * mul('hp')), stMax: 80 + attr.aus * 8, fpMax: h.fp,
    flasksMax: D.flasksMax, heal: Math.max(.45, ...T.map(t => t.heal || 0)),
    waffe: w, dmgMul: (1 + .1 * stufe) * (1 + attr.str * w.skal.str + attr.ges * w.skal.ges) * mul('dmg'),
    block: sh ? sh.block : kb.block, blockSt: sh ? sh.st : kb.st, dodgeSt: w.dodgeSt || 22,
    stRegen: mul('stRegen'), pzMul: mul('pz'), parryFp: 10 * mul('parryFp')
  };
}
const hpJetzt = () => { const p = profil(); return D.hp == null ? p.hpMax : Math.min(p.hpMax, D.hp); };
function heldAufBuehne(){

}
// Gegenstände verteilen; gibt die Namen für die Anzeige zurück
function geben(g){
  const out = [];
  const add = (id, n = 1) => { D.items[id] = anzahl(id) + n; out.push(GEGENSTAENDE[id].name + (n > 1 ? ' ×' + n : '')); };
  if (g.item){
    const L = Array.isArray(g.item) ? (Array.isArray(g.item[0]) ? g.item : [g.item]) : [[g.item, 1]];
    L.forEach(([id, n]) => add(id, n));
  }
  if (g.tal && TALISMANE[g.tal]){
    D.tals[g.tal] = true;
    const frei = D.tal.indexOf(null);
    if (frei >= 0 && !D.tal.includes(g.tal)){ D.tal[frei] = g.tal; out.push(TALISMANE[g.tal].name + ' (angelegt)'); }
    else out.push(TALISMANE[g.tal].name);
  }
  if (g.schild && SCHILDE[g.schild]){ D.schilde[g.schild] = true; out.push(SCHILDE[g.schild].name); }
  if (g.waffe && WAFFEN[g.waffe]){ if (!(g.waffe in D.waffen)) D.waffen[g.waffe] = 0; out.push(WAFFEN[g.waffe].name); }
  return out;
}

const cv = $('#stage'), ctx = cv.getContext('2d');
let wt = 0, last = performance.now();
function resize(){
  const r = Math.min(2, window.devicePixelRatio || 1), b = $('#app').getBoundingClientRect();
  const w = Math.max(1, Math.round(b.width)), h = Math.max(1, Math.round(b.height));
  cv.width = Math.round(w * r); cv.height = Math.round(h * r);

function frame(now){
  const dt = Math.min(50, now - last); last = now; wt += dt;
  if (Fight.on()) Fight.update(dt);
  else {
    if (Stage.P) updateActor(Stage.P, dt);
    if (Stage.E && Stage.showE) updateActor(Stage.E, dt);
    if (Stage.N && Stage.showN) updateActor(Stage.N, dt);
  }

    D.st.ms += dt;

  }

  if (cur === 'fight' && Fight.pl()) hud(dt);

}
function draw(dt){
  const [W, Hh] = World.size();
  ctx.clearRect(0, 0, W, Hh);
  ctx.save();
  const [sx, sy] = World.camShake(); ctx.translate(sx, sy - World.camY());
  World.drawBack(ctx, wt);
  // Verlorene Glut am Boden
  if (D.drop && D.drop.ort === D.ort && (cur === 'ort' || cur === 'fight') && Stage.P && Stage.showP){
    const x = Stage.P.x - Stage.P.H * .55, y = Stage.P.gy - 3, r = Stage.P.H * .22 * (1 + Math.sin(wt * .004) * .1);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,190,120,.8)'); g.addColorStop(1, 'rgba(227,120,50,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, r, r * .45, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  World.drawGhosts(ctx);
  if (Stage.N && Stage.showN) drawActor(ctx, Stage.N);
  if (Stage.E && Stage.showE) drawActor(ctx, Stage.E);
  if (Stage.P && Stage.showP) drawActor(ctx, Stage.P);
  Fight.drawFx(ctx);
  World.drawFront(ctx, wt, dt);
  ctx.restore();
  World.drawOver(ctx);
}

function ortTexte(id, erst){
  const o = ORTE[id];

    if (o.boss || erst || !o.wieder) return (o.text || []).map((t, i) => ({ t, voice: id + '.' + i }));
    return [{ t: o.wieder }];
  }
  if (erst && o.text) return o.text.map((t, i) => ({ t, voice: id + '.' + i }));
  return [{ t: o.leer }];
}
// Aufstehende Gegner: Wer im Wrackfeld liegt, erhebt sich beim letzten Satz
function erheben(i, n){
  const E = Stage.E;
  if (!E || E.stance !== 'lie' || i !== n - 1) return;
  const S2 = SETS[E.set];
  E.stance = null; playAnim(E, [[0, S2.lie], [700, S2.kneel, EASE.io], [1500, S2.idle, EASE.io]]);
  Snd.play('rise');
}
function zeigeOrt(x = {}){
  const id = D.ort, o = ORTE[id];
  if (!x.behalten) ortBuehne();
  Music.play('amb');
  const texte = x.texte || ortTexte(id, false);
  panel({ place: o.name, texte, sofort: !x.texte, choices: x.choices || ortWahl(),
    onPara: i => erheben(i, texte.length) });
}
function ortWahl(){
  const id = D.ort, o = ORTE[id], L = [], nb = nachbarn(id);
  if (offen(id)){
    const boss = o.boss && FEINDE[o.boss];
    L.push({ t: boss ? (id === 'nebel' ? 'In den Nebel treten' : 'Sich stellen') : 'Kämpfen', sub: boss ? `${boss.name}, ${boss.title}` : feindListe(o), cls: 'main fight', fn: kampf });
  } else {
    if (o.feuer) L.push({ t: 'Am Leuchtfeuer rasten', sub: 'Leben und Phiolen füllen sich. Die Toten stehen wieder auf.', cls: 'fire', fn: rasten });
    npcsHier().forEach(n => L.push({ t: `Mit ${NPC[n].name} sprechen`, sub: NPC[n].titel, cls: 'talk', fn: () => gespraech(n, 'ort') }));
    (o.aktionen || []).forEach(a => { if (!D.aktionen[a.id] || a.wiederholbar) L.push({ t: a.t, fn: () => aktion(a) }); });
    nb.vor.forEach(n => {
      const s = gesperrt(n);
      L.push({ t: 'Weiter: ' + ORTE[n].name, sub: s || wegInfo(n), off: !!s, cls: !D.besucht[n] && !s ? 'main' : '', fn: () => reise(n) });
    });
  }
  nb.zurueck.forEach(n => L.push({ t: 'Zurück: ' + ORTE[n].name, sub: wegInfo(n), fn: () => reise(n) }));
  if (o.ende && D.ende) L.push({ t: 'Rückblick auf Akt I', fn: akt1Ende });
  return L;
}
function reise(id){ blende(() => geheZu(id)); }
function geheZu(id, how = 'weg'){
  const alt = O();
  D.von = how === 'weg' ? D.ort : null;
  D.ort = id;
  const o = ORTE[id], erst = !D.besucht[id], neueRegion = !Object.keys(D.besucht).some(k => ORTE[k].region === o.region);
  D.besucht[id] = true;
  if (o.region === 'velmora') D.merker.velmora = true;
  const noten = [];
  let neuFeuer = false;
  if (o.feuer && !D.lit[id]){ D.lit[id] = true; D.feuer = id; neuFeuer = true; }
  if (D.drop && D.drop.ort === id && !offen(id)) noten.push(glutAufheben());
  speichern();
  zeigeOrt({ texte: ortTexte(id, erst).concat(noten) });
  if (neuFeuer){ Snd.play('fire'); banner('Leuchtfeuer entfacht', 'fire', o.feuer, 2600); }
  else if (neueRegion && alt.region !== o.region){ Snd.play('heart'); banner(REGIONEN[o.region].name, 'region', '', 2600); }
}
function glutAufheben(){
  const n = D.drop.n; D.glut += n; D.drop = null;
  setTimeout(() => {
    const P = Stage.P; if (!P) return;
    World.glutFlow([P.x - P.H * .55, P.gy - 4], chestPt(P), 30); Snd.play('glut');
  }, 600);
  return { t: `Du findest deine Glut wieder: ${fmt(n)}.`, cls: 'gabe' };
}
function aktion(a){
  const texte = [{ t: a.text }];
  if (!D.aktionen[a.id]){
    D.aktionen[a.id] = true;
    if (a.gibt){ geben(a.gibt).forEach(g => texte.push({ t: 'Erhalten: ' + g, cls: 'gabe' })); Snd.play('glut'); }
  }
  speichern();
  panel({ place: O().name, texte, choices: ortWahl() });
}

/* ---------- Leuchtfeuer ---------- */
function rasten(){
  D.hp = null; D.fp = null; D.flasks = D.flasksMax; D.geraeumt = {}; D.feuer = D.ort;
  speichern();
  const P = Stage.P;
  playAnim(P, [[0, SETS[P.set].idle], [700, SETS[P.set].kneel, EASE.io]]); P.stance = 'kneel';

}
function feuerStats(){
  const p = profil();
  return [['Stufe', D.lvl], ['Glut', fmt(D.glut)], ['Leben', p.hpMax], ['Phiolen', D.flasksMax]].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
}
function feuerWahl(){
  const L = [], k = lvlKosten(), o = O();
  L.push({ t: 'Aufsteigen', sub: `Stufe ${D.lvl + 1} kostet ${fmt(k)} Glut`, fn: aufsteigen });
  if (anzahl('mondtau')) L.push({ t: 'Mondtau einsetzen', sub: `Eine Phiole mehr: ${D.flasksMax} → ${D.flasksMax + 1}`, fn: mondtau });
  if (o.amboss) L.push({ t: 'Am Amboss arbeiten', sub: 'Waffen schärfen, Nachhall zu Waffen gießen', fn: amboss });
  if (Object.keys(D.lit).length > 1) L.push({ t: 'Zu einem anderen Leuchtfeuer reisen', fn: karte });
  npcsHier().forEach(n => L.push({ t: `Mit ${NPC[n].name} sprechen`, sub: NPC[n].titel, cls: 'talk', fn: () => gespraech(n, 'feuer') }));
  L.push({ t: 'Aufbrechen', cls: 'main', fn: aufbrechen });
